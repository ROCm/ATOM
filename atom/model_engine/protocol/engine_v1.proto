//
// The wire protocol between a client (CoreManager today) and an EngineCore.
//
// One message is one ZMQ multipart: frame 0 is an `Envelope`, every later
// frame is raw bytes that a `BufferRef` in the envelope points into. Bulk data
// (prompt tokens, media tensors, completion tokens) therefore never passes
// through protobuf `bytes`, which would copy it on both ends.
//
// The data plane (submit / abort / shutdown and every Core output) carries no
// Python-specific type. The admin plane (`Utility`, `UtilityReply`) carries a
// pickled payload frame on purpose: its commands (weight sync, CUDA IPC,
// profiler) only exist for Python callers.
//
// Regenerate engine_v1_pb2.py with scripts/gen_engine_protocol.py.

syntax = "proto3";

package atom.engine.v1;

// ---------------------------------------------------------------- common ---

// A byte range inside frame `frame` (>= 1) of the same multipart message.
message BufferRef {
  uint32 frame = 1;
  uint64 offset = 2;
  uint64 nbytes = 3;
}

enum DType {
  DTYPE_UNSPECIFIED = 0;
  BOOL = 1;
  UINT8 = 2;
  INT8 = 3;
  INT16 = 4;
  UINT16 = 5;
  INT32 = 6;
  UINT32 = 7;
  INT64 = 8;
  UINT64 = 9;
  FLOAT16 = 10;
  BFLOAT16 = 11;
  FLOAT32 = 12;
  FLOAT64 = 13;
  COMPLEX64 = 14;
  COMPLEX128 = 15;
}

enum TensorKind {
  NUMPY = 0;         // numpy.ndarray
  TORCH = 1;         // torch.Tensor
  NUMPY_SCALAR = 2;  // numpy scalar (a 0-d array on the wire)
}

// A dense little-endian C-contiguous array.
message Tensor {
  BufferRef data = 1;
  DType dtype = 2;
  repeated int64 shape = 3;
  TensorKind kind = 4;
  string device = 5;        // torch only; empty means CPU
  bool requires_grad = 6;   // torch only
}

message ValueList {
  repeated Value items = 1;
}

message MapEntry {
  Value key = 1;
  Value value = 2;
}

message ValueMap {
  repeated MapEntry entries = 1;  // insertion order is preserved
}

// A typed value tree for the dict-shaped request fields (multimodal data,
// KV-transfer params, metrics). Keeps the distinctions a Python consumer can
// observe -- tuple vs list, int vs float -- so a decoded value is the value
// that was encoded.
message Value {
  oneof kind {
    bool null_value = 1;      // set to true; the value is None
    bool bool_value = 2;
    sint64 int_value = 3;
    string big_int_value = 4;  // decimal, for ints outside int64
    double float_value = 5;
    string string_value = 6;
    bytes bytes_value = 7;
    ValueList list_value = 8;
    ValueList tuple_value = 9;
    ValueMap map_value = 10;
    Tensor tensor_value = 11;
    // Python-only escape hatch: a pickled object the typed kinds cannot
    // express. Non-Python clients never send it.
    BufferRef pickled_value = 15;
  }
}

// ---------------------------------------------------------------- envelope -

message Envelope {
  uint32 protocol_version = 1;
  oneof body {
    // Client -> Core
    SubmitBatch submit = 10;
    Abort abort = 11;
    Utility utility = 12;
    Shutdown shutdown = 13;
    // Core -> Client
    Ready ready = 20;
    Completions completions = 21;
    StreamBatch stream = 22;
    Metrics metrics = 23;
    UtilityReply utility_reply = 24;
    Rejected rejected = 25;
    Stopped stopped = 26;
  }
}

// ---------------------------------------------------------------- requests -

message StringList {
  repeated string items = 1;
}

message StopStrings {
  oneof value {
    string single = 1;
    StringList many = 2;
  }
}

// Mirrors atom.SamplingParams field for field. An absent optional is None.
message SamplingParams {
  optional double temperature = 1;
  optional int64 top_k = 2;
  optional double top_p = 3;
  optional int64 max_tokens = 4;
  bool ignore_eos = 5;
  StopStrings stop_strings = 6;  // absent: None
  uint32 n = 7;
  oneof logprobs {               // absent: None
    bool logprobs_flag = 8;
    int64 logprobs_count = 9;
  }
}

message TokenIds {
  repeated int32 ids = 1;
}

// One sequence for the Core to admit. Mirrors the `Sequence` constructor;
// what the Core derives from its own config (block size, draft token count,
// per-request cache) is not on the wire.
message RequestSpec {
  uint64 seq_id = 1;
  BufferRef prompt_token_ids = 2;  // int32 little-endian
  SamplingParams sampling = 3;
  repeated TokenIds stop_token_sequences = 4;
  optional string external_request_id = 5;
  optional string parent_request_id = 6;
  uint32 sibling_index = 7;
  bool needs_independent_noise = 8;
  Value kv_transfer_params = 9;   // absent: None
  Value multimodal_data = 10;     // absent: None
  optional uint64 cache_seed = 11;  // the media content hash, when computed
  Value mrope_positions = 12;     // absent: None
  int64 mrope_position_delta = 13;
  optional int64 data_parallel_rank = 14;
  optional string dp_session_id = 15;
  optional string dp_parent_session_id = 16;
  double arrive_time = 17;
}

message SubmitBatch {
  repeated RequestSpec requests = 1;
}

message Abort {
  repeated uint64 seq_ids = 1;
}

// An admin command; `payload` is a pickled dict (Python callers only).
message Utility {
  string cmd = 1;
  BufferRef payload = 2;
}

message Shutdown {}

// ---------------------------------------------------------------- outputs --

message Ready {
  Value payload = 1;  // absent: None
}

// A finished sequence, as much of it as a client reads.
message Completion {
  uint64 seq_id = 1;
  BufferRef completion_token_ids = 2;  // int32
  BufferRef logprobs = 3;              // float64, one per completion token
  bool return_logprobs = 4;
  uint32 num_prompt_tokens = 5;
  uint32 num_cached_tokens = 6;
  double arrive_time = 7;
  double first_token_time = 8;
  double leave_time = 9;
  string leave_reason = 10;
  Value kv_transfer_params_output = 11;  // absent: None
  optional string external_request_id = 12;
  optional string parent_request_id = 13;
  uint32 sibling_index = 14;
}

message Completions {
  repeated Completion items = 1;
}

// One decode step's streamed deltas, column by column: entry i of every
// repeated field belongs to the same RequestOutput
// (atom.model_engine.request.RequestOutput). Columns, because this message is
// sent every step for every running sequence, and a packed column decodes in
// one call where a message per sequence costs one per field.
message StreamBatch {
  repeated uint64 seq_ids = 1;
  repeated int64 request_ids = 2;
  repeated uint32 token_counts = 3;  // how many of `tokens` each entry owns
  repeated int32 tokens = 4;         // every entry's output tokens, in order
  repeated bool finished = 5;
  repeated int64 num_cached_tokens = 6;
  map<uint32, string> finish_reasons = 7;            // by entry; absent: None
  map<uint32, Value> kv_transfer_params_outputs = 8;  // by entry; absent: None
}

message Metrics {
  Value snapshot = 1;
}

// The reply to a `Utility`; `payload` is a pickled object.
message UtilityReply {
  BufferRef payload = 1;
}

// Sequences the Core could not admit. Each ends the request it names.
message RejectedRequest {
  uint64 seq_id = 1;
  string reason = 2;
}

message Rejected {
  repeated RejectedRequest items = 1;
}

// The Core is going away; no message follows.
message Stopped {}
