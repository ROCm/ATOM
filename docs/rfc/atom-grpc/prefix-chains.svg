<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="title desc"><title id="title">Prefix block hashes for token-id prompts</title><desc id="desc">Turn N+1 shares turn N's leading tokens; TokenPrefixChains copies the 7,500 shared block hashes and hashes only the 125 new blocks.</desc><defs><marker id="h0969da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="h1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="h1f2328" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="h57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="h8250df" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="h8c959f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="hbf8700" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf8700"/></marker><marker id="hcf222e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker></defs><rect x="0.5" y="0.5" width="999" height="659" rx="14" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start">Prefix block hashes for prompts sent as token ids</text><rect x="24" y="51" width="14" height="14" rx="3" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/><text x="44" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">hash copied from the stored prompt</text><rect x="275.6" y="51" width="14" height="14" rx="3" fill="#fff8c5" stroke="#bf8700" stroke-width="1.2"/><text x="295.6" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">hashed now</text><rect x="373.6" y="51" width="14" height="14" rx="3" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/><text x="393.6" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">TokenPrefixChains (A)</text><rect x="542.0" y="51" width="14" height="14" rx="3" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/><text x="562.0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">unchanged engine</text><text x="24" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Turn N</text><text x="104" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="start">120,000 tokens = 7,500 blocks of 16; chain: h[k] = H(h[k-1], block k)</text><rect x="24" y="112" width="76" height="52" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/><text x="62" y="133" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#57606a" text-anchor="middle">ids 0-15</text><text x="62" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#57606a" text-anchor="middle">h[1]</text><line x1="102" y1="138" x2="116" y2="138" stroke="#57606a" stroke-width="1.2" marker-end="url(#h57606a)"/><rect x="118" y="112" width="76" height="52" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/><text x="156" y="133" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#57606a" text-anchor="middle">ids 16-31</text><text x="156" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#57606a" text-anchor="middle">h[2]</text><line x1="196" y1="138" x2="210" y2="138" stroke="#57606a" stroke-width="1.2" marker-end="url(#h57606a)"/><text x="234.0" y="143" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#57606a" text-anchor="middle">...</text><line x1="258" y1="138" x2="272" y2="138" stroke="#57606a" stroke-width="1.2" marker-end="url(#h57606a)"/><rect x="274" y="112" width="76" height="52" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/><text x="312" y="133" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#57606a" text-anchor="middle">..119,983</text><text x="312" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#57606a" text-anchor="middle">h[7499]</text><line x1="352" y1="138" x2="366" y2="138" stroke="#57606a" stroke-width="1.2" marker-end="url(#h57606a)"/><rect x="368" y="112" width="76" height="52" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/><text x="406" y="133" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#57606a" text-anchor="middle">..119,999</text><text x="406" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#57606a" text-anchor="middle">h[7500]</text><text x="560" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">stored with its tokens and chain in</text><text x="560" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">TokenPrefixChains' LRU, sized by</text><text x="560" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#0550ae" text-anchor="start">ATOM_TOKENIZE_CACHE_MB</text><text x="24" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Turn N+1</text><text x="104" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="start">turn N's 120,000 tokens + 2,000 new = 7,625 blocks, as token ids</text><rect x="24" y="244" width="76" height="52" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/><text x="62" y="265" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#116329" text-anchor="middle">ids 0-15</text><text x="62" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#116329" text-anchor="middle">h[1]</text><line x1="102" y1="270" x2="116" y2="270" stroke="#57606a" stroke-width="1.2" marker-end="url(#h57606a)"/><rect x="118" y="244" width="76" height="52" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/><text x="156" y="265" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#116329" text-anchor="middle">ids 16-31</text><text x="156" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#116329" text-anchor="middle">h[2]</text><line x1="196" y1="270" x2="210" y2="270" stroke="#57606a" stroke-width="1.2" marker-end="url(#h57606a)"/><text x="234.0" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#57606a" text-anchor="middle">...</text><line x1="258" y1="270" x2="272" y2="270" stroke="#57606a" stroke-width="1.2" marker-end="url(#h57606a)"/><rect x="274" y="244" width="76" height="52" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/><text x="312" y="265" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#116329" text-anchor="middle">..119,999</text><text x="312" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#116329" text-anchor="middle">h[7500]</text><line x1="352" y1="270" x2="366" y2="270" stroke="#57606a" stroke-width="1.2" marker-end="url(#h57606a)"/><rect x="368" y="244" width="76" height="52" rx="6" fill="#fff8c5" stroke="#bf8700" stroke-width="1.2"/><text x="406" y="265" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#7d4e00" text-anchor="middle">120,000..</text><text x="406" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#7d4e00" text-anchor="middle">h[7501]</text><line x1="446" y1="270" x2="460" y2="270" stroke="#57606a" stroke-width="1.2" marker-end="url(#h57606a)"/><text x="484.0" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#57606a" text-anchor="middle">...</text><line x1="508" y1="270" x2="522" y2="270" stroke="#57606a" stroke-width="1.2" marker-end="url(#h57606a)"/><rect x="524" y="244" width="76" height="52" rx="6" fill="#fff8c5" stroke="#bf8700" stroke-width="1.2"/><text x="562" y="265" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#7d4e00" text-anchor="middle">..121,999</text><text x="562" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#7d4e00" text-anchor="middle">h[7625]</text><path d="M 24 304 L 24 312 L 350 312 L 350 304" fill="none" stroke="#1a7f37" stroke-width="1.6"/><text x="187.0" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#116329" text-anchor="middle">7,500 shared blocks: hashes copied</text><path d="M 368 304 L 368 312 L 600 312 L 600 304" fill="none" stroke="#bf8700" stroke-width="1.6"/><text x="484.0" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7d4e00" text-anchor="middle">125 new blocks: hashed</text><text x="784" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">no text arrives: over gRPC,</text><text x="784" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">or /v1/completions with</text><text x="784" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start">prompt_token_ids</text><rect x="24" y="360" width="610" height="158" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/><text x="38" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0550ae" text-anchor="start">TokenPrefixChains, in ATOM's API process (preprocess)</text><text x="38" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0550ae" text-anchor="start">1.</text><text x="58" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">Find the stored prompt sharing the most leading tokens: records sort</text><text x="38" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0550ae" text-anchor="start"></text><text x="58" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">by their token bytes, so it sits beside the new one; a compare sizes it.</text><text x="38" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0550ae" text-anchor="start">2.</text><text x="58" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">Copy the hashes of the complete blocks inside that shared prefix.</text><text x="38" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0550ae" text-anchor="start">3.</text><text x="58" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">Hash only the blocks after it; store the new prompt with its chain.</text><text x="38" y="492" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0550ae" text-anchor="start">4.</text><text x="58" y="492" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">Check the first 4 reuses against a full rehash; a mismatch turns reuse off.</text><line x1="636" y1="439" x2="682" y2="439" stroke="#0969da" stroke-width="2" marker-end="url(#h0969da)"/><text x="659" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0550ae" text-anchor="middle">chain</text><rect x="686" y="360" width="290" height="158" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/><text x="700" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#57606a" text-anchor="start">EngineCore, BlockManager</text><text x="700" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">finds the KV prefix-cache hit by</text><text x="700" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">the chain, as for any request;</text><text x="700" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">checks every shipped chain and</text><text x="700" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">rejects a wrong one, counted as</text><text x="700" y="492" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start">shipped_chains_rejected</text><rect x="24" y="540" width="470" height="96" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/><text x="38" y="563" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606a" text-anchor="start">Over HTTP (text prompts): unchanged</text><text x="38" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">The text-keyed tokenizer cache keeps each prompt's</text><text x="38" y="603" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">ids and chain; the next turn reuses them up to the</text><text x="38" y="621" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">shared text. A token-id prompt has none: it rehashed all.</text><rect x="506" y="540" width="470" height="96" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/><text x="520" y="563" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#116329" text-anchor="start">Measured: AgentX replay on a fake instance</text><text x="520" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">first 5 sessions, over Generate and over the Session</text><text x="520" y="607" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#116329" text-anchor="start">97.51% of complete blocks reused</text><text x="520" y="626" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#116329" text-anchor="start">0 chains rejected by BlockManager</text></svg>
