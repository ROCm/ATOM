<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-labelledby="title desc"><title id="title">Parity verification design</title><desc id="desc">Each request goes through atomesh's HTTP path and its gRPC path to the same ATOM instances; the two are compared on tokens, responses, P/D parameters, accuracy and performance.</desc><defs><marker id="h0969da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="h1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="h1f2328" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="h57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="h8250df" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="h8c959f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="hbf8700" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf8700"/></marker><marker id="hcf222e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker></defs><rect x="0.5" y="0.5" width="999" height="719" rx="14" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start">How parity was checked: one request, two front doors, five levels</text><rect x="24" y="51" width="14" height="14" rx="3" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/><text x="44" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">HTTP door: the reference</text><rect x="211.60000000000002" y="51" width="14" height="14" rx="3" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/><text x="231.60000000000002" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">gRPC door: under test</text><rect x="380.0" y="51" width="14" height="14" rx="3" fill="#fbefff" stroke="#8250df" stroke-width="1.2"/><text x="400.0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">atomesh</text><rect x="458.8" y="51" width="14" height="14" rx="3" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/><text x="478.8" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">result</text><rect x="24" y="148" width="120" height="60" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/><text x="84" y="173" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">the same</text><text x="84" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">request</text><path d="M 144 168 C 172 168, 170 118, 196 118" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#h57606a)"/><path d="M 144 188 C 172 188, 170 238, 196 238" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#h0969da)"/><rect x="198" y="96" width="150" height="44" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.2"/><text x="273" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6639ba" text-anchor="middle">atomesh</text><text x="273" y="131" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#6639ba" text-anchor="middle">http:// worker</text><line x1="348" y1="118" x2="386" y2="118" stroke="#8c959f" stroke-width="1.8" marker-end="url(#h8c959f)"/><rect x="388" y="96" width="176" height="44" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/><text x="476" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#57606a" text-anchor="middle">ATOM HTTP routes</text><text x="476" y="131" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">render, tokenize, parse</text><rect x="198" y="216" width="150" height="44" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.2"/><text x="273" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6639ba" text-anchor="middle">atomesh</text><text x="273" y="251" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#6639ba" text-anchor="middle">grpc:// worker</text><line x1="348" y1="238" x2="386" y2="238" stroke="#0969da" stroke-width="1.8" marker-end="url(#h0969da)"/><rect x="388" y="216" width="176" height="44" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/><text x="476" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0550ae" text-anchor="middle">ATOM gRPC server</text><text x="476" y="251" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0550ae" text-anchor="middle">token ids only</text><path d="M 564 118 C 590 118, 590 168, 612 168" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#h57606a)"/><path d="M 564 238 C 590 238, 590 188, 612 188" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#h0969da)"/><rect x="614" y="138" width="362" height="80" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/><text x="628" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#57606a" text-anchor="start">the same ATOM instances, build and nodes</text><text x="628" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">CPU: ATOM's own server, scheduler and P/D</text><text x="628" y="197" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">connectors on a fake model runner</text><text x="628" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">GPU: MI355X, DeepSeek-V4.1-Flash</text><text x="24" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start">What was compared, from the wire inward</text><rect x="24" y="312" width="952" height="70" rx="8" fill="#fbfcfd" stroke="#d0d7de" stroke-width="1.2"/><rect x="24" y="312" width="140" height="70" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/><text x="36" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#116329" text-anchor="start">1  Tokens</text><text x="178" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start">prompt ids ATOM admits, stop ids, output ids</text><text x="178" y="355" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">GPU: 21 GSM8K + 38 AgentX and tool-call chats, up to 690,728 tokens;</text><text x="178" y="371" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">CPU: 363 AgentX prompts through 5 encoders; fake engine: its record</text><rect x="842" y="333" width="122" height="28" rx="14" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/><text x="903" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#116329" text-anchor="middle">59 / 59 equal</text><rect x="24" y="392" width="952" height="70" rx="8" fill="#fbfcfd" stroke="#d0d7de" stroke-width="1.2"/><rect x="24" y="392" width="140" height="70" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/><text x="36" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#116329" text-anchor="start">2  Response</text><text x="178" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start">JSON fields, SSE chunks, finish_reason, usage, cached_tokens</text><text x="178" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">content and reasoning_content, stops, refusal status and message: CPU harness</text><text x="178" y="451" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">against the HTTP route; Rust tests and SSE goldens; GPU: tool calls, cancel</text><rect x="842" y="413" width="122" height="28" rx="14" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/><text x="903" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#116329" text-anchor="middle">as HTTP</text><rect x="24" y="472" width="952" height="70" rx="8" fill="#fbfcfd" stroke="#d0d7de" stroke-width="1.2"/><rect x="24" y="472" width="140" height="70" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/><text x="36" y="512" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#116329" text-anchor="start">3  P/D</text><text x="178" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start">kv_transfer_params, DP rank and sampling at P and at D</text><text x="178" y="515" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">relay and chunked; P DP2 + D DP4, both rank mappings; 22 ranks, 2,000</text><text x="178" y="531" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">requests; failures, timeouts and cancels end as over HTTP</text><rect x="842" y="493" width="122" height="28" rx="14" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/><text x="903" y="512" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#116329" text-anchor="middle">as HTTP</text><rect x="24" y="552" width="952" height="70" rx="8" fill="#fbfcfd" stroke="#d0d7de" stroke-width="1.2"/><rect x="24" y="552" width="140" height="70" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/><text x="36" y="592" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#116329" text-anchor="start">4  Accuracy</text><text x="178" y="575" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start">GSM8K, 1,319 questions, lm_eval chat, 1P1D, two runs per door</text><text x="178" y="595" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">gRPC 0.9303 / 0.9287, HTTP 0.9272 / 0.9295; empty answers 23 and 23;</text><text x="178" y="611" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">paired McNemar chi2 at most 0.20 between any gRPC and HTTP run</text><rect x="842" y="573" width="122" height="28" rx="14" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/><text x="903" y="592" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#116329" text-anchor="middle">no gap</text><rect x="24" y="632" width="952" height="70" rx="8" fill="#fbfcfd" stroke="#d0d7de" stroke-width="1.2"/><rect x="24" y="632" width="140" height="70" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/><text x="36" y="672" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#116329" text-anchor="start">5  Performance</text><text x="178" y="655" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start">one build; only the front door differs</text><text x="178" y="675" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">zero-forward fake engines at C1228 and C64; tokenizer on one core;</text><text x="178" y="691" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">GPU 6P16D AgentX C1228, two runs each of HTTP, gRPC, Session</text><rect x="842" y="653" width="122" height="28" rx="14" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/><text x="903" y="672" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#116329" text-anchor="middle">see Results</text></svg>
