name: Slurm ATOM Accuracy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

env:
  ATOM_BASE_IMAGE: rocm/atom-dev:latest
  ATOM_PYTHON_TAG: "cp312"
  CONTAINER_NAME: atom_slurm_gpt_oss_120b
  MODEL_NAME: gpt-oss-120b
  MODEL_PATH: openai/gpt-oss-120b
  MODEL_EXTRA_ARGS: --kv_cache_dtype fp8 --gpu-memory-utilization 0.5
  ACCURACY_THRESHOLD: "0.87"
  CLIENT_COMMAND: >-
    lm_eval --model local-chat-completions --apply_chat_template
    --model_args model=${MODEL_PATH},base_url=http://localhost:8000/v1/chat/completions,num_concurrent=65,max_retries=3,max_gen_toks=2048,tokenized_requests=False,trust_remote_code=True
    --tasks gsm8k --num_fewshot 3 --output_path ${OUTPUT_PATH}

jobs:
  gpt-oss-120b-gsm8k:
    name: Accuracy gpt-oss-120b GSM8K
    runs-on: [self-hosted, spur-runner-mi355x-8gpu]
    timeout-minutes: 45
    steps:
      - name: Checkout ATOM repo
        uses: actions/checkout@v6

      - name: Download aiter wheel
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AITER_WHEEL_OUTPUT_DIR: /tmp/aiter-whl
        run: bash .github/scripts/download_aiter_wheel.sh

      - name: Start CI container
        uses: ./.github/actions/setup-gpu-container
        with:
          container-name: ${{ env.CONTAINER_NAME }}
          base-image: ${{ env.ATOM_BASE_IMAGE }}
          runner: spur-runner-mi355x-8gpu
          hf-token: ${{ secrets.AMD_HF_TOKEN }}
          network-host: "true"

      - name: Show GPU visibility
        run: |
          set -euo pipefail
          hostname
          echo "ROCR_VISIBLE_DEVICES=${ROCR_VISIBLE_DEVICES:-}"
          echo "HIP_VISIBLE_DEVICES=${HIP_VISIBLE_DEVICES:-}"
          rocm-smi || true
          docker exec "$CONTAINER_NAME" bash -lc 'env | sort | grep -E "^(ROCR_VISIBLE_DEVICES|HIP_VISIBLE_DEVICES|CUDA_VISIBLE_DEVICES)=" || true'

      - name: Collect GPU info
        id: gpu-info
        env:
          COLLECT_VERBOSE_GPU_INFO: "1"
        run: bash .github/scripts/collect_gpu_info.sh "$CONTAINER_NAME" docker "spur-runner-mi355x-8gpu"

      - name: Install aiter from wheel
        env:
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          AITER_WHL_DIR: /tmp/aiter-whl
        run: bash .github/scripts/install_aiter_wheel.sh

      - name: Install ATOM and dependencies
        run: |
          set -euo pipefail
          docker exec "$CONTAINER_NAME" bash -lc "
            set -euo pipefail
            pip install --timeout 60 --retries 10 -U 'lm-eval[api]'
            pip install --timeout 60 --retries 10 hf_transfer
            pip install --timeout 60 --retries 10 --upgrade 'pybind11>=3.0.1'
            cd /workspace
            git config --global --add safe.directory /workspace
            pip install -e .
            pip show atom | grep -E '^(Name|Version):'
          "

      - name: Download model
        timeout-minutes: 150
        env:
          HF_TOKEN: ${{ secrets.AMD_HF_TOKEN }}
        run: |
          set -euo pipefail
          docker exec \
            -e HF_TOKEN="${HF_TOKEN:-}" \
            -e MODEL_ID="${MODEL_PATH}" \
            -e TARGET_DIR="/models/${MODEL_PATH}" \
            -e MODEL_DOWNLOAD_TIMEOUT="30m" \
            -e MODEL_LOCK_WAIT_SECONDS="1800" \
            -e MODEL_LOCK_POLL_INTERVAL="30" \
            -e MODEL_PROGRESS_INTERVAL="60" \
            "$CONTAINER_NAME" \
            bash -lc '
              set -euo pipefail
              cd /workspace
              if [ -d /models ]; then
                bash .github/scripts/download_model_with_lock.sh "$MODEL_ID" "$TARGET_DIR"
              else
                echo "No /models mount. The server will fetch from the hub if needed."
              fi
            '

      - name: Run GSM8K accuracy
        timeout-minutes: 30
        env:
          MODEL_EXTRA_ARGS: ${{ env.MODEL_EXTRA_ARGS }}
          CLIENT_COMMAND: ${{ env.CLIENT_COMMAND }}
        run: |
          set -euo pipefail
          mkdir -p accuracy_test_results
          if docker exec "$CONTAINER_NAME" test -d "/models/${MODEL_PATH}"; then
            model_path="/models/${MODEL_PATH}"
          else
            model_path="${MODEL_PATH}"
          fi

          echo "Launching ${MODEL_NAME} from ${model_path}"
          echo ".github/scripts/atom_test.sh launch $model_path $MODEL_EXTRA_ARGS" | \
            docker exec -e ATOM_DEBUG_DEVICE_MAPPING="1" -i "$CONTAINER_NAME" bash -l

          echo "Running GSM8K accuracy"
          docker exec \
            -e CLIENT_COMMAND="${CLIENT_COMMAND}" \
            -e GPU_NAME="${{ steps.gpu-info.outputs.gpu_name }}" \
            -e GPU_VRAM_GB="${{ steps.gpu-info.outputs.gpu_vram_gb }}" \
            -e ROCM_VERSION="${{ steps.gpu-info.outputs.rocm_version }}" \
            "$CONTAINER_NAME" bash -lc "
              cd /workspace
              .github/scripts/atom_test.sh accuracy $model_path
            " 2>&1 | tee atom_accuracy_output.txt

      - name: Check result file
        if: success()
        env:
          ACCURACY_THRESHOLD: ${{ env.ACCURACY_THRESHOLD }}
        run: |
          set -euo pipefail
          result_file=$(ls -1t accuracy_test_results/*.json 2>/dev/null | head -n 1)
          if [ -z "$result_file" ]; then
            echo "ERROR: No results JSON file found in accuracy_test_results/"
            exit 2
          fi
          echo "RESULT_FILE=$result_file"
          score=$(python3 - "$result_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          print(data["results"]["gsm8k"].get("exact_match,flexible-extract"))
          PY
          )
          echo "Flexible extract value: $score"
          awk -v val="$score" -v threshold="$ACCURACY_THRESHOLD" 'BEGIN {exit (val < threshold) ? 1 : 0}' || {
            echo "Accuracy test failed: $score < $ACCURACY_THRESHOLD"
            exit 1
          }
          echo "Accuracy test passed: $score >= $ACCURACY_THRESHOLD"

      - name: Dump server log
        if: always()
        run: docker exec "$CONTAINER_NAME" cat /tmp/atom_server.log 2>/dev/null || true

      - name: Dump client log
        if: always()
        run: docker exec "$CONTAINER_NAME" cat /tmp/atom_client.log 2>/dev/null || true

      - name: Upload accuracy output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slurm-gpt-oss-120b-gsm8k-output
          path: |
            atom_accuracy_output.txt
            accuracy_test_results/*.json
          if-no-files-found: ignore

      - name: Clean up
        if: always()
        run: |
          docker stop "$CONTAINER_NAME" || true
          docker rm "$CONTAINER_NAME" || true
