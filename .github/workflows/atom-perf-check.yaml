name: ATOM Perf Check (PR)

# Opt-in, non-blocking performance check for pull requests.
#
# Measures the merge-base and the PR head back to back inside ONE job, so both
# halves land on the same machine and the same container instance. GitHub
# Actions offers no way to pin two jobs to one machine, which is why this
# cannot reuse benchmark-tmpl.yml (one job per concurrency level).
#
# The pairing is not a preference. Per-image historical baselines do not exist:
# across 52 deduplicated perf runs on the public dashboard, 30 of 39 images were
# benchmarked exactly once and only 3 reached three runs, while cross-image
# comparison spreads 11-21% against 0.57% median CV within one image.
#
# Because the workspace is bind-mounted into the container (setup-gpu-container
# passes -v "$GITHUB_WORKSPACE":/workspace), switching commits is a host-side
# `git checkout` that the running container picks up immediately. No second
# container, and no new script duplicating benchmark-tmpl.yml's launch/bench
# logic -- atom_test.sh already does all of it.
#
# This workflow does not produce absolute numbers, by design. Three lines
# divide the work: atom-benchmark.yaml runs real weights nightly and owns the
# dashboard and every figure quoted outside the repo; this one, and the
# per-commit check that will follow it, are regression detectors -- they answer
# "did this move against its own pair" and nothing else. Which is why dummy
# weights are the right trade here and would not be there.
#
# The comparison is to an aiter operator test: synthetic inputs, deterministic
# behaviour, repeatability bought with realism. One difference is worth keeping
# in view. An operator test covers each operator explicitly, on shapes and
# distributions chosen for it. This is one synthetic workload whose operator
# mix `--fake-eplb` has changed -- MoE grouped-GEMM is amplified because every
# expert is lit each step, and attention's share is correspondingly damped. So
# the sensitivity this line offers is not uniform across operators, and a claim
# that it covers attention-side regressions would need its own evidence.
#
# Weights are loaded dummy (`DUMMY_WEIGHT_ARGS`, appended to every phase by
# perf_check_half.sh). Model load is 76% of the benchmark it precedes on these
# runners -- 297s median against a 369s DeepSeek-V4-Pro cell, measured from 31
# jobs of ATOM Benchmark run 35121706150 -- and this job pays it three times.
# The trade is a 20.2% slower benchmark and absolute numbers that no longer
# line up with the dashboard; the net is about 13 minutes off a DeepSeek job at
# c=32 and 9 at c=256, measured rather than projected.
# Clear the variable to measure on real weights. Full rationale, measurements
# and caveats live next to the append point in perf_check_half.sh.
#
# Both levels decide the verdict: JUDGE_MIN_CONC is 32, so c=32 is judged
# rather than shown. That is a knowing trade -- c=32's own run-to-run spread
# is 2.2% for a tp>=4 MoE against 0.5-1.2% at c=256, and DOWN_EPS_PCT is
# -2.0%, so this level can cross the "down" line on noise alone. It is here
# because two jobs per entry is the budget, and a pair has to span the range.
#
# This workflow never fails the PR. It posts a comment and writes a step
# summary; the merge decision stays with the reviewer.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, ready_for_review]

concurrency:
  group: perf-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

# Five entries across two concurrency levels, 10 jobs. It was a single-entry
# smoke until d76360456; the matrix step now fails on a short matrix rather
# than letting a typo surface at the judge as `partial`.
# Narrowing for an experiment is a change to this block and nothing else.
#
# Two levels is the floor: FAMILY_MIN_CONFIGS in perf_judge.py is 2, and a
# verdict taken over a pair is a mean, not a median. Dropping to one level
# leaves every family `insufficient`, which the report states is not a pass.
env:
  # Catalog prefixes, not display names -- MiniMax-M3-MXFP8 is `m3-mxfp8` here.
  # DeepSeek-V4-Pro MTP3 is added automatically alongside its base by the matrix
  # step, so four names produce five entries.
  PERF_MODELS: deepseek-v4-pro,kimi-k3,m3-mxfp8,glm-5-2-fp8
  PERF_ISL: 8192
  PERF_OSL: 1024
  PERF_RATIO: "0.8"
  PERF_JUDGING_CONCS: 32,256
  # Empty: every level this line runs is judged. c=4 was the reference level
  # and went with the rest -- at two jobs per entry there is no room for a
  # level that contributes no detection.
  PERF_REFERENCE_CONCS: ""
  PERF_EXPECTED_ENTRIES: 5
  # Measured-window length per level, as a multiple of the level. Unlisted
  # levels run the nightly's CONC * 10; c=32 is one of them, where the window
  # is only 298s and shortening it would buy ~2.5 min on a job that is not the
  # one setting the wall clock.
  #
  # c=256 is. Three phases of 1307s make it 50.6 min against c=32's 18.5, 73%
  # of the matrix's machine time, and the longest single job is the floor the
  # whole run waits on. The window is linear in this number (at c=64, 64
  # prompts took 98.03s and 640 took 982.64s -- 10.02x), so x4 takes that
  # window from 982s to 393s and the job to ~31 min.
  #
  # What x4 does not cost: --seed is pinned, so base and head draw identical
  # prompts and identical output lengths. Workload sampling contributes nothing
  # to the delta at either length -- the shorter window averages run-level
  # noise (thermal, clock, scheduling) over less time, and nothing else.
  #
  # Measured since: on mi355-gpu-41 three readings of one commit spanned 0.34
  # points, and in CI the shipped matrix gave -1.1 to +2.4 across ten A/A
  # readings. RESIDUAL_SPREAD_PCT follows that at 2.5. The linearity holds at
  # this level too -- one wave took 78.01s and four took 311.60s, 0.13% off
  # four times the first.
  #
  # What it does not touch: the CONC * 2 `--num-warmups` atom_test.sh runs
  # before the measured window, and server launch and teardown -- 325s per
  # phase at c=256, which is why 4/10 of the window is ~2/3 of the job.
  PERF_PROMPT_MULTS: "256:4"
  # Pinned so the pairing's determinism is this workflow's property rather than
  # an upstream default's. perf_check_half.sh carries the argument.
  PERF_SEED: 0
  # Warmup length as a multiple of the concurrency level. The warmup phase
  # exists to fill the JIT, inductor and hipblaslt caches that outlive a server
  # restart inside the shared container -- without it the half that ran second
  # read +5.89/+9.14/+2.77% faster on identical code. It does not exist to
  # produce a measurement, so it does not need the measurement's length. Each
  # phase already carries its own `--num-warmups` of CONC*2 from atom_test.sh,
  # which is what the nightly relies on; this is the extra, cross-restart part.
  #
  # Measured on mi355-gpu-41, DeepSeek-V4-Pro tp=8 under dummy weights, c=32:
  # the phase is 460s at 10 and 188s at 1 -- the 162s of server start and graph
  # capture is fixed, only the benchmark inside it shrinks. Across the matrix
  # that is about 18% of total GPU time.
  #
  # The residual it leaves is not resolved. Two A/A runs at 1 gave -1.66% and
  # +0.07% on identical code, against -0.21% for a single run at 10: the spread
  # between two runs of the same setting (1.73 points) is larger than the gap
  # between settings, so n=2 cannot separate them. Both sit inside the +-2.5
  # RESIDUAL_SPREAD_PCT this check documents.
  #
  # One cell argues against this setting and is not yet explained:
  #
  #   GLM-5.2-FP8  c=256  total tput  +2.4 / +2.1 / +2.3%   (three runs)
  #
  # with TTFT and TPOT agreeing each time. c=256 is the quiet level -- 0.5-1.2%
  # run to run -- so three readings landing within 0.3 points of each other at
  # +2.3% is not the spread RESIDUAL_SPREAD_PCT covers. It is the second-half
  # advantage the warmup exists to remove, still present at this length for
  # that cell, and widening a constant to cover it would buy quiet at the cost
  # of sensitivity. Raise this to 10, for that entry or for all of them, once a
  # run has shown whether the longer warmup removes it.
  #
  # Kimi-K3 at c=32 read -12.1% and -11.6% on TTFT in two runs and looked like
  # a second one, but the run before them read -0.5%, and M3 at the same level
  # gave +0.4% and +5.0%. That is this level behaving as the header already
  # says it does, not a bias -- two readings out of three is not a direction.
  #
  # Not PERF_-prefixed like the others: workflow-level env is inherited
  # straight into every step, and perf_check_half.sh reads this name, so
  # no mapping is needed (and a job-level one is not even allowed to
  # reference env).
  WARMUP_MULT: 1

  # Weight-loading flags appended to every phase by perf_check_half.sh, which
  # carries the full rationale and the measurements. In short: model load is
  # 76% of the benchmark it precedes on the MI355X runners (297s vs 369s for
  # DeepSeek-V4-Pro), and this job pays it three times. Dummy weights trade
  # that for a 20.2% slower benchmark and win by ~12 min per job.
  #
  # Not PERF_-prefixed, for the same reason as WARMUP_MULT: workflow-level env
  # is inherited straight into every step and perf_check_half.sh reads this
  # name. Set to "" to measure on real weights.
  #
  # `--fake-eplb` is not decoration -- `--load_dummy` alone leaves a recycled
  # routing bias that collapses every token onto one EP rank.
  DUMMY_WEIGHT_ARGS: "--load_dummy=xavier --fake-eplb"

jobs:
  # ---------------------------------------------------------------- gate ---
  gate:
    name: perf-check-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The script always exits 0 -- an unlabelled PR is not a failure, it is a
    # PR that did not ask for a benchmark. So the decision travels as an
    # output, and every job below it is gated on that output. Listing gate in
    # `needs` alone gates nothing: `needs` only blocks on failure.
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4

      - name: Require the ci:perf label
        id: gate
        env:
          # Deliberately NOT ci:full -- that label already fans out the heavy
          # accuracy suites, and folding a paired benchmark into it would double
          # GPU time for every PR that asks for a full run.
          CI_GATE_LABELS: ci:perf
        run: .github/scripts/check_heavy_ci_gate.sh

  # -------------------------------------------------------- build matrix ---
  build-matrix:
    name: Build perf matrix
    needs: gate
    if: ${{ needs.gate.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cells: ${{ steps.build.outputs.cells }}
    steps:
      - uses: actions/checkout@v4

      # Server args, env vars, model paths and result filenames all come from
      # models.json via catalog.py -- the same source the nightly matrix uses.
      # The nightly calls build_benchmark_matrix.py for this; the perf check
      # calls its sibling. Neither builds a matrix inline: workflow YAML is not
      # testable, and `minimax-m3-mxfp8` (the catalog calls it `m3-mxfp8`) is
      # what a matrix that silently builds too few cells looks like -- every GPU
      # job still runs, and the shortfall surfaces at the judge, as `partial`.
      - name: Derive cells from the benchmark catalog
        id: build
        run: python3 .github/scripts/build_perf_check_matrix.py
        env:
          PERF_MODELS: ${{ env.PERF_MODELS }}
          PERF_ISL: ${{ env.PERF_ISL }}
          PERF_OSL: ${{ env.PERF_OSL }}
          PERF_RATIO: ${{ env.PERF_RATIO }}
          PERF_JUDGING_CONCS: ${{ env.PERF_JUDGING_CONCS }}
          PERF_REFERENCE_CONCS: ${{ env.PERF_REFERENCE_CONCS }}
          PERF_PROMPT_MULTS: ${{ env.PERF_PROMPT_MULTS }}

  # -------------------------------------------------------- paired bench ---
  paired-bench:
    name: ${{ matrix.cell.display }} c=${{ matrix.cell.conc }}
    needs: [gate, build-matrix]
    if: ${{ needs.gate.outputs.should_run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJson(needs.build-matrix.outputs.cells) }}
    runs-on: ${{ matrix.cell.runner }}
    timeout-minutes: 180
    env:
      MODEL_PATH: ${{ matrix.cell.model_path }}
      ARGS: ${{ matrix.cell.server_args }}
      ISL: ${{ matrix.cell.isl }}
      OSL: ${{ matrix.cell.osl }}
      CONC: ${{ matrix.cell.conc }}
      RANDOM_RANGE_RATIO: ${{ matrix.cell.ratio }}
      RESULT_FILENAME: ${{ matrix.cell.result_filename }}
      # Per-level, from the matrix cell: a job-level env cannot read `env`, so
      # the level's prompt multiple travels in the cell rather than being
      # looked up again here from PERF_PROMPT_MULTS.
      PROMPT_MULT: ${{ matrix.cell.prompt_mult }}
      CONTAINER: atom-perf-check
    steps:
      - name: Reclaim disk before starting
        timeout-minutes: 15
        run: |
          set -uo pipefail
          # This workflow is heavier on disk than the accuracy suites it shares
          # runners with: it pulls a ~47GB image with pull-policy always, and
          # starts three servers in one job. Two jobs of this run died on a
          # runner that filled up -- one could not write its own diagnostic log
          # ("No space left on device" under _diag/), the other lost contact
          # with the server, which is what a full disk looks like from outside.
          #
          # Mirrors atom-test.yaml's guard, plus the runner work tree, since
          # the failure was in the runner's own space rather than Docker's.
          docker_root="$(docker info --format '{{.DockerRootDir}}' 2>/dev/null)"
          docker_root="${docker_root:-/var/lib/docker}"
          echo "runner: ${RUNNER_NAME:-$(hostname)}"
          df -h / "${docker_root}" "${RUNNER_WORKSPACE:-/tmp}" || true

          available_kb="$(df -Pk "${docker_root}" 2>/dev/null | awk 'NR == 2 {print $4}' || true)"
          threshold_kb=$((500 * 1024 * 1024))
          if [ "${available_kb:-0}" -lt "${threshold_kb}" ]; then
            echo "Docker root under 500 GiB free -- pruning resources older than 30 days"
            docker container prune -f --filter "until=720h" || true
            docker image prune -af --filter "until=720h" || true
            docker builder prune -af --filter "until=720h" || true
            docker system df || true

            # The 30-day filter can exclude everything there is. pit2-p03-g24
            # sat at 100% of 28T with 53 images, 849.7GB, none of them active
            # and none of them older than 30 days: the guard above correctly
            # said the disk was short and then reclaimed 0B, three runs in a
            # row, while every cell scheduled there died in the model download.
            #
            # So escalate only when the first pass left the disk genuinely
            # critical, and escalate by narrowing the window rather than
            # dropping it -- `-a` already restricts this to images no container
            # is using, and anything it removes is re-pullable. Still a cost to
            # whoever pulls next on this runner, which is why it is tied to
            # "about to fail anyway" rather than to the 500 GiB comfort mark.
            available_kb="$(df -Pk "${docker_root}" 2>/dev/null | awk 'NR == 2 {print $4}' || true)"
            critical_kb=$((200 * 1024 * 1024))
            if [ "${available_kb:-0}" -lt "${critical_kb}" ]; then
              echo "Still under 200 GiB free -- pruning unused images older than 24h"
              docker image prune -af --filter "until=24h" || true
              docker builder prune -af --filter "until=24h" || true
              docker system df || true
            fi
          else
            echo "Docker root has at least 500 GiB free"
          fi

          # Runner-side leftovers. Old diagnostic logs are what actually ran the
          # disk out, and nothing else prunes them.
          diag="$(dirname "${RUNNER_WORKSPACE:-/tmp}")/_diag"
          if [ -d "$diag" ]; then
            before=$(du -sm "$diag" 2>/dev/null | cut -f1)
            find "$diag" -type f -mtime +7 -delete 2>/dev/null || true
            echo "runner _diag: ${before:-?}MB -> $(du -sm "$diag" 2>/dev/null | cut -f1)MB"
          fi
          df -h / "${docker_root}" || true

      - name: Kill leftover containers and reclaim the workspace
        run: |
          docker ps -aq | xargs -r docker rm -f || true
          # A previous run's container wrote into the bind-mounted workspace as
          # root, and actions/checkout runs as the runner user -- it cannot
          # delete those files and fails before any step of ours executes. The
          # halves hand ownership back as they go, but a job that died early
          # never got the chance, so the debris outlives it and lands on
          # whoever schedules here next. Clear it before checkout, not after.
          #
          # No --privileged. The container's root already carries CAP_CHOWN,
          # which is all a chown over a bind mount needs, and these runners run
          # a docker authorization plugin that refuses the flag outright:
          #
          #   authorization denied by plugin spur-authz: denied [P1]: --privileged
          #
          # The `|| true` then swallowed it, so this step reported success while
          # doing nothing at all and the debris it exists to clear went on to
          # kill the next job's checkout. Five of the ten cells of run
          # 37909731003 died that way, before a line of this workflow ran.
          if [ -d "${GITHUB_WORKSPACE}" ]; then
            if ! docker run --rm -v "${GITHUB_WORKSPACE}":/workspace -w /workspace \
                   rocm/atom-dev:latest bash -lc \
                   "chown -R $(id -u):$(id -g) /workspace"; then
              # Still not fatal -- a workspace that was already clean does not
              # need this, and failing here would turn a healthy runner's
              # transient docker hiccup into a lost cell. But it is said out
              # loud, because the next step is the one that pays for it.
              echo "::warning::could not reclaim ${GITHUB_WORKSPACE}; if checkout fails next, this is why"
            fi
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # merge-base needs full history

      - name: Resolve merge-base
        id: refs
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          # The merge-base, not the base branch tip: the tip moves as other PRs
          # land, so the same PR measured twice would not be comparable.
          BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" "$HEAD_SHA")
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Base $BASE_SHA -> head $HEAD_SHA"

      - name: Start container and download model
        uses: ./.github/actions/atom-bench-container
        with:
          image: rocm/atom-dev:latest
          container-name: ${{ env.CONTAINER }}
          model-path: ${{ env.MODEL_PATH }}
          env-vars: ${{ matrix.cell.env_vars }}
          hf-token: ${{ secrets.AMD_HF_TOKEN }}
          download-required: "true"
          container-env: -e ISL=${{ env.ISL }} -e OSL=${{ env.OSL }} -e CONC=${{ env.CONC }} -e RANDOM_RANGE_RATIO=${{ env.RANDOM_RANGE_RATIO }}

      - name: GPU preflight check
        timeout-minutes: 6
        env:
          # A container that dies without stopping its server leaves KFD
          # processes holding VRAM: atom_test.sh's pkill runs inside the
          # container, so once the container is gone nothing reaches them. The
          # next job cannot allocate, and the failure reads as a slow load
          # rather than a collision. Observed locally -- four workers held 664GB
          # across four cards after an aborted run, and only a host-side kill
          # cleared them.
          #
          # Native ATOM CI leaves this off because its jobs start one server;
          # this workflow starts four in a row, so an abort leaves more behind.
          GPU_PREFLIGHT_KILL_KFD: "1"
          GPU_PREFLIGHT_ALLOCATION_MB: "8"
        run: bash .github/scripts/gpu_preflight_check.sh "${{ env.CONTAINER }}" docker

      - name: Pin the image digest
        id: image
        run: |
          set -euo pipefail
          # `latest` is a floating tag pulled with --pull always. Both halves
          # share this one container so the pairing is safe regardless, but the
          # digest has to be recorded or the run cannot be placed against any
          # other run, and the PR comment cannot say what was measured.
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' \
                     rocm/atom-dev:latest 2>/dev/null || echo "unknown")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Image: $DIGEST"

      - name: Stage the pairing script outside the workspace
        run: |
          set -euo pipefail
          # The script checks out the merge-base, which predates this file --
          # so running it from the workspace deletes it before the second half
          # can start. Copy it somewhere the checkouts do not reach.
          cp .github/scripts/perf_check_half.sh "$RUNNER_TEMP/perf_check_half.sh"
          chmod +x "$RUNNER_TEMP/perf_check_half.sh"

      # warmup -> base -> head.
      #
      # The container is shared by both halves, which is what keeps machine and
      # image fixed -- but it also carries the JIT/autotune caches the first run
      # populates. Measured on identical code with no warmup, the second half
      # read 5.9% (c=64) and 9.1% (c=128) faster than the first, with TPOT and
      # TTFT agreeing: larger than the regression threshold, and pointing the
      # wrong way, since it hides regressions rather than inventing them. The
      # discarded warmup pays that cost before either measurement.
      #
      # An A/A run (every phase on one commit, MI308, DeepSeek-V4-Flash tp=8)
      # measured what the warmup leaves behind:
      #
      #     head vs base    +1.35%    was +5.9% / +9.1% / +2.8% without warmup
      #     base2 vs base   +1.26%    a third measurement of the base commit
      #
      # The two agree, so the residual is drift over the run rather than
      # anything specific to head. Averaging a repeated base reading halves it
      # (+0.71%), but costs a third measurement -- 0.65 percentage points of
      # sensitivity for 33% more GPU time, which is a bad trade against
      # regressions worth catching. perf_judge.py still accepts --base2-dir;
      # add a base2 phase and pass it when a run needs its drift quantified.
      - name: Bench WARMUP (discarded)
        run: bash "$RUNNER_TEMP/perf_check_half.sh" "${{ steps.refs.outputs.base_sha }}" warmup

      - name: Bench BASE
        run: bash "$RUNNER_TEMP/perf_check_half.sh" "${{ steps.refs.outputs.base_sha }}" base

      - name: Bench HEAD
        run: bash "$RUNNER_TEMP/perf_check_half.sh" "${{ steps.refs.outputs.head_sha }}" head

      # benchmark-tmpl.yml dumps these and this workflow did not, which cost a
      # whole job to learn nothing: Kimi-K3 under dummy weights timed out at
      # `ATOM server did not start after 2700 seconds` after 45 minutes, and
      # the only record of why sat inside a container the cleanup then removed.
      # `if: always()` because the run that needs them is the failing one.
      - name: Dump server log
        if: always()
        run: docker exec ${{ env.CONTAINER }} cat /tmp/atom_server.log 2>/dev/null || true

      - name: Dump client log
        if: always()
        run: docker exec ${{ env.CONTAINER }} cat /tmp/atom_client.log 2>/dev/null || true

      - name: Record provenance
        if: always()
        run: |
          set -euo pipefail
          mkdir -p perf-pair
          python3 - <<'PY'
          import json, os, pathlib
          meta = {
              "image_digest": os.environ["IMAGE_DIGEST"],
              "base_sha": os.environ["BASE_SHA"],
              "head_sha": os.environ["HEAD_SHA"],
              "runner": os.environ["RUNNER_NAME"],
              "dummy_weight_args": os.environ.get("DUMMY_WEIGHT_ARGS", ""),
          }
          pathlib.Path("perf-pair/provenance.json").write_text(json.dumps(meta))
          PY
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          BASE_SHA: ${{ steps.refs.outputs.base_sha }}
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}

      - name: Upload pair
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-pair-${{ matrix.cell.result_filename }}
          path: perf-pair
          if-no-files-found: warn

      - name: Clean up
        if: always()
        run: |
          docker exec ${{ env.CONTAINER }} bash -lc '.github/scripts/atom_test.sh stop' || true
          docker rm -f ${{ env.CONTAINER }} || true
          # Safety net for a job that died before the halves could hand the
          # workspace back: root-owned leftovers break the *next* job's
          # actions/checkout, not this one, so the failure surfaces somewhere
          # unrelated. Mirrors benchmark-tmpl.yml's Clean Up.
          docker run --rm -v "${GITHUB_WORKSPACE:-$PWD}":/workspace -w /workspace --privileged \
            rocm/atom-dev:latest bash -lc \
            "chown -R $(id -u):$(id -g) /workspace" || true
          git checkout -- . || true

  # ---------------------------------------------------------------- judge ---
  judge:
    name: perf-check-judge
    # gate must stay in `needs` even though paired-bench already depends on it:
    # `needs.gate` is only in scope for jobs that list it, so referencing it
    # below without this is an unresolved expression, not a false condition.
    # And it must read `.outputs.should_run`, not `.result`: the gate succeeds
    # whether or not the label is there, so `.result == 'success'` would post a
    # judgement on every push to an unlabelled PR.
    needs: [gate, paired-bench]
    if: always() && needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest        # pure CPU, seconds
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download every pair
        uses: actions/download-artifact@v7
        with:
          pattern: perf-pair-*
          path: pairs

      - name: Collect base and head halves
        id: collect
        run: |
          set -euo pipefail
          mkdir -p collected/base collected/head
          # Artifacts nest one directory per matrix cell; flatten both halves so
          # the judge sees one base dir and one head dir.
          find pairs -path '*/base/*.json' -exec cp {} collected/base/ \; || true
          find pairs -path '*/head/*.json' -exec cp {} collected/head/ \; || true
          echo "base=$(find collected/base -name '*.json' | wc -l)" >> "$GITHUB_OUTPUT"
          echo "head=$(find collected/head -name '*.json' | wc -l)" >> "$GITHUB_OUTPUT"
          # Read every cell's provenance rather than the first one found. A cell
          # that died in `Start container` still records provenance -- those
          # steps are `if: always()` -- but never reached the pin, so its
          # image_digest is empty, and taking the first file made the whole run
          # report `unknown` whenever such a cell sorted first. Run 37922341753
          # did that with six cells measured and four dead.
          DIGEST=$(find pairs -name provenance.json -print0 \
                   | xargs -0 -r python3 .github/scripts/pick_image_digest.py \
                   || true)
          # xargs -r with no input succeeds silently, so DIGEST ends up empty
          # rather than "unknown" unless it is defaulted here.
          echo "digest=${DIGEST:-unknown}" >> "$GITHUB_OUTPUT"
          case "${DIGEST}" in
            # Not averaged away: two digests mean the halves were not paired on
            # one image, and that premise is what the comparison rests on.
            MIXED:*) echo "::warning::cells did not all run the same image -- ${DIGEST}" ;;
            "")      echo "::warning::no cell recorded an image digest" ;;
          esac

      - name: Fetch the dashboard history
        id: history
        # Skipped under dummy weights: the judge would not use it, and a step
        # that fetches a baseline nobody consults reads like one that does.
        if: env.DUMMY_WEIGHT_ARGS == ''
        continue-on-error: true
        run: |
          set -euo pipefail
          # Used for two things, both secondary to the paired comparison: the
          # noise band behind the single-level escalation, and the sanity check
          # that reads the base measurement against main's recent level. Fetched
          # as its own step so the network access is visible in the log and a
          # failure is attributable, rather than hiding inside the judge.
          curl -sSfL --max-time 120 \
            https://rocm.github.io/ATOM/benchmark-dashboard/data.js \
            -o dashboard-data.js
          echo "bytes=$(wc -c < dashboard-data.js)"

      - name: Judge
        run: |
          set -euo pipefail
          # Without history the judge keeps its primary criterion -- levels
          # moving together needs no noise estimate -- and loses the escalation
          # and the baseline check. Degrading is correct; pretending we have a
          # baseline reference we could not fetch would not be.
          # Dummy weights move the absolute operating point (-16.3% throughput
          # where it was measured), so every history-derived check is comparing
          # against runs of a different thing: the baseline sanity check would
          # fire on every PR, and the sigma band behind the single-level
          # escalation is a real-weight noise estimate. Both go off. The paired
          # criterion -- base and head on one machine, one image, one container
          # -- needs no history and is unaffected.
          if [ -n "${DUMMY_WEIGHT_ARGS:-}" ]; then
            echo "::warning::dummy weights active -- baseline sanity check and sigma gate are off, and absolute numbers are not comparable to the dashboard"
            HISTORY_ARG="--no-history"
          elif [ -s dashboard-data.js ]; then
            HISTORY_ARG="--history dashboard-data.js"
          else
            echo "::warning::no dashboard history -- baseline sanity check and sigma gate are off"
            HISTORY_ARG="--no-history"
          fi
          CONTEXT="base \`${{ github.event.pull_request.base.sha }}\` -> head \`${{ github.event.pull_request.head.sha }}\` · \`${{ steps.collect.outputs.digest }}\`"
          # Say it in the comment, not only in the log. A reader who takes an
          # absolute number from this table to the dashboard has to be told it
          # will not match, and that the delta's magnitude is not calibrated
          # against a known injection.
          if [ -n "${DUMMY_WEIGHT_ARGS:-}" ]; then
            NOTE="**Measured on dummy weights** (\`${DUMMY_WEIGHT_ARGS}\`) -- absolute throughput is not comparable to the dashboard, and the history-based baseline check is off. Base and head are still paired on one machine, image and container, so the delta is a like-for-like comparison, but its magnitude has not been calibrated against a known regression."
            CONTEXT="${CONTEXT}"$'\n\n'"${NOTE}"
          fi
          # --expect-entries is not optional: an entry whose job died entirely
          # produces no files at all, so without it a run where most jobs failed
          # reads as clean.
          python3 .github/scripts/perf_judge.py \
            --base-dir collected/base \
            --head-dir collected/head \
            $HISTORY_ARG \
            --expect-entries "${{ env.PERF_EXPECTED_ENTRIES }}" \
            --context "$CONTEXT" \
            --output-json verdict.json \
            --comment-file comment.md \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update the PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- atom-perf-check -->';
            const body = marker + '\n' + fs.readFileSync('comment.md', 'utf8');
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            // Update in place rather than appending: a PR that is pushed to
            // repeatedly should carry one current result, not a pile of stale
            // ones a reader has to date-sort by hand.
            const existing = await github.paginate(
              github.rest.issues.listComments, {owner, repo, issue_number});
            const mine = existing.find(c => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment(
                {owner, repo, comment_id: mine.id, body});
            } else {
              await github.rest.issues.createComment(
                {owner, repo, issue_number, body});
            }

      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-verdict
          path: |
            verdict.json
            comment.md
