name: MiniMax validation diagnostics
on:
  workflow_dispatch:
    inputs:
      reclaim_completed_metric:
        description: Remove the verified duplicate metric from completed task 10772
        type: boolean
        default: false
      reclaim_artifact_copies:
        description: Remove hash-verified copies of completed task 10772 raw metric
        type: boolean
        default: false
      recover_current_artifacts:
        description: Recover completed DCP ON accuracy and failed c32 task logs
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  inspect:
    runs-on: atomesh-cicd
    timeout-minutes: 5
    env:
      RECLAIM_COMPLETED_METRIC: ${{ inputs.reclaim_completed_metric }}
      RECLAIM_ARTIFACT_COPIES: ${{ inputs.reclaim_artifact_copies }}
      RECOVER_CURRENT_ARTIFACTS: ${{ inputs.recover_current_artifacts }}
    steps:
      - name: Read this task's Slurm states and progress logs
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import collections
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          root = Path('/share_nfs/ATOMESH_RUNNER/ATOMESH_LOG')
          runs = (40706439005, 40739638741)
          jobs = []
          if os.environ.get('RECLAIM_COMPLETED_METRIC') == 'true':
              dirs = list(root.glob('*agentx-chunked-c32-mooncake_store-40706439005-20261028143137'))
              if len(dirs) != 1:
                  raise RuntimeError('Expected only the completed ON directory')
              matches = list(dirs[0].glob('slurm_job-10772/benchmark_results/*/server_metrics_export.json'))
              if len(matches) != 1:
                  raise RuntimeError('Expected exactly the backed-up raw metric')
              metric = matches[0]
              digest = hashlib.sha256()
              with metric.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(16 * 1024 * 1024), b''):
                      digest.update(chunk)
              if metric.stat().st_size != 4716797276 or digest.hexdigest() != '631331178b754bdeefae1c70b069721af495dd99f9baced3677293f17c663853':
                  raise RuntimeError('Backup verification mismatch; keeping original')
              # Full identical copies are preserved locally and in GitHub
              # artifact 12830886598, confirmed before this dispatch.
              metric.unlink()
              print('RECLAIMED VERIFIED TASK DUPLICATE: 4716797276 bytes; artifact 12830886598 retained', flush=True)

          if os.environ.get('RECLAIM_ARTIFACT_COPIES') == 'true':
              cell = 'minimax-m3.1-flash-quark-mxfp4-minimax-m31-flash-mxfp4-1p1d-pp4-tp4-dspark7-nvfp4-mcstore-agentx-chunked-c32-mooncake_store'
              reclaimed = 0
              for runner in range(1, 21):
                  copied = root.parent / f'atomesh-runner-{runner:02d}/_work/ATOM/ATOM/atomesh-results' / cell
                  for metric in copied.glob('slurm_job-10772/benchmark_results/*/server_metrics_export.json'):
                      digest = hashlib.sha256()
                      with metric.open('rb') as stream:
                          for chunk in iter(lambda: stream.read(16 * 1024 * 1024), b''):
                              digest.update(chunk)
                      if metric.stat().st_size != 4716797276 or digest.hexdigest() != '631331178b754bdeefae1c70b069721af495dd99f9baced3677293f17c663853':
                          print('KEEPING NONMATCHING TASK COPY:', runner, flush=True)
                          continue
                      metric.unlink()
                      reclaimed += 4716797276
                      print('RECLAIMED VERIFIED TASK 10772 ARTIFACT COPY:', runner, flush=True)
              print('ARTIFACT COPY BYTES RECLAIMED:', reclaimed, flush=True)

          import shutil
          usage = os.statvfs(root)
          print('TASK LOG FILESYSTEM:', {'available_bytes': usage.f_bavail * usage.f_frsize, 'available_inodes': usage.f_favail}, flush=True)
          if shutil.which('quota'):
              result = subprocess.run(['quota', '-s'], capture_output=True, text=True, timeout=15)
              print('CURRENT RUNNER USER QUOTA:', result.returncode, result.stdout[:2000], result.stderr[:500], flush=True)
          else:
              print('CURRENT RUNNER USER QUOTA: quota command unavailable', flush=True)
          result = subprocess.run(['stat', '-f', '-c', '%T', str(root)], capture_output=True, text=True, timeout=15)
          print('TASK LOG FILESYSTEM TYPE:', result.stdout.strip(), flush=True)

          controller = os.environ.get('SPUR_CONTROLLER_ADDR', '')
          controller_args = ['--controller', controller] if controller else []
          print('EXPLICIT CONTROLLER CONFIGURED:', bool(controller), flush=True)
          runner_root = Path('/share_nfs/ATOMESH_RUNNER')
          task_runners = {run: range(1, 21) for run in runs}
          for run in runs:
              latest = {}
              for directory in sorted(root.glob(f'*{run}*')):
                  if run == 40706439005 and 'agentx-chunked' in directory.name:
                      continue
                  latest[directory.name.rsplit(f'-{run}-', 1)[0]] = directory
              paths = list(latest.values())
              print(f'RUN {run}: {len(paths)} log directories', flush=True)
              for directory in paths:
                  print(directory.name, flush=True)
                  cell = directory.name.rsplit(f'-{run}-', 1)[0]
                  attempt = 4 if run == 40706439005 else 1
                  job_name = f'{cell}-{run}-{attempt}'
                  for runner in task_runners[run]:
                      results = runner_root / f'atomesh-runner-{runner:02d}/_work/ATOM/ATOM/atomesh-results'
                      recorded_root = results / f'{cell}.log-root'
                      job_id_file = results / f'{cell}.slurm-job-id'
                      if recorded_root.is_file() and recorded_root.read_text().strip() == str(directory) and job_id_file.is_file():
                          job_id = job_id_file.read_text().strip()
                          if job_id.isdigit():
                              jobs.append(job_id)
                              print('VERIFIED TASK JOB ID:', job_id, flush=True)
                  for log in sorted(directory.glob('slurm-*.err')):
                      print('TASK SLURM STDERR:', log.name, flush=True)
                      for line in collections.deque(log.open(errors='replace'), maxlen=15):
                          if re.search(r'(?i)error|cancel|timeout|failed|exit|quota|space', line):
                              print(line.rstrip()[:400], flush=True)
                  for log in directory.glob('slurm-*.out'):
                      print('TASK STDOUT TAIL:', log.name, flush=True)
                      for line in collections.deque(log.open(errors='replace'), maxlen=45):
                          print(line.rstrip().replace('\x00', '')[:450], flush=True)
                  for result_file in directory.glob('slurm_job-*/benchmark_results/**/profile_export_aiperf.json'):
                      data = json.loads(result_file.read_text())
                      print('BENCHMARK:', {key: data.get(key) for key in ('was_cancelled', 'request_count', 'benchmark_duration', 'error_summary')}, flush=True)
                  for result_file in directory.glob('slurm_job-*/**/results_*.json'):
                      try:
                          data = json.loads(result_file.read_text())
                      except json.JSONDecodeError:
                          print('EVAL RESULT STILL WRITING:', result_file.name, flush=True)
                          continue
                      if 'gsm8k' in data.get('results', {}):
                          print('GSM8K RESULT:', data['results']['gsm8k'], flush=True)
                          print('EVAL SAMPLE COUNT:', data.get('n-samples', {}), flush=True)
                  result = subprocess.run(
                      ['squeue', *controller_args, '--noheader', '--name', job_name,
                       '--format', '%A|%T|%M|%N|%R'],
                      capture_output=True, text=True, check=False, timeout=20)
                  print('TASK QUEUE:', result.stdout.strip(), flush=True)
                  print('ROOT FILES:', [(x.name, x.stat().st_size) for x in directory.iterdir() if x.is_file()], flush=True)
                  for job in sorted(directory.glob('slurm_job-*')):
                      jobs.append(job.name.removeprefix('slurm_job-'))
                      for name in ('decode-rank-0.log', 'prefill-rank-0.log', 'server-rank-0.log', 'eval/decode-rank-0.log', 'eval/prefill-rank-0.log', 'eval/server-rank-0.log', '../rank-0/container-eval.log', '../rank-0/container.log'):
                          log = job / 'logs' / name
                          if not log.exists():
                              continue
                          matches = collections.deque(maxlen=12)
                          trace = []
                          in_trace = False
                          with log.open(errors='replace') as stream:
                              for line in stream:
                                  if 'Traceback (most recent call last)' in line and not trace:
                                      in_trace = True
                                  if in_trace and len(trace) < 90:
                                      trace.append(line.rstrip()[:450])
                                  if re.search(r'Capturing|Loading|loaded|Loaded|ready|Traceback|Error:|ERROR|Average toks/fwd|Avg generation|GSM8K|quota|No space', line):
                                      matches.append(line.rstrip()[:450])
                          print(f'{job.name}/{name}: {log.stat().st_size} bytes; owner_matches_runner={log.stat().st_uid == os.getuid()}', flush=True)
                          print('\n'.join(matches), flush=True)
                          if trace:
                              print('FIRST ERROR CONTEXT:\n' + '\n'.join(trace), flush=True)
          result = subprocess.run(
              ['sinfo', *controller_args, '--noheader', '--nodes=pit2-p03-g03,pit2-p03-g53', '--format=%N|%T'],
              capture_output=True, text=True, check=False, timeout=20)
          print('TARGET NODE AVAILABILITY:', result.stdout.strip(), flush=True)
          for job_id in sorted(set(jobs)):
              for command in (
                  ['squeue', *controller_args, '--noheader', '-j', job_id, '--format', '%A|%T|%M|%N|%R'],
                  ['sacct', *controller_args, '-j', job_id, '--noheader', '--format', 'JobID%30,State%30,ExitCode%20'],
              ):
                  result = subprocess.run(command, capture_output=True, text=True, check=False, timeout=20)
                  lines = []
                  for line in result.stdout.splitlines():
                      fields = re.split(r'[|\s]+', line.strip())
                      if fields and fields[0].split('.')[0] == job_id:
                          lines.append(line.strip())
                  print('TASK STATE:', job_id, result.returncode, lines, flush=True)
          if os.environ.get('RECOVER_CURRENT_ARTIFACTS') == 'true':
              recovery = Path(os.environ['RUNNER_TEMP']) / 'm31-task-recovery-10826-10828'
              for run, job_id, label in [(40739638741, '10826', 'dcp-on'), (40706439005, '10828', 'c32-off')]:
                  matches = [job for directory in root.glob(f'*{run}*') for job in directory.glob(f'slurm_job-{job_id}')]
                  if len(matches) != 1:
                      raise RuntimeError(f'Expected one verified task directory for {job_id}')
                  job = matches[0]
                  out = recovery / label / job.name
                  out.mkdir(parents=True, exist_ok=True)
                  for subdir in ('eval_results', 'logs', 'rank-0'):
                      src = job / subdir
                      if src.is_dir():
                          for src_file in src.rglob('*'):
                              if src_file.is_file() and src_file.suffix in ('.log', '.json', '.jsonl'):
                                  dest = out / src_file.relative_to(job)
                                  dest.parent.mkdir(parents=True, exist_ok=True)
                                  shutil.copyfile(src_file, dest)
                  for pattern in ('cell-metadata.json', 'job-result.json', 'rank-workload-*.json', 'rank-rc-*'):
                      for src_file in job.glob(pattern):
                          shutil.copyfile(src_file, out / src_file.name)
                  for src_file in job.parent.glob(f'slurm-{job_id}.*'):
                      shutil.copyfile(src_file, out / src_file.name)
              print('RECOVERED TASK ARTIFACTS READY', flush=True)
          PYCODE
      - name: Upload recovered task artifacts
        if: ${{ inputs.recover_current_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: m31-task-recovery-10826-10828
          path: ${{ runner.temp }}/m31-task-recovery-10826-10828
          if-no-files-found: error
          retention-days: 14
