name: MiniMax validation diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: atomesh-cicd
    timeout-minutes: 3
    steps:
      - name: Read this task's Slurm states and progress logs
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import collections
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          root = Path('/share_nfs/ATOMESH_RUNNER/ATOMESH_LOG')
          runs = (40706439005, 40737040374)
          jobs = []
          controller = os.environ.get('SPUR_CONTROLLER_ADDR', '')
          controller_args = ['--controller', controller] if controller else []
          print('EXPLICIT CONTROLLER CONFIGURED:', bool(controller), flush=True)
          runner_root = Path('/share_nfs/ATOMESH_RUNNER')
          task_runners = {run: range(1, 21) for run in runs}
          for run in runs:
              latest = {}
              for directory in sorted(root.glob(f'*{run}*')):
                  if run == 40706439005 and 'agentx-chunked' in directory.name:
                      continue
                  latest[directory.name.rsplit(f'-{run}-', 1)[0]] = directory
              paths = list(latest.values())
              print(f'RUN {run}: {len(paths)} log directories', flush=True)
              for directory in paths:
                  print(directory.name, flush=True)
                  cell = directory.name.rsplit(f'-{run}-', 1)[0]
                  attempt = 3 if run == 40706439005 else 1
                  job_name = f'{cell}-{run}-{attempt}'
                  for runner in task_runners[run]:
                      results = runner_root / f'atomesh-runner-{runner:02d}/_work/ATOM/ATOM/atomesh-results'
                      recorded_root = results / f'{cell}.log-root'
                      job_id_file = results / f'{cell}.slurm-job-id'
                      if recorded_root.is_file() and recorded_root.read_text().strip() == str(directory) and job_id_file.is_file():
                          job_id = job_id_file.read_text().strip()
                          if job_id.isdigit():
                              jobs.append(job_id)
                              print('VERIFIED TASK JOB ID:', job_id, flush=True)
                  for log in sorted(directory.glob('slurm-*.err')):
                      print('TASK SLURM STDERR:', log.name, flush=True)
                      for line in collections.deque(log.open(errors='replace'), maxlen=15):
                          if re.search(r'(?i)error|cancel|timeout|failed|exit', line):
                              print(line.rstrip()[:400], flush=True)
                  for result_file in directory.glob('slurm_job-*/benchmark_results/**/profile_export_aiperf.json'):
                      data = json.loads(result_file.read_text())
                      print('BENCHMARK:', {key: data.get(key) for key in ('was_cancelled', 'request_count', 'benchmark_duration', 'error_summary')}, flush=True)
                  result = subprocess.run(
                      ['squeue', *controller_args, '--noheader', '--name', job_name,
                       '--format', '%A|%T|%M|%N|%R'],
                      capture_output=True, text=True, check=False, timeout=20)
                  print('TASK QUEUE:', result.stdout.strip(), flush=True)
                  print('ROOT FILES:', [(x.name, x.stat().st_size) for x in directory.iterdir() if x.is_file()], flush=True)
                  for job in sorted(directory.glob('slurm_job-*')):
                      jobs.append(job.name.removeprefix('slurm_job-'))
                      for name in ('decode-rank-0.log', 'prefill-rank-0.log', 'server-rank-0.log', 'eval/decode-rank-0.log', 'eval/prefill-rank-0.log', 'eval/server-rank-0.log'):
                          log = job / 'logs' / name
                          if not log.exists():
                              continue
                          matches = collections.deque(maxlen=12)
                          trace = []
                          in_trace = False
                          with log.open(errors='replace') as stream:
                              for line in stream:
                                  if 'Traceback (most recent call last)' in line and not trace:
                                      in_trace = True
                                  if in_trace and len(trace) < 90:
                                      trace.append(line.rstrip()[:450])
                                  if re.search(r'Capturing|Loading|loaded|Loaded|ready|Traceback|Error:|ERROR|Average toks/fwd|Avg generation|GSM8K', line):
                                      matches.append(line.rstrip()[:450])
                          print(f'{job.name}/{name}: {log.stat().st_size} bytes', flush=True)
                          print('\n'.join(matches), flush=True)
                          if trace:
                              print('FIRST ERROR CONTEXT:\n' + '\n'.join(trace), flush=True)
          result = subprocess.run(
              ['sinfo', *controller_args, '--noheader', '--nodes=pit2-p03-g03,pit2-p03-g53', '--format=%N|%T'],
              capture_output=True, text=True, check=False, timeout=20)
          print('TARGET NODE AVAILABILITY:', result.stdout.strip(), flush=True)
          for job_id in sorted(set(jobs)):
              for command in (
                  ['squeue', *controller_args, '--noheader', '-j', job_id, '--format', '%A|%T|%M|%N|%R'],
                  ['sacct', *controller_args, '-j', job_id, '--noheader', '--format', 'JobID%30,State%30,ExitCode%20'],
              ):
                  result = subprocess.run(command, capture_output=True, text=True, check=False, timeout=20)
                  lines = []
                  for line in result.stdout.splitlines():
                      fields = re.split(r'[|\s]+', line.strip())
                      if fields and fields[0].split('.')[0] == job_id:
                          lines.append(line.strip())
                  print('TASK STATE:', job_id, result.returncode, lines, flush=True)
          PYCODE
      - name: Recover completed non-PD evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: m31-nonpd-baseline-recovered-10816
          retention-days: 3
          if-no-files-found: warn
          path: |
            /share_nfs/ATOMESH_RUNNER/ATOMESH_LOG/*agg-tp4-dspark7-nvfp4-gsm8k-5shot-c32-accuracy-40732976256-20261028171140/slurm_job-10816/eval_results/
            /share_nfs/ATOMESH_RUNNER/ATOMESH_LOG/*agg-tp4-dspark7-nvfp4-gsm8k-5shot-c32-accuracy-40732976256-20261028171140/slurm_job-10816/logs/eval/server-rank-0.log
