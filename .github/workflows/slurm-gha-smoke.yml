name: Slurm GHA Smoke

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Slurm runner smoke
    runs-on: [self-hosted, slurm-runner-small]
    timeout-minutes: 10
    steps:
      - name: Show runtime context
        run: |
          hostname
          date -u
          echo "RUNNER_NAME=${RUNNER_NAME:-}"
          echo "RUNNER_OS=${RUNNER_OS:-}"
          env | sort | grep -E '^(GITHUB_|RUNNER_|SLURM_)' || true
