name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'atom/model_engine/model_runner.py'
      - 'atom/model_engine/llm_engine.py'
      - 'atom/sampling_params.py'
      - '.github/workflows/docs.yml'
      - '.readthedocs.yaml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'atom/model_engine/model_runner.py'
      - 'atom/model_engine/llm_engine.py'
      - 'atom/sampling_params.py'
      - '.github/workflows/docs.yml'
      - '.readthedocs.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/sphinx/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r docs/sphinx/requirements.txt
      - name: Build documentation and check local references
        run: sphinx-build -b html -W --keep-going docs docs/_build/html
      - uses: actions/upload-artifact@v7
        with:
          name: documentation-html
          path: docs/_build/html
