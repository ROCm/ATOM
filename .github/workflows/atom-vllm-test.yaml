name: ATOM vLLM Test

on:
  pull_request:
    branches: [main]  # Triggers on PRs targeting `main`
    types: [opened, synchronize, reopened, ready_for_review, labeled, closed]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'atom/plugin/sglang/**'
      - 'atom/mesh/**'
      - '.github/benchmark/models_atomesh.yaml'
      - '.github/scripts/atomesh/**'
      - '.github/workflows/atomesh-*.yaml'
      - '.github/workflows/atom-sglang-*.yaml'
      - '.github/benchmark/sglang_models_accuracy.json'
      - 'LICENSE'
      - '.gitignore'
  pull_request_review:
    types: [submitted]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_review' || github.event.review.state == 'approved' }}

env:
  ATOM_BASE_NIGHTLY_IMAGE: rocm/atom-dev:latest
  ATOM_PYTHON_TAG: "cp312"
  OOT_IMAGE_CACHE_KEEP: "3"
  GITHUB_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || 'https://github.com/ROCm/ATOM.git' }}
  GITHUB_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.event.head_commit.id || github.sha }}
  NIGHTLY_OOT_IMAGE_TAG: rocm/atom-dev:vllm-latest

jobs:
  ci-gate:
    name: Check Heavy CI Gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      reason: ${{ steps.gate.outputs.reason }}
      duplicate_run_url: ${{ steps.gate.outputs.duplicate_run_url }}
    steps:
      - name: Checkout ATOM repo
        uses: actions/checkout@v6

      - name: Check approval and label gate
        id: gate
        env:
          CI_GATE_DUPLICATE_SUCCESS_JOB_PATTERN: '(^| / )Accuracy \('
          CI_GATE_LABELS: ci:full,ci:vllm
          CI_GATE_PATHS_IGNORE: |
            **/*.md
            docs/**
            atom/plugin/sglang/**
            atom/mesh/**
            .github/workflows/atomesh-*.yaml
            .github/scripts/atomesh_*.sh
            .github/dashboard/atomesh_*.html
            .github/workflows/atom-sglang-*.yaml
            .github/benchmark/sglang_models_accuracy.json
            LICENSE
            .gitignore
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./.github/scripts/check_heavy_ci_gate.sh


  gate-result:
    if: ${{ needs.ci-gate.outputs.should_run != 'true' }}
    needs: [ci-gate]
    name: Heavy CI not required
    runs-on: ubuntu-latest
    env:
      GATE_REASON: ${{ needs.ci-gate.outputs.reason }}
      DUPLICATE_RUN_URL: ${{ needs.ci-gate.outputs.duplicate_run_url }}
    steps:
      - name: Report gate decision
        run: |
          echo "Heavy CI was not required for this trigger."
          echo "Reason: ${GATE_REASON}"
          if [ -n "${DUPLICATE_RUN_URL}" ]; then
            echo "Previous successful run: ${DUPLICATE_RUN_URL}"
          fi

  run-tests:
    if: ${{ needs.ci-gate.outputs.should_run == 'true' }}
    needs: [ci-gate]
    name: Run ATOM vLLM tests
    uses: ./.github/workflows/atom-vllm-test-reusable.yaml
    with:
      caller_sha: ${{ github.sha }}
      pr_head_ref: ${{ github.event.pull_request.head.ref }}
      pr_head_sha: ${{ github.event.pull_request.head.sha }}
      pr_head_repo_fork: ${{ github.event.pull_request.head.repo.fork }}
      repo_url: ${{ github.event.pull_request.head.repo.clone_url || 'https://github.com/ROCm/ATOM.git' }}
      commit_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      pr_base_sha: ${{ github.event.pull_request.base.sha }}
    secrets: inherit
