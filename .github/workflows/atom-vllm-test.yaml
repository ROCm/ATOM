name: ATOM vLLM Test

on:
  pull_request:
    branches: [main]  # Triggers on PRs targeting `main`
    types: [opened, synchronize, reopened, ready_for_review, labeled, closed]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'atom/plugin/sglang/**'
      - 'atom/mesh/**'
      - '.github/benchmark/models_atomesh.yaml'
      - '.github/scripts/atomesh/**'
      - '.github/workflows/atomesh-*.yaml'
      - '.github/workflows/atom-sglang-*.yaml'
      - '.github/benchmark/sglang_models_accuracy.json'
      - 'LICENSE'
      - '.gitignore'
  pull_request_review:
    types: [submitted]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_review' || github.event.review.state == 'approved' }}

env:
  ATOM_BASE_NIGHTLY_IMAGE: rocm/atom-dev:latest
  ATOM_PYTHON_TAG: "cp312"
  GITHUB_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || 'https://github.com/ROCm/ATOM.git' }}
  GITHUB_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.event.head_commit.id || github.sha }}
  NIGHTLY_PLUGIN_IMAGE_TAG: rocm/atom-dev:vllm-latest

jobs:
  ci-gate:
    name: Check Heavy CI Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Checkout ATOM repo
        uses: actions/checkout@v6

      - name: Check approval and label gate
        id: gate
        env:
          CI_GATE_LABELS: ci:full,ci:vllm
          CI_GATE_PATHS_IGNORE: |
            **/*.md
            docs/**
            atom/plugin/sglang/**
            atom/mesh/**
            .github/workflows/atomesh-*.yaml
            .github/scripts/atomesh_*.sh
            .github/dashboard/atomesh_*.html
            .github/workflows/atom-sglang-*.yaml
            .github/benchmark/sglang_models_accuracy.json
            LICENSE
            .gitignore
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./.github/scripts/check_heavy_ci_gate.sh

  check-signal:
    if: ${{ needs.ci-gate.outputs.should_run == 'true' }}
    needs: [ci-gate]
    name: Check Pre Checkin Signal
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout ATOM repo
        uses: actions/checkout@v6

      - name: Wait for Pre Checkin workflow
        run: bash ./.github/scripts/check_signal.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          CHECK_SIGNAL_EVENT_NAME: pull_request
          CHECK_SIGNAL_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CHECK_SIGNAL_SHA: ${{ github.event.pull_request.head.sha }}

  download_aiter_wheel:
    if: ${{ needs.ci-gate.outputs.should_run == 'true' && needs.check-signal.result == 'success' }}
    needs: [ci-gate, check-signal]
    name: Download aiter wheel
    runs-on: ubuntu-latest
    outputs:
      aiter_artifact_id: ${{ steps.download.outputs.aiter_artifact_id }}
      aiter_wheel_name: ${{ steps.download.outputs.aiter_wheel_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prefer latest main aiter wheel manifest and fallback to artifact
        id: download
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/download_aiter_wheel.sh

      - name: Upload aiter wheel
        uses: actions/upload-artifact@v7
        with:
          name: aiter-whl
          path: aiter-whl/amd_aiter*.whl
          retention-days: 7

  atom-vllm-oot:
    needs: [ci-gate, check-signal, download_aiter_wheel]
    if: ${{ needs.ci-gate.outputs.should_run == 'true' && needs.check-signal.result == 'success' && needs.download_aiter_wheel.result == 'success' }}
    name: Accuracy (${{ matrix.display_name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - display_name: "DeepSeek-V4-Flash TP4"
            model_name: "DeepSeek-V4-Flash"
            model_path: "deepseek-ai/DeepSeek-V4-Flash"
            client_command: "lm_eval --model local-completions --model_args model=${MODEL_PATH},base_url=http://127.0.0.1:${VLLM_PORT}/v1/completions,num_concurrent=8,max_retries=1,tokenized_requests=False,trust_remote_code=True --tasks gsm8k --num_fewshot ${LM_EVAL_NUM_FEWSHOT} --output_path ${OUTPUT_PATH}"
            extra_args: "--tensor-parallel-size 4 --gpu-memory-utilization 0.9 --max-num-seqs 512 --tokenizer-mode deepseek_v4 --no-async-scheduling"
            env_vars: |
              AITER_BF16_FP8_MOE_BOUND=0
              ATOM_MOE_GU_ITLV=1
            lm_eval_num_fewshot: 20
            accuracy_test_threshold: 0.93
            runner: spur-runner-mi355x-8gpu
          - display_name: "GLM-5.2-MXFP4-MTP TP4"
            model_name: "GLM-5.2-MXFP4-MTP"
            model_path: "amd/GLM-5.2-MXFP4"
            extra_args: "--trust-remote-code --tensor-parallel-size 4 --max-num-batched-tokens 16384 --gpu-memory-utilization 0.9 --additional-config '{\"online_quant_config\": {\"global_quant_config\": \"ptpc_fp8\", \"exclude_layer\": [\"lm_head\", \"model.embed_tokens\", \"*.mlp.gate\", \"model.layers.[0-9].mlp.*expert*\", \"model.layers.[1-6][0-9].mlp.*expert*\", \"model.layers.7[0-7].mlp.*expert*\"]}}' --speculative-config '{\"method\": \"mtp\", \"num_speculative_tokens\": 3}'"
            env_vars: "AITER_QUICK_REDUCE_QUANTIZATION=INT4\nAITER_USE_FLYDSL_MOE_SORTING=1"
            lm_eval_num_fewshot: 20
            accuracy_test_threshold: 0.91
            runner: spur-runner-mi355x-8gpu
          - display_name: "MiniMax-M3-MXFP4 TP4"
            model_name: "MiniMax-M3-MXFP4"
            model_path: "amd/MiniMax-M3-MXFP4"
            client_command: "lm_eval --model local-chat-completions --apply_chat_template --fewshot_as_multiturn --model_args model=${MODEL_PATH},base_url=http://127.0.0.1:${VLLM_PORT}/v1/chat/completions,num_concurrent=32,max_gen_toks=2048 --tasks gsm8k --num_fewshot 5 --batch_size 65 --output_path ${OUTPUT_PATH}"
            extra_args: "--tensor-parallel-size 4 --kv-cache-dtype auto --no-trust-remote-code --gpu-memory-utilization 0.85 --block-size 128 --max-model-len 32768 --max-num-seqs 128 --max-num-batched-tokens 32768 --no-enable_prefix_caching --no-async-scheduling --language-model-only --hf-overrides '{\"use_index_cache\": true, \"index_topk_freq\": 4}' --compilation-config '{\"cudagraph_mode\": \"FULL_AND_PIECEWISE\"}'"
            env_vars: "AITER_QUICK_REDUCE_QUANTIZATION=INT4"
            lm_eval_num_fewshot: 5
            accuracy_test_threshold: 0.93
            runner: spur-runner-mi355x-8gpu
          - display_name: "Kimi-K3 DSpark DCP8 TP8"
            model_name: "Kimi-K3-DSpark"
            model_path: "moonshotai/Kimi-K3"
            draft_model_path: "Inferact/Kimi-K3-DSpark"
            client_command: "lm_eval --model local-completions --model_args model=${MODEL_PATH},base_url=http://127.0.0.1:${VLLM_PORT}/v1/completions,num_concurrent=64,max_retries=3,tokenized_requests=False,trust_remote_code=True --tasks gsm8k --num_fewshot ${LM_EVAL_NUM_FEWSHOT} --output_path ${OUTPUT_PATH}"
            extra_args: "--trust-remote-code --language-model-only --tensor-parallel-size 8 --decode-context-parallel-size 8 --kv-cache-dtype fp8 --max-model-len 16384 --max-num-seqs 64 --max-num-batched-tokens 16384 --gpu-memory-utilization 0.75 --block-size 128 --enable-prefix-caching --mamba-cache-mode align --compilation-config '{\"cudagraph_mode\":\"FULL_AND_PIECEWISE\"}' --additional-config '{\"online_quant_config\":{\"global_quant_config\":\"ptpc_fp8\",\"exclude_layer\":[\"lm_head\",\"model.embed_tokens\",\"*self_attn.[qkv]_conv1d*\",\"*block_sparse_moe.experts*\",\"*block_sparse_moe.routed_expert_*\",\"*vision_tower*\",\"*mm_projector*\"]}}' --speculative-config '{\"method\":\"dspark\",\"model\":\"/models/Inferact/Kimi-K3-DSpark\",\"num_speculative_tokens\":7}'"
            lm_eval_num_fewshot: 5
            accuracy_test_threshold: 0.95
            runner: spur-runner-mi355x-8gpu
          - display_name: "Qwen3.5-397B-A17B-MXFP4 TP4"
            model_name: "Qwen3.5-397B-A17B-MXFP4"
            model_path: "amd/Qwen3.5-397B-A17B-MXFP4"
            extra_args: "--tensor-parallel-size 4"
            env_vars: |
              ATOM_ENABLE_QK_NORM_ROPE_CACHE_QUANT_FUSION=1
              ATOM_USE_CUSTOM_ALL_GATHER=0
              ATOM_FP8_BLOCKSCALE_WEIGHT_PRESHUFFLE=0
            lm_eval_num_fewshot: 3
            accuracy_test_threshold: 0.83
            runner: spur-runner-mi355x-8gpu
    env:
      AITER_ARTIFACT_ID: ${{ needs.download_aiter_wheel.outputs.aiter_artifact_id }}
      CONTAINER_NAME: plugin_ci_vllm_${{ github.run_id }}_${{ strategy.job-index }}
      RESULT_DIR: plugin-ci-results
    steps:
      - name: Checkout ATOM repo
        uses: actions/checkout@v6

      - name: Download aiter wheel
        uses: actions/download-artifact@v8
        with:
          name: aiter-whl
          path: aiter-whl

      - name: Build vLLM cell
        id: cell
        env:
          MATRIX_JSON: ${{ toJson(matrix) }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SKIP_DOCKER_LOGIN: ${{ github.event.pull_request.head.repo.fork && '1' || '0' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/plugin_ci/build_cell_json.py \
            --plugin vllm \
            --matrix-json "${MATRIX_JSON}" \
            --github-output

      - name: Run vLLM accuracy job
        env:
          MATRIX_MODEL_NAME: ${{ matrix.model_name }}
          MATRIX_MODEL_PATH: ${{ matrix.model_path }}
          MATRIX_CLIENT_COMMAND: ${{ matrix.client_command }}
          MATRIX_EXTRA_ARGS: ${{ matrix.extra_args }}
          MATRIX_ENV_VARS: ${{ matrix.env_vars }}
          MATRIX_LM_EVAL_NUM_FEWSHOT: ${{ matrix.lm_eval_num_fewshot }}
          MATRIX_ACCURACY_TEST_THRESHOLD: ${{ matrix.accuracy_test_threshold }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SKIP_DOCKER_LOGIN: ${{ github.event.pull_request.head.repo.fork && '1' || '0' }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          HF_TOKEN: ${{ secrets.AMD_HF_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/plugin_ci/run_vllm_ci.sh
          bash .github/scripts/plugin_ci/run_vllm_ci.sh

      - name: Add vLLM result to job summary
        if: always()
        env:
          CELL_JSON: ${{ steps.cell.outputs.cell_json }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          cell = json.loads(os.environ.get("CELL_JSON") or "{}")
          result_root = Path(os.environ["RESULT_DIR"])
          outputs = list(result_root.rglob("oot_accuracy_output.txt"))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(f"## {cell.get('id', 'vLLM plugin CI')}\n\n")
              if outputs:
                  text = outputs[0].read_text(encoding="utf-8", errors="replace")
                  lines = text.splitlines()
                  table = []
                  capture = False
                  for line in lines:
                      if "|Tasks|Version|" in line:
                          capture = True
                      if capture:
                          if not line.strip() and table:
                              break
                          table.append(line)
                  if table:
                      summary.write("\n".join(table) + "\n")
          PY

      - name: Upload vLLM artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oot-${{ matrix.model_name }}-artifacts
          path: plugin-ci-results/
          if-no-files-found: ignore
