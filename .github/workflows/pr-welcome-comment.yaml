name: PR Welcome Comment

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = [
              "### 🏷️ CI Guide",
              "",
              "**Runs automatically on every eligible PR before approval:**",
              "- ✅ Pre Checkin: Black, Ruff, catalog schema validation, non-GPU unit tests",
              "",
              "**Heavy model tests:**",
              "- ✅ Gate checks are published on every PR so required checks do not stay missing",
              "- ✅ Expensive jobs run only after the PR is approved, or when a matching `ci:*` label is present",
              "- ✅ Pre Checkin must pass before approved heavy jobs continue",
              "- ✅ A matching path is required; unrelated paths publish a passing `not requested` gate",
              "",
              "**Path scope:**",
              "- Native ATOM, vLLM, and SGLang use ignore lists: docs/markdown and unrelated plugin or Mesh paths are skipped",
              "- ATOMesh uses an include list: Mesh code, ATOMesh scripts/workflows/catalogs, OpenAI entrypoints, and Slurm helpers",
              "- Relevant path alone does not start expensive jobs; approval or a matching label still opens the gate",
              "",
              "| Label | Tests |",
              "|-------|-------|",
              "| `ci:full` | Run all heavy PR model tests: native ATOM, vLLM, SGLang, and ATOMesh |",
              "| `ci:atom` | Run native ATOM model accuracy tests |",
              "| `ci:vllm` | Run ATOM vLLM OOT model accuracy tests |",
              "| `ci:sglang` | Run ATOM SGLang model accuracy tests |",
              "| `ci:mesh` | Run ATOMesh accuracy/benchmark gates for Mesh-related changes |",
              "",
              "> Heavy jobs are skipped when the path is not relevant, or when the PR is not approved and no matching `ci:*` label is present.",
              `> Add labels via the sidebar or \`gh pr edit ${context.issue.number} --add-label <label>\``,
            ].join("\n");

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            } catch (error) {
              core.warning(`Failed to post CI Guide comment: ${error.message}`);
            }
