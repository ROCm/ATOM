name: Pre Checkin

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]  # Triggers on PRs targeting `main`
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'  # 6:00 AM Beijing Time (UTC+8)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit-tests:
    name: CI orchestration regression tests (CPU only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
    - run: python3 -m pip install pytest pyyaml
    - run: pytest --noconftest -p no:cacheprovider -q tests/test_heavy_ci_gate.py
      env:
        PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
