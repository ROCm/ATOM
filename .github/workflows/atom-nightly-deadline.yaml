name: ATOM Nightly Deadline

# Stops the scheduled MI355 runs of the workflows in WORKFLOWS (SGLang and
# vLLM benchmark / accuracy) that are still going at 09:00 Beijing
# time, so a nightly that overruns does not hold the MI355 runners into the
# working day. A workflow opts its scheduled runs in by titling them
# "(scheduled MI355)" in run-name. Scheduled MI308 runs (titled
# "(scheduled MI308)") and manually dispatched runs are left alone.
on:
  schedule:
    - cron: '0 1 * * *'  # 09:00 Beijing time (01:00 UTC)
  workflow_dispatch:

permissions:
  actions: write

jobs:
  stop-overrunning-nightly-runs:
    name: Stop scheduled MI355 runs still in progress
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WORKFLOWS: >-
        atom-sglang-benchmark.yaml atom-sglang-accuracy-validation.yaml
        atom-vllm-benchmark.yaml atom-vllm-accuracy-validation.yaml
      # A plain cancel still runs the GPU jobs' `if: always()` container
      # cleanup; runs that have not finished after this grace period are
      # force-cancelled, which skips it.
      GRACE_SECONDS: 300
      # How long a force-cancelled run gets to show up as completed.
      SETTLE_SECONDS: 120
    steps:
      # The job fails if any workflow's runs could not be listed, if a
      # force-cancel was refused, or if a run is still unfinished at the end.
      # A failed plain cancel only warns: the force-cancel that follows it
      # covers the run.
      - name: Cancel, then force-cancel what is left
        run: |
          set -uo pipefail
          failed=0

          # Sets `runs` to the unfinished scheduled MI355 runs. A workflow
          # whose runs cannot be listed fails the job, but the others are
          # still listed (and cancelled).
          list_runs() {
            runs=()
            local workflow out id
            for workflow in ${WORKFLOWS}; do
              if ! out="$(gh api "repos/${GH_REPO}/actions/workflows/${workflow}/runs?event=schedule&per_page=50" \
                --jq '.workflow_runs[] | select(.status != "completed" and (.display_title | endswith("(scheduled MI355)"))) | .id')"; then
                echo "::error::Could not list the runs of ${workflow}."
                failed=1
                continue
              fi
              while read -r id; do
                [ -n "${id}" ] && runs+=("${id}")
              done <<< "${out}"
            done
          }

          # Lists again until no run is unfinished or the time is up.
          wait_for_runs() {
            local end=$(( $(date +%s) + $1 ))
            list_runs
            while [ "${#runs[@]}" -gt 0 ] && [ "$(date +%s)" -lt "${end}" ]; do
              sleep 30
              list_runs
            done
          }

          list_runs
          if [ "${#runs[@]}" -eq 0 ]; then
            echo "No scheduled MI355 run is still in progress."
            exit "${failed}"
          fi

          for run in "${runs[@]}"; do
            echo "Cancelling run ${run}: https://github.com/${GH_REPO}/actions/runs/${run}"
            if ! gh api -X POST "repos/${GH_REPO}/actions/runs/${run}/cancel"; then
              echo "::warning::Cancelling run ${run} failed; it is force-cancelled if still unfinished after ${GRACE_SECONDS}s."
            fi
          done

          wait_for_runs "${GRACE_SECONDS}"
          for run in "${runs[@]}"; do
            echo "Force-cancelling run ${run}: https://github.com/${GH_REPO}/actions/runs/${run}"
            if ! gh api -X POST "repos/${GH_REPO}/actions/runs/${run}/force-cancel"; then
              echo "::error::Force-cancelling run ${run} failed."
              failed=1
            fi
          done

          if [ "${#runs[@]}" -gt 0 ]; then
            wait_for_runs "${SETTLE_SECONDS}"
          fi
          if [ "${#runs[@]}" -gt 0 ]; then
            echo "::error::Still unfinished after force-cancel: ${runs[*]}"
            exit 1
          fi
          exit "${failed}"
