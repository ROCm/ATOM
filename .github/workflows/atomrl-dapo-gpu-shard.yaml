name: AtomRL DAPO GPU shard (internal)

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Local AtomRL DAPO image tag"
        required: false
        type: string
        default: atomrl:dapo-ci
      data_root:
        description: "Shared data root containing the DAPO models and datasets"
        required: false
        type: string
        default: /models/atomrl

concurrency:
  group: atomrl-dapo-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  atomrl-dapo-suite:
    name: AtomRL DAPO GPU suite
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
    runs-on: linux-atom-pitt-mi350x-8
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      DATA_ROOT: ${{ inputs.data_root }}
      DSV3_REVISION: 634c1d1f51816415fa371e51281e435ce4422469
      IMAGE_TAG: ${{ inputs.image_tag }}-${{ github.run_id }}-${{ github.run_attempt }}
      CONTAINER_NAME: atomrl_gpu_unit_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - name: Checkout ATOM repository
        uses: actions/checkout@v6

      - name: Build AtomRL DAPO suite image
        run: |
          set -euo pipefail
          docker build --pull \
            --file atomrl/docker/Dockerfile.dev \
            --tag "$IMAGE_TAG" \
            .

      - name: Prepare pinned DAPO models and data
        run: |
          set -euo pipefail
          docker run --rm \
            -e DATA_ROOT \
            -v "$DATA_ROOT:$DATA_ROOT" \
            "$IMAGE_TAG" bash -euc \
            'mkdir -p "$DATA_ROOT/hf"; chmod 0777 "$DATA_ROOT/hf"'
          docker run --rm --network=host \
            -v "$DATA_ROOT:$DATA_ROOT" \
            "$IMAGE_TAG" python \
            examples/DAPO/tools/prepare_data.py \
              --data-root "$DATA_ROOT" \
              --models Qwen3-8B-Base Qwen3-30B-A3B-Base
          docker run --rm --network=host \
            -e HF_HOME=/data/rl_data/hf \
            -e DSV3_REVISION="$DSV3_REVISION" \
            -v "$DATA_ROOT/hf:/data/rl_data/hf" \
            "$IMAGE_TAG" python -c \
            "import os; from huggingface_hub import snapshot_download; snapshot_download('bzantium/tiny-deepseek-v3', revision=os.environ['DSV3_REVISION'])"

      - name: Install harness dependency
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || \
            python3 -m pip install --user --break-system-packages pyyaml

      - name: Run AtomRL DAPO GPU suite
        run: bash .github/scripts/run_atomrl_dapo_gpu_suite.sh

      - name: Upload DAPO regression results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atomrl-dapo-suite-${{ github.run_id }}
          path: |
            atomrl/output/regression
            ${{ env.DATA_ROOT }}/logs/atomrl-*.log
          if-no-files-found: warn

      - name: Clean up AtomRL DAPO image and containers
        if: always()
        run: |
          docker ps -aq --filter "name=atomrl-ex-${{ github.run_id }}-" \
            | xargs -r docker rm -f || true
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
          docker rmi -f "$IMAGE_TAG" 2>/dev/null || true
