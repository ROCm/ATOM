name: Sandbox Evaluator

# CI evaluator design sandbox (ci-sandbox/* only; not for main). Checks what
# the collaborator-permission endpoint returns to a GITHUB_TOKEN with no
# permissions, as dispatch-approval.yaml would call it.

on:
  push:
    branches: [ci-sandbox/ctl]
    paths: [sandbox/op.json]

permissions: {}

jobs:
  role:
    runs-on: ubuntu-latest
    steps:
      - name: Read roles with an empty-permission token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for user in valarLip whx-sjtu; do
            if out="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${user}/permission" \
                --jq '"\(.permission) role=\(.role_name) admin=\(.user.permissions.admin) maintain=\(.user.permissions.maintain)"' 2>&1)"; then
              echo "ROLE ${user}: ${out}"
            else
              echo "ROLE_FAILED ${user}: ${out}"
            fi
          done
