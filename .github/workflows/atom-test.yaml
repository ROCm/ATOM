name: ATOM Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]  # Triggers on PRs targeting `main`
    types: [opened, synchronize, reopened, ready_for_review, labeled, closed]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'atom/plugin/**'
      - 'atom/mesh/**'
      - '.github/benchmark/models_atomesh.yaml'
      - '.github/scripts/atomesh/**'
      - '.github/workflows/atomesh-*.yaml'
      - '.github/workflows/atom-vllm-*.yaml'
      - '.github/workflows/atom-sglang-*.yaml'
      - '.github/benchmark/oot_models_accuracy.json'
      - '.github/benchmark/sglang_models_accuracy.json'
      - 'LICENSE'
      - '.gitignore'
  pull_request_review:
    types: [submitted]
  schedule:
    # Nightly at 00:00 Beijing time (16:00 UTC)
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      aiter_branch:
        description: 'ROCm/aiter branch to build inside the CI image'
        required: false
        default: 'main'
        type: string
      atom_base_image:
        description: 'Docker image used as the ATOM test base image'
        required: false
        default: 'rocm/atom-dev:latest'
        type: string

concurrency:
  # Keep scheduled main runs from blocking push-triggered validation.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.number && 'pr' || github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && (github.event_name != 'pull_request_review' || github.event.review.state == 'approved') }}

env:
  ATOM_BASE_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.atom_base_image || 'rocm/atom-dev:latest' }}
  ATOM_PYTHON_TAG: "cp312"
  GITHUB_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || 'https://github.com/ROCm/ATOM.git' }}
  GITHUB_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.event.head_commit.id || github.sha }}
  # workflow_dispatch: inputs.aiter_branch; otherwise main (matches previous default-branch shallow clone)
  AITER_GIT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.aiter_branch || 'main' }}

jobs:
  ci-gate:
    name: Check Heavy CI Gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      reason: ${{ steps.gate.outputs.reason }}
      duplicate_run_url: ${{ steps.gate.outputs.duplicate_run_url }}
    steps:
      - name: Checkout ATOM repo
        uses: actions/checkout@v6

      - name: Check approval and label gate
        id: gate
        env:
          CI_GATE_DUPLICATE_SUCCESS_JOB_PATTERN: '(^| / )Accuracy \('
          CI_GATE_LABELS: ci:full,ci:atom
          CI_GATE_PATHS_IGNORE: |
            **/*.md
            docs/**
            atom/plugin/**
            atom/mesh/**
            .github/workflows/atomesh-*.yaml
            .github/scripts/atomesh_*.sh
            .github/dashboard/atomesh_*.html
            .github/workflows/atom-vllm-*.yaml
            .github/workflows/atom-sglang-*.yaml
            .github/benchmark/oot_models_accuracy.json
            .github/benchmark/sglang_models_accuracy.json
            LICENSE
            .gitignore
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./.github/scripts/check_heavy_ci_gate.sh


  gate-result:
    if: ${{ needs.ci-gate.outputs.should_run != 'true' }}
    needs: [ci-gate]
    name: Heavy CI not required
    runs-on: ubuntu-latest
    env:
      GATE_REASON: ${{ needs.ci-gate.outputs.reason }}
      DUPLICATE_RUN_URL: ${{ needs.ci-gate.outputs.duplicate_run_url }}
    steps:
      - name: Report gate decision
        run: |
          echo "Heavy CI was not required for this trigger."
          echo "Reason: ${GATE_REASON}"
          if [ -n "${DUPLICATE_RUN_URL}" ]; then
            echo "Previous successful run: ${DUPLICATE_RUN_URL}"
          fi

  run-tests:
    if: ${{ needs.ci-gate.outputs.should_run == 'true' }}
    needs: [ci-gate]
    name: Run ATOM accuracy tests
    uses: ./.github/workflows/atom-test-reusable.yaml
    with:
      caller_event_name: ${{ github.event_name }}
      caller_sha: ${{ github.sha }}
      repo_url: ${{ github.event.pull_request.head.repo.clone_url || 'https://github.com/ROCm/ATOM.git' }}
      commit_sha: ${{ github.event.pull_request.head.sha || github.event.head_commit.id || github.sha }}
      atom_base_image: ${{ github.event_name == 'workflow_dispatch' && inputs.atom_base_image || 'rocm/atom-dev:latest' }}
      aiter_git_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.aiter_branch || 'main' }}
      check_signal_event_name: ${{ github.event.pull_request && 'pull_request' || github.event_name }}
      check_signal_head_ref: ${{ github.event.pull_request.head.ref || github.head_ref || github.ref_name }}
      check_signal_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      pr_head_repo_fork: ${{ github.event.pull_request.head.repo.fork || false }}
      is_main_ref: ${{ github.ref == 'refs/heads/main' }}
    secrets: inherit

  offline-smoke-test:
    # Ungated on purpose: this runs on every PR, unlike the accuracy matrix
    # behind `ci-gate`, which only opens on an approval or a ci:* label.
    #
    # It guards the path the nightly Docker release smoke-tests after it builds
    # the image -- the offline entrypoint. The accuracy job is not a substitute:
    # it drives the server over HTTP, and the two do not share the code that
    # hands tokens back to the caller. A bug that killed the offline output
    # thread reached main and showed up a day later, as a 60-minute timeout in
    # the nightly.
    #
    # Completing is the assertion. The failure it exists to catch is a hang or
    # a crash, not wrong text, so there is no golden file to keep per model --
    # and one small model exercises that code path as well as thirteen do.
    name: Offline inference smoke test
    runs-on: linux-atom-mi35x-1
    timeout-minutes: 45
    env:
      CONTAINER_NAME: atom_smoke_test
      SMOKE_MODEL: meta-llama/Meta-Llama-3-8B-Instruct
      # Matches this model's entry in models_accuracy.json.
      SMOKE_EXTRA_ARGS: --kv_cache_dtype fp8 --gpu-memory-utilization 0.3
    steps:
      - name: Kill stale containers
        run: |
          docker ps -aq -f "name=${CONTAINER_NAME}" | xargs -r docker rm -f || true

      - name: Checkout ATOM repo
        uses: actions/checkout@v6

      - name: Docker Login
        uses: ./.github/actions/docker-auth
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Start CI container
        uses: ./.github/actions/setup-gpu-container
        with:
          container-name: ${{ env.CONTAINER_NAME }}
          base-image: ${{ env.ATOM_BASE_IMAGE }}
          runner: linux-atom-mi35x-1
          hf-token: ${{ secrets.AMD_HF_TOKEN }}
          network-host: "true"

      - name: Download model
        timeout-minutes: 30
        env:
          HF_TOKEN: ${{ secrets.AMD_HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -d "/models" ]; then
            docker exec \
              -e HF_TOKEN="${HF_TOKEN:-}" \
              -e MODEL_ID="${SMOKE_MODEL}" \
              -e TARGET_DIR="/models/${SMOKE_MODEL}" \
              "$CONTAINER_NAME" \
              bash -lc 'bash /workspace/.github/scripts/download_model_with_lock.sh "$MODEL_ID" "$TARGET_DIR"'
          else
            echo "No /models mount; simple_inference will fetch from the hub."
          fi

      - name: Run offline inference
        # An 8B model loads and answers a handful of prompts in a couple of
        # minutes. This bound is the guard: the failure it exists to catch is a
        # hang, and a hang should cost minutes rather than most of an hour.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          if [ -d "/models" ]; then
            model_path="/models/${SMOKE_MODEL}"
          else
            model_path="${SMOKE_MODEL}"
          fi
          echo "Model path: $model_path"
          # Piped over stdin so the container's shell parses any quoting in the
          # extra args itself; interpolating them into `bash -lc "..."` lets the
          # host shell strip inner quotes first.
          echo "python3 -m atom.examples.simple_inference \
            --model $model_path $SMOKE_EXTRA_ARGS --temperature 0" \
            | docker exec -i "$CONTAINER_NAME" bash -l | tee smoke_output.txt
          grep -qE '^(Prompt|Completion):' smoke_output.txt \
            || { echo "::error::simple_inference produced no completions"; exit 1; }

      - name: Clean Up
        if: always()
        run: |
          docker ps -aq -f "name=${CONTAINER_NAME}" | xargs -r docker rm -f || true
