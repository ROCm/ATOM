# Runs one ATOMesh serving config across its concurrency cells. The caller
# matrixes over configs and invokes this once per config, so GitHub nests each
# concurrency job under its config, as with benchmark-tmpl.yml.
name: Atomesh benchmark config

on:
  workflow_call:
    inputs:
      matrix_json:
        description: 'Matrix of this config''s pd_matrix.py cells, {"include": [...]}'
        type: string
        required: true
      atom_source:
        description: 'ATOM python package the servers import: mounted or image'
        type: string
        default: mounted
      model_root:
        description: 'ATOMESH_MODEL_ROOT the matrix was expanded with'
        type: string
        required: true
      dashboard_hardware:
        description: 'Hardware label written into dashboard entries'
        type: string
        required: true

# The caller's workflow-level env does not reach a called workflow.
env:
  # GID 1 selects IPv4 on TW; GID 0 is IPv6 link-local.
  NCCL_IB_GID_INDEX: '1'
  ATOMESH_MODEL_ROOT: ${{ inputs.model_root }}
  ATOMESH_DASHBOARD_HARDWARE: ${{ inputs.dashboard_hardware }}

jobs:
  benchmark:
    name: c=${{ join(matrix.concurrency, ',') }}
    runs-on: ${{ matrix.runner.slurm_submit_runner }}
    # Configs run in parallel, so this covers waiting in the Slurm queue; the
    # Slurm job's own --time (runner.time_limit) bounds the run itself.
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(inputs.matrix_json) }}
    steps:
      - name: Checkout ATOM repo
        uses: actions/checkout@v6

      - name: Cancel existing jobs on benchmark nodes
        if: ${{ github.event_name == 'schedule' && matrix.runner.slurm_submit_runner != 'atomesh-cicd' }}
        env:
          NODES: ${{ join(matrix.nodes, ',') }}
          SLURM_SUBMIT_RUNNER: ${{ matrix.runner.slurm_submit_runner }}
        run: |
          set -euo pipefail
          export PATH="/usr/local/slurm-24.05.5.1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH:-}"

          if [[ "${SLURM_SUBMIT_RUNNER}" == "atomesh-cicd-mi350" ]]; then
            echo "Slurm job cleanup is disabled for ${SLURM_SUBMIT_RUNNER}; skipping."
            exit 0
          fi

          if [[ -z "${NODES}" ]]; then
            echo "No explicit benchmark nodes were selected; skipping Slurm job cleanup."
            exit 0
          fi

          for command_name in squeue scancel; do
            if ! command -v "${command_name}" >/dev/null 2>&1; then
              echo "ERROR: ${command_name} not found on $(hostname). PATH=${PATH}" >&2
              exit 127
            fi
          done

          squeue_cmd=(squeue)
          scancel_cmd=(scancel)
          if [[ "${SLURM_SUBMIT_RUNNER}" == "atomesh-cicd-mi355-crusoe" ]]; then
            controller="http://crs-m2m-cpu-spur-v2-001.crusoe.amd.com:6817"
            squeue_cmd+=(--controller "${controller}")
            scancel_cmd+=(--controller "${controller}")
          fi

          echo "=== Checking all users' Slurm jobs on ${NODES} ==="
          job_ids="$("${squeue_cmd[@]}" --noheader -w "${NODES}" --format="%A" | sort -u)"
          if [[ -z "${job_ids}" ]]; then
            echo "No existing Slurm jobs found on ${NODES}."
            exit 0
          fi

          echo "Cancelling Slurm jobs on ${NODES}:"
          printf '%s\n' "${job_ids}"
          mapfile -t job_id_list <<< "${job_ids}"
          for job_id in "${job_id_list[@]}"; do
            if timeout 60s "${scancel_cmd[@]}" "${job_id}"; then
              echo "Finished cancelling Slurm job ${job_id}."
            else
              status=$?
              if [[ "${status}" -eq 124 ]]; then
                echo "ERROR: Timed out after 60 seconds cancelling Slurm job ${job_id}." >&2
              else
                echo "ERROR: Failed cancelling Slurm job ${job_id} with exit code ${status}." >&2
              fi
              exit "${status}"
            fi
          done

      - name: Resolve machine-specific benchmark paths
        id: machine-paths
        env:
          CELL_JSON: ${{ toJson(matrix) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import socket
          from pathlib import Path

          cell = json.loads(os.environ["CELL_JSON"])
          # The matrix is expanded on ubuntu-latest, before the submit machine is known.
          machine_name = socket.gethostname().split(".", 1)[0]
          if machine_name == "pit2-vm-amd-xl-02":
              old_model_root = os.environ["ATOMESH_MODEL_ROOT"].rstrip("/")

              def remap_model_paths(value):
                  if isinstance(value, dict):
                      return {key: remap_model_paths(item) for key, item in value.items()}
                  if isinstance(value, list):
                      return [remap_model_paths(item) for item in value]
                  if isinstance(value, str) and (value == old_model_root or value.startswith(old_model_root + "/")):
                      return "/share_nfs/models" + value[len(old_model_root):]
                  return value

              cell = remap_model_paths(cell)
              cell["runner"]["log_root"] = "/share_nfs/ATOMESH_RUNNER/ATOMESH_LOG"
              cell["runner"]["slurm_partition"] = "amd-spur"
              cell["runner"]["slurm_qos"] = "amd-frameworks-qos"

          if (
              cell["runner"].get("slurm_account") == "amd-atom"
              and cell["runner"].get("slurm_submit_runner") != "atomesh-cicd-mi355-crusoe"
          ):
              cell["runner"]["slurm_qos"] = "amd-atom-qos"

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"cell_json={json.dumps(cell, separators=(',', ':'))}\n")
          PY

      - name: Print benchmark config
        env:
          CELL_JSON: ${{ steps.machine-paths.outputs.cell_json }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          cell = json.loads(os.environ["CELL_JSON"])

          def get(path, default=""):
              cur = cell
              for key in path.split("."):
                  if not isinstance(cur, dict) or key not in cur:
                      return default
                  cur = cur[key]
              return cur

          summary = {
              "id": get("id"),
              "suite": get("suite"),
              "model": get("model"),
              "case": get("name"),
              "image": get("image"),
              "model_path": get("model_path"),
              "precision": get("precision"),
              "runner": get("runner.slurm_submit_runner"),
              "slurm_account": get("runner.slurm_account"),
              "slurm_partition": get("runner.slurm_partition"),
              "slurm_qos": get("runner.slurm_qos"),
              "log_root": get("runner.log_root"),
              "nodes": ",".join(get("nodes", [])),
              "num_nodes": get("num_nodes"),
              "topology": get("topology"),
              "pd_worker_layout": get("pd_worker_layout"),
              "disaggregated": get("disaggregated"),
              "prefill": get("service.prefill"),
              "decode": get("service.decode"),
              "router": get("service.router"),
              "server_args": get("server_args"),
              "isl": get("isl"),
              "osl": get("osl"),
              "concurrency": get("concurrency"),
              "run_eval": get("run_eval"),
              "accuracy": get("accuracy"),
          }

          print("=== ATOMesh benchmark config summary ===")
          for key, value in summary.items():
              print(f"{key}: {value}")

          print("=== ATOMesh benchmark full cell JSON ===")
          print(json.dumps(cell, indent=2, sort_keys=True))
          PY

      - name: Run Slurm benchmark cell
        env:
          # Build the reviewed source in a separate setup container. Use the
          # existing release profile for both benchmark and eval services.
          ATOMESH_BUILD_MESH: ${{ matrix.benchmark.kind == 'aiperf_agentic' && 'true' || 'false' }}
          ATOMESH_MESH_BUILD_PROFILE: release
          ATOMESH_ATOM_SOURCE: ${{ inputs.atom_source }}
          CELL_JSON: ${{ steps.machine-paths.outputs.cell_json }}
          RESULT_DIR: atomesh-results
          SLURM_SUBMIT_RUNNER: ${{ matrix.runner.slurm_submit_runner }}
        run: |
          set -euo pipefail
          ORIGINAL_WORKSPACE="${GITHUB_WORKSPACE}"
          CURRENT_USER="$(id -un 2>/dev/null || id -u)"
          if [[ "${SLURM_SUBMIT_RUNNER}" == "atomesh-cicd-mi350" ]]; then
            SHARED_WORKSPACE="/data/${CURRENT_USER}/atomesh-ci/${GITHUB_RUN_ID}/${{ matrix.id }}"
            rm -rf "${SHARED_WORKSPACE}"
            mkdir -p "${SHARED_WORKSPACE}"
            if command -v rsync >/dev/null 2>&1; then
              rsync -a --delete "${ORIGINAL_WORKSPACE}/" "${SHARED_WORKSPACE}/"
            else
              tar -C "${ORIGINAL_WORKSPACE}" -cf - . | tar -C "${SHARED_WORKSPACE}" -xf -
            fi
            cd "${SHARED_WORKSPACE}"
            RESULT_DIR="${ORIGINAL_WORKSPACE}/${RESULT_DIR}"
          fi
          chmod +x .github/scripts/atomesh/*.sh .github/scripts/atomesh/*.py
          SLURM_CANCEL_HELPER="${RESULT_DIR}/${{ matrix.id }}.slurm-cancel.sh"
          SLURM_JOB_NAME="${{ matrix.id }}-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
          SPUR_CONTROLLER_ADDR="${SPUR_CONTROLLER_ADDR:-}"
          if [[ "${SLURM_SUBMIT_RUNNER}" == "atomesh-cicd-mi355-crusoe" ]]; then
            SPUR_CONTROLLER_ADDR="http://crs-m2m-cpu-spur-v2-001.crusoe.amd.com:6817"
          elif [[ -z "${SPUR_CONTROLLER_ADDR}" && "${SLURM_SUBMIT_RUNNER}" == "atomesh-cicd-mi350" ]]; then
            SPUR_CONTROLLER_ADDR="http://134.199.196.72:6817"
          fi
          source "${GITHUB_WORKSPACE}/.github/scripts/slurm_submit_helpers.sh"
          detect_slurm_backend
          PD_SUBMIT_PID=""
          scancel_slurm_by_name_from_wrapper() {
            command -v scancel >/dev/null 2>&1 || return 0
            local -a scancel_cmd=(scancel)
            if [[ "${USES_SPUR_CONTROLLER}" == "1" && -n "${SPUR_CONTROLLER_ADDR}" ]]; then
              scancel_cmd+=(--controller "${SPUR_CONTROLLER_ADDR}")
            fi
            scancel_cmd+=(--user "${CURRENT_USER}" --name "${SLURM_JOB_NAME}")
            if command -v timeout >/dev/null 2>&1; then
              timeout "${SLURM_SCANCEL_TIMEOUT_SECONDS:-8}" "${scancel_cmd[@]}" || true
            else
              "${scancel_cmd[@]}" || true
            fi
          }
          cleanup_slurm_from_wrapper() {
            local rc=$?
            trap - EXIT HUP INT TERM
            if [[ "${rc}" -eq 75 && -s "${SLURM_CANCEL_HELPER}.status-unknown" ]]; then
              # Shared helper's EX_TEMPFAIL: status is unknown, not a batch failure.
              echo "WARNING: Slurm monitoring failed; preserving job ${SLURM_JOB_NAME}. Check the recorded job ID and controller before retrying."
            elif [[ "${rc}" -ne 0 ]]; then
              echo "=== cancelling Slurm job from workflow wrapper rc=${rc} ==="
              if [[ -x "${SLURM_CANCEL_HELPER}" ]]; then
                SLURM_CANCEL_WAIT_SECONDS="${SLURM_CANCEL_WAIT_SECONDS:-5}" \
                  SLURM_CANCEL_KILL_WAIT_SECONDS="${SLURM_CANCEL_KILL_WAIT_SECONDS:-5}" \
                  bash "${SLURM_CANCEL_HELPER}" || true
              else
                echo "Slurm cancel helper is not available yet"
              fi
              scancel_slurm_by_name_from_wrapper
            fi
            if [[ -n "${PD_SUBMIT_PID}" ]] && kill -0 "${PD_SUBMIT_PID}" 2>/dev/null; then
              kill "${PD_SUBMIT_PID}" 2>/dev/null || true
              wait "${PD_SUBMIT_PID}" 2>/dev/null || true
            fi
            exit "${rc}"
          }
          trap cleanup_slurm_from_wrapper EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          bash .github/scripts/atomesh/pd_submit.sh \
            --cell-json "$CELL_JSON" \
            --result-dir "$RESULT_DIR" &
          PD_SUBMIT_PID=$!
          wait "${PD_SUBMIT_PID}"

      - name: Summarize ${{ matrix.id }} benchmark result
        if: always()
        env:
          MATRIX_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          mkdir -p atomesh-results
          SUMMARY_PATH="atomesh-results/${MATRIX_ID}-summary.md"
          AIPERF_RAW_PATH="atomesh-results/${MATRIX_ID}-aiperf-raw.md"
          BENCHMARK_ACTION_INPUT="atomesh-results/${MATRIX_ID}-benchmark-action.json"

          python3 .github/scripts/atomesh/process_result.py \
            "atomesh-results/${MATRIX_ID}" \
            --output "${BENCHMARK_ACTION_INPUT}" \
            --summary "${SUMMARY_PATH}" \
            --hardware "${ATOMESH_DASHBOARD_HARDWARE}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Empty for standard ISL/OSL cases: only AIPerf writes the console dump.
          python3 .github/scripts/atomesh/aiperf_console_report.py \
            "atomesh-results/${MATRIX_ID}" \
            --output "${AIPERF_RAW_PATH}"

          {
            echo "## ${MATRIX_ID}"
            echo
            if [ -f "atomesh-results/${MATRIX_ID}.slurm-job-id" ]; then
              echo "Slurm job: $(cat "atomesh-results/${MATRIX_ID}.slurm-job-id")"
              echo
            fi
            if [ -f "atomesh-results/${MATRIX_ID}.log-root" ]; then
              echo "Log path: \`$(cat "atomesh-results/${MATRIX_ID}.log-root")\`"
              echo
            fi
            cat "${SUMMARY_PATH}"
            if [ -s "${AIPERF_RAW_PATH}" ]; then
              echo
              cat "${AIPERF_RAW_PATH}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          cat "${SUMMARY_PATH}"
          if [ -s "${AIPERF_RAW_PATH}" ]; then
            cat "${AIPERF_RAW_PATH}"
          fi

      - name: Upload AIPerf Perfetto traces
        if: ${{ always() && matrix.benchmark.kind == 'aiperf_agentic' }}
        uses: ./.github/actions/upload-aiperf-traces
        with:
          result-dir: atomesh-results/${{ matrix.id }}
          artifact-name: aiperf-chrome-traces-${{ matrix.id }}
          output-dir: aiperf-traces/${{ matrix.id }}
          run-url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Prepare agentic PD latency reports
        if: ${{ always() && matrix.benchmark.kind == 'aiperf_agentic' }}
        id: metrics-reports
        env:
          MATRIX_ID: ${{ matrix.id }}
        run: |
          python3 .github/scripts/atomesh/observability/stage_reports.py \
            --cell "$MATRIX_ID" \
            --output "atomesh-reports/$MATRIX_ID"

      - name: Upload agentic PD latency reports
        if: ${{ always() && steps.metrics-reports.outcome == 'success' }}
        id: metrics-artifact
        uses: actions/upload-artifact@v7
        with:
          name: atomesh-latency-${{ matrix.id }}-${{ github.run_attempt }}
          path: atomesh-reports/${{ matrix.id }}/
          if-no-files-found: error

      - name: Link latency reports in job summary
        if: ${{ always() && steps.metrics-artifact.outcome == 'success' }}
        env:
          MATRIX_ID: ${{ matrix.id }}
          METRICS_ARTIFACT_URL: ${{ steps.metrics-artifact.outputs.artifact-url }}
        run: |
          python3 .github/scripts/atomesh/observability/stage_reports.py \
            --cell "$MATRIX_ID" \
            --output "atomesh-reports/$MATRIX_ID" \
            --summary-only

      - name: Locate torch profiler traces
        if: always()
        id: torch-traces
        env:
          MATRIX_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          # pd_submit.sh leaves torch_traces out of atomesh-results, so read
          # them straight from the case's shared log root.
          log_root_file="atomesh-results/${MATRIX_ID}.log-root"
          log_root=""
          if [[ -s "${log_root_file}" ]]; then
            log_root="$(tr -d '\n' < "${log_root_file}")"
          fi
          if [[ -n "${log_root}" ]] \
            && [[ -n "$(find "${log_root}" -path '*/torch_traces/*' -name '*.pt.trace.json*' -print -quit 2>/dev/null)" ]]; then
            echo "has_traces=true" >> "$GITHUB_OUTPUT"
            echo "log_root=${log_root}" >> "$GITHUB_OUTPUT"
            find "${log_root}" -path '*/torch_traces/*' -type f -printf '%s\t%P\n' | sort -k2
          else
            echo "has_traces=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload torch profiler traces
        if: ${{ always() && steps.torch-traces.outputs.has_traces == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: atomesh-torch-traces-${{ matrix.id }}
          path: |
            ${{ steps.torch-traces.outputs.log_root }}/slurm_job-*/torch_traces/
            ${{ steps.torch-traces.outputs.log_root }}/slurm_job-*/benchmark_results/*/torch_profile.log
          # Traces are already gzip; recompressing GBs buys nothing.
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload model benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atomesh-model-benchmark-${{ matrix.id }}
          path: |
            atomesh-results/
          if-no-files-found: ignore
