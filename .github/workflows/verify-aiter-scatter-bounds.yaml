name: Verify AITER scatter_reduce bounds

# Proves CI is running the hardened moe_scatter_reduce (max_sorted skip), not
# the image's stock aiter. Two install modes:
#   * aiter_ref (default): reinstall amd-aiter from ROCm/aiter@ref via
#     install_aiter_from_ref.sh (branch mengqing/moe_scatter_reduce_bounds).
#   * patch: apply .github/patches/aiter_moe_scatter_reduce_bounds.patch onto
#     the image aiter (same path atomesh C40 verification uses).

on:
  workflow_dispatch:
    inputs:
      aiter_ref:
        description: 'ROCm/aiter git ref to install (empty = patch image aiter instead)'
        required: false
        default: 'mengqing/moe_scatter_reduce_bounds'
        type: string
      install_mode:
        description: 'How to get the fixed operator into the container'
        required: false
        default: 'aiter_ref'
        type: choice
        options:
          - aiter_ref
          - patch
      atom_base_image:
        description: 'Docker image used as the ATOM test base'
        required: false
        default: 'rocm/atom-dev:nightly_202610111453-rocm10.0'
        type: string
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/patches/aiter_moe_scatter_reduce_bounds.patch'
      - '.github/scripts/apply_aiter_scatter_reduce_bounds_patch.sh'
      - '.github/scripts/install_aiter_from_ref.sh'
      - '.github/workflows/verify-aiter-scatter-bounds.yaml'
      - 'tests/test_minimax_m3_moe_scatter_reduce.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  ATOM_BASE_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.atom_base_image || 'rocm/atom-dev:nightly_202610111453-rocm10.0' }}
  CONTAINER_NAME: scatter_bounds_${{ github.run_id }}
  AITER_GIT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.aiter_ref || 'mengqing/moe_scatter_reduce_bounds' }}
  INSTALL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.install_mode || 'aiter_ref' }}

jobs:
  scatter-bounds-gpu:
    name: scatter_reduce GPU tests
    if: ${{ !github.event.pull_request || github.event.pull_request.draft == false }}
    # Same self-hosted label as atom accuracy / smoke GPU jobs.
    runs-on: linux-atom-do-mi350x-8
    timeout-minutes: 90
    steps:
      - name: Checkout ATOM
        uses: actions/checkout@v6

      - name: Docker Login
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: ./.github/actions/docker-auth
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Start GPU container
        uses: ./.github/actions/setup-gpu-container
        with:
          container-name: ${{ env.CONTAINER_NAME }}
          base-image: ${{ env.ATOM_BASE_IMAGE }}
          runner: linux-atom-do-mi350x-8
          env-vars: |
            AITER_LOG_LEVEL=WARNING
            AMD_SERIALIZE_KERNEL=3
            HIP_VISIBLE_DEVICES=0
            ROCR_VISIBLE_DEVICES=0

      - name: Install fixed aiter (ref)
        if: ${{ env.INSTALL_MODE == 'aiter_ref' && env.AITER_GIT_REF != '' }}
        env:
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          AITER_GIT_REF: ${{ env.AITER_GIT_REF }}
        run: bash .github/scripts/install_aiter_from_ref.sh

      - name: Install fixed aiter (patch)
        if: ${{ env.INSTALL_MODE == 'patch' || env.AITER_GIT_REF == '' }}
        run: |
          docker exec "${CONTAINER_NAME}" bash -lc '
            set -euo pipefail
            cd /workspace
            REPO_ROOT=/workspace bash .github/scripts/apply_aiter_scatter_reduce_bounds_patch.sh
          '

      - name: Prove scatter_reduce has max_sorted bound
        run: |
          docker exec "${CONTAINER_NAME}" bash -lc '
            set -euo pipefail
            python3 - <<'"'"'PY'"'"'
          from pathlib import Path
          import aiter
          src = Path(aiter.__file__).resolve().parent.parent / (
              "csrc/kernels/mxfp4_moe/moe_aux/moe_scatter_reduce.cuh"
          )
          text = src.read_text(encoding="utf-8", errors="replace")
          assert "sorted_pos >= max_sorted" in text, (
              f"unpatched scatter_reduce at {src}"
          )
          print(f"OK patched kernel: {src}")
          print(f"aiter={aiter.__file__}")
          PY
          '

      - name: Install ATOM editable
        run: |
          docker exec "${CONTAINER_NAME}" bash -lc '
            set -euo pipefail
            cd /workspace
            python -m pip install -e . --no-deps
            python -c "import atom, aiter; print(atom.__file__); print(aiter.__file__)"
          '

      - name: Run ATOM MiniMax-M3 scatter_reduce tests
        timeout-minutes: 45
        run: |
          docker exec "${CONTAINER_NAME}" bash -lc '
            set -euo pipefail
            cd /workspace
            export AITER_LOG_LEVEL=WARNING AMD_SERIALIZE_KERNEL=3
            python -m pytest -p no:cacheprovider -v -s \
              tests/test_minimax_m3_moe_scatter_reduce.py
          '

      - name: Run aiter op_tests scatter_reduce suite
        timeout-minutes: 45
        run: |
          docker exec "${CONTAINER_NAME}" bash -lc '
            set -euo pipefail
            cd /workspace
            export AITER_LOG_LEVEL=WARNING AMD_SERIALIZE_KERNEL=3
            # Prefer the test installed with the aiter ref; fall back to the
            # copy shipped under ATOM for the patch install path.
            if [[ -f /app/aiter-test/op_tests/test_moe_scatter_reduce.py ]]; then
              T=/app/aiter-test/op_tests/test_moe_scatter_reduce.py
            else
              T=/workspace/.github/patches/test_moe_scatter_reduce_aiter.py
            fi
            python -m pytest -p no:cacheprovider -v -s "$T"
          '

      - name: Tear down container
        if: always()
        run: |
          docker kill "${CONTAINER_NAME}" >/dev/null 2>&1 || true
          docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
