name: ATOM Benchmark
run-name: MegaMoE captured layer52 migration replay
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mega-eplb-${{ github.ref }}
  cancel-in-progress: false
jobs:
  replay:
    if: github.ref == 'refs/heads/codex/mega-eplb-regression'
    name: Captured EPLB traffic and GPU trace
    runs-on: linux-atom-pitt-mi350x-8
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Require an idle allocation
        id: idle
        run: |
          docker ps --format '{{.Names}}'
          test -z "$(docker ps -q)"
      - name: Start pinned current container
        id: setup
        if: ${{ !cancelled() && steps.idle.outcome == 'success' }}
        uses: ./.github/actions/setup-gpu-container
        with:
          container-name: atom-eplb-replay
          base-image: rocm/atom-dev@sha256:44ca53b6eec447b937403fbf884f4dcfaab2f0b889d28430d928dff1f805ea31
          runner: linux-atom-pitt-mi350x-8
          pull-policy: always
          network-host: 'true'
          env-vars: |
            AITER_LOG_LEVEL=WARNING
      - name: Replay three captured layouts and trace the slow layout once
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 15
        run: bash .github/scripts/run_eplb_replay.sh
      - name: Upload first-result evidence and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eplb-replay-evidence
          path: eplb-replay-evidence/
          if-no-files-found: warn
          retention-days: 15
      - name: Stop replay container
        if: ${{ always() && steps.setup.outcome != 'skipped' }}
        run: |
          docker stop --time 15 atom-eplb-replay || true
          docker rm atom-eplb-replay || true
