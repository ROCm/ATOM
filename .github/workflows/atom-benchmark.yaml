name: ATOM Benchmark
run-name: "PR ${{ inputs.pr }} prefill validation at ${{ inputs.head_sha }}"
on:
  workflow_dispatch:
    inputs:
      pr:
        type: choice
        options: ['3311', '3312']
        required: true
      head_sha:
        type: string
        required: true
      base_sha:
        type: string
        required: true
      execution:
        type: choice
        options: ['native', 'slurm']
        default: native
      scope:
        type: choice
        options: ['full', 'kimi-sparse']
        default: full
permissions:
  contents: read
concurrency:
  group: pr-prefill-validation-${{ inputs.pr }}
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ inputs.execution != 'slurm' }}
    runs-on: linux-atom-pitt-mi350x-8
    timeout-minutes: 240
    env:
      CONTAINER_NAME: atom-pr-review-${{ github.run_id }}
      AITER_GIT_REF: 0d894387bbbf43df30bdfcba928f483b94a906e2
      VALIDATION_SCOPE: ${{ inputs.scope || 'full' }}
      IMAGE: rocm/atom-dev@sha256:ad256a94209d2f58bfa6b0a69c555e0f8aab4fd8b76673c3532258803599099c
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: _review_harness
          persist-credentials: false
      - name: Start isolated GPU container
        uses: ./.github/actions/setup-gpu-container
        with:
          container-name: ${{ env.CONTAINER_NAME }}
          base-image: ${{ env.IMAGE }}
          runner: linux-atom-pitt-mi350x-8
          hf-token: ${{ secrets.AMD_HF_TOKEN }}
          env-vars: |
            AITER_LOG_LEVEL=WARNING
            PYTHONHASHSEED=0
            PYTHONNOUSERSITE=1
            ATOM_MONO_ENABLE=0
            ATOM_DCP_PREFILL_QREP=1
            ATOM_MLA_ABSORB_BF16=1
            AITER_CUSTOM_AR_DISABLE_LAMPORT=1
            AITER_REUSE_IDENTICAL_COMM_GROUPS=0
            ATOM_DUAL_STREAM_MOE_TOKEN_THRESHOLD=0
            ATOM_GDN_SSM_DTYPE=fp32
            ATOM_STATE_CHECKPOINT_DEMAND=0
            AITER_SITUV2_A4W4=1
            AITER_FLYDSL_USE_HERD=1
            AITER_FLYDSL_HERD_MIN_M=64
      - name: Install pinned AITER and evaluation runtime
        run: |
          set -euo pipefail
          bash .github/scripts/install_aiter_from_ref.sh
          docker exec "$CONTAINER_NAME" bash -lc 'SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ATOM=0.0.0+prreview pip install -e . && pip install "lm_eval[api]==0.4.13" pytest'
      - name: Run GPU regression suites, prefill benchmark and full GSM8K
        env:
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          mkdir -p review-evidence
          docker inspect --format '{{.Image}}' "$CONTAINER_NAME" > review-evidence/image-id.txt
          docker exec -e PR -e HEAD_SHA -e BASE_SHA -e AITER_GIT_REF -e VALIDATION_SCOPE "$CONTAINER_NAME" \
            python /workspace/_review_harness/.github/scripts/pr_prefill_validation.py
      - name: Stop this run's container
        if: always()
        run: |
          docker stop -t 30 "$CONTAINER_NAME" || true
          docker rm "$CONTAINER_NAME" || true
          mkdir -p review-evidence
          docker ps -a --filter "name=^${CONTAINER_NAME}$" --format '{{.Names}} {{.Status}}' > review-evidence/containers-after.txt
          test ! -s review-evidence/containers-after.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr-${{ inputs.pr }}-prefill-evidence
          path: review-evidence/
          retention-days: 14
  slurm:
    if: ${{ inputs.execution == 'slurm' }}
    runs-on: atomesh-cicd
    timeout-minutes: 360
    env:
      PR: ${{ inputs.pr }}
      HEAD_SHA: ${{ inputs.head_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
      VALIDATION_SCOPE: ${{ inputs.scope || 'full' }}
      AITER_GIT_REF: 0d894387bbbf43df30bdfcba928f483b94a906e2
      IMAGE: rocm/atom-dev@sha256:ad256a94209d2f58bfa6b0a69c555e0f8aab4fd8b76673c3532258803599099c
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: _review_harness
          persist-credentials: false
      - name: Submit and monitor native prefill validation on Slurm
        env:
          HF_TOKEN: ${{ secrets.AMD_HF_TOKEN }}
        run: bash _review_harness/.github/scripts/pr_prefill_slurm_submit.sh
      - name: Collect this Slurm job's evidence
        if: always()
        run: |
          set -euo pipefail
          if [[ -s review-evidence/shared-root.txt ]]; then
            shared=$(cat review-evidence/shared-root.txt)
            cp -R --no-preserve=mode,ownership,timestamps "$shared/logs/." review-evidence/ || true
            if [[ -d "$shared/source/review-evidence" ]]; then
              cp -R --no-preserve=mode,ownership,timestamps "$shared/source/review-evidence/." review-evidence/
            fi
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr-${{ inputs.pr }}-prefill-evidence
          path: review-evidence/
          retention-days: 14
