name: ATOM Benchmark
run-name: PR2877 Flash native vs fused (${{ github.actor }})

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Existing ATOM GPU runner; gfx950 is experimental on this branch"
        type: string
        default: atom-mi355-8gpu.predownload
      image:
        description: "Runtime image; resolved to one digest for every comparison job"
        type: string
        default: rocm/atom-dev:latest
      aiter_commit:
        description: "Pinned AITER revision matching PR2724's OPUS API"
        type: string
        default: cdd2259d79d87148e46909da5d328131d659323b

permissions:
  contents: read
  actions: read

concurrency:
  group: pr2877-flash-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kernels:
    name: Numerical equivalence and graph replay
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      image: ${{ steps.runtime.outputs.image }}
    env:
      CONTAINER_NAME: atom-pr2877-kernels
      AITER_GIT_REF: ${{ inputs.aiter_commit }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-gpu-container
        with:
          container-name: ${{ env.CONTAINER_NAME }}
          base-image: ${{ inputs.image }}
          runner: ${{ inputs.runner }}
          pull-policy: always
          network-host: "true"
          env-vars: |
            ATOM_PR2877_TEST_GFX950=1
            AITER_LOG_LEVEL=WARNING
      - name: Pin image and record GPU architecture
        id: runtime
        env:
          REQUESTED_IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' "$REQUESTED_IMAGE")
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Pinned runtime: $image; AITER: $AITER_GIT_REF; ATOM: $(git rev-parse HEAD)"
          docker exec "$CONTAINER_NAME" python3 -c 'import torch; p = torch.cuda.get_device_properties(0); print(p); assert p.gcnArchName.split(":")[0] in ("gfx950", "gfx1250")'
      - name: Install pinned AITER
        run: bash .github/scripts/install_aiter_from_ref.sh
      - name: Run exact sampler and model-entry tests
        run: |
          set -euo pipefail
          docker exec "$CONTAINER_NAME" python3 -m pip install pytest
          docker exec "$CONTAINER_NAME" python3 -m pytest -q \
            tests/model_ops/test_dspark_prob_markov_chain_metadata.py \
            tests/model_ops/test_dspark_prob_markov_chain.py \
            tests/model_ops/test_dspark_prob_sample.py \
            --junitxml=/workspace/pr2877-kernel-tests.xml
      - name: Upload kernel test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr2877-kernel-tests
          path: pr2877-kernel-tests.xml
          if-no-files-found: warn
      - name: Clean up
        if: always()
        run: docker rm -f "$CONTAINER_NAME" || true

  benchmark:
    name: ${{ matrix.mode }} ${{ matrix.workload.isl }}-1024 c${{ matrix.workload.conc }}
    needs: kernels
    strategy:
      fail-fast: false
      matrix:
        mode: [native, fused]
        include:
          - mode: native
            fused: '0'
          - mode: fused
            fused: '1'
        workload:
          - {isl: 1024, conc: 8}
          - {isl: 1024, conc: 32}
          - {isl: 8192, conc: 32}
    uses: ./.github/workflows/benchmark-tmpl.yml
    secrets: inherit
    with:
      display: DeepSeek-V4.1-Flash PR2877 ${{ matrix.mode }}
      prefix: deepseek-v41-flash
      suffix: -pr2877-${{ matrix.mode }}
      model_path: deepseek-ai/DeepSeek-V4.1-Flash
      server_args: --kv_cache_dtype fp8 --index_cache_dtype fp4 -tp 4 --method dspark --num-speculative-tokens 5 --max-num-seqs 32 --max-model-len 16384 --gpu-memory-utilization 0.9 --cudagraph-mode FULL
      bench_kind: random
      bench_args: --use-chat-template --num-prompts 512 --num-warmups 32
      env_vars: |
        AITER_LOG_LEVEL=WARNING
        ATOM_DSPARK_PROB_DRAFT=1
        ATOM_DSPARK_BLOCK_VERIFY=1
        ATOM_DSPARK_PROB_SHARDED=0
        ATOM_DSPARK_PROB_FUSED_CHAIN=${{ matrix.fused }}
        ATOM_PR2877_TEST_GFX950=1
        ATOM_DSV41_BENCHMARK_SYNTHETIC=0
      runner: ${{ inputs.runner }}
      isl: ${{ format('{0}', matrix.workload.isl) }}
      osl: '1024'
      ratio: '0.8'
      ratio_str: '0.8'
      concurrency: '[${{ matrix.workload.conc }}]'
      image: ${{ needs.kernels.outputs.image }}
      atom_commit: ${{ github.sha }}
      aiter_commit: ${{ inputs.aiter_commit }}

  accuracy:
    name: GSM8K 3-shot ${{ matrix.mode }}
    needs: kernels
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: native, fused: '0'}
          - {mode: fused, fused: '1'}
    env:
      CONTAINER_NAME: atom-pr2877-accuracy
      AITER_GIT_REF: ${{ inputs.aiter_commit }}
      MODEL_PATH: deepseek-ai/DeepSeek-V4.1-Flash
      SERVER_ARGS: --kv_cache_dtype fp8 --index_cache_dtype fp4 -tp 4 --method dspark --num-speculative-tokens 5 --max-num-seqs 32 --max-model-len 16384 --gpu-memory-utilization 0.9 --cudagraph-mode FULL
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/atom-bench-container
        with:
          image: ${{ needs.kernels.outputs.image }}
          container-name: ${{ env.CONTAINER_NAME }}
          model-path: ${{ env.MODEL_PATH }}
          runner: ${{ inputs.runner }}
          hf-token: ${{ secrets.AMD_HF_TOKEN }}
          env-vars: |
            AITER_LOG_LEVEL=WARNING
            ATOM_DSPARK_PROB_DRAFT=1
            ATOM_DSPARK_BLOCK_VERIFY=1
            ATOM_DSPARK_PROB_SHARDED=0
            ATOM_DSPARK_PROB_FUSED_CHAIN=${{ matrix.fused }}
            ATOM_PR2877_TEST_GFX950=1
            ATOM_DSV41_BENCHMARK_SYNTHETIC=0
      - name: Install pinned AITER
        run: bash .github/scripts/install_aiter_from_ref.sh
      - name: Launch server
        timeout-minutes: 45
        run: |
          set -euo pipefail
          if [ -n "${MODEL_HOST_ROOT:-}" ]; then model_path="/models/$MODEL_PATH"; else model_path="$MODEL_PATH"; fi
          echo ".github/scripts/atom_test.sh launch $model_path $SERVER_ARGS" | docker exec -i "$CONTAINER_NAME" bash -l
      - name: Run full GSM8K 3-shot
        timeout-minutes: 35
        run: docker exec -e ACCURACY_TIMEOUT_MINUTES=30 "$CONTAINER_NAME" bash .github/scripts/atom_test.sh accuracy "$MODEL_PATH"
      - name: Check existing Flash accuracy threshold
        run: |
          docker exec -i "$CONTAINER_NAME" python3 - <<'PY'
          import json
          from pathlib import Path
          files = list(Path("accuracy_test_results").rglob("*.json"))
          scored = [(p, json.loads(p.read_text())) for p in files]
          scored = [(p, d) for p, d in scored if "gsm8k" in d.get("results", {})]
          assert scored, "Missing GSM8K results"
          path, result = max(scored, key=lambda item: item[0].stat().st_mtime)
          score = result["results"]["gsm8k"]["exact_match,flexible-extract"]
          print(f"GSM8K flexible-extract: {score}; threshold: 0.91; result: {path}")
          assert score >= 0.91, f"GSM8K regression: {score} < 0.91"
          PY
      - name: Preserve accuracy and server logs
        if: always()
        run: |
          mkdir -p "pr2877-accuracy-${{ matrix.mode }}"
          docker cp "$CONTAINER_NAME:/workspace/accuracy_test_results" "pr2877-accuracy-${{ matrix.mode }}/" || true
          docker cp "$CONTAINER_NAME:/tmp/atom_server.log" "pr2877-accuracy-${{ matrix.mode }}/server.log" || true
          docker cp "$CONTAINER_NAME:/tmp/atom_client.log" "pr2877-accuracy-${{ matrix.mode }}/client.log" || true
      - name: Upload accuracy evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr2877-accuracy-${{ matrix.mode }}
          path: pr2877-accuracy-${{ matrix.mode }}/
      - name: Clean up
        if: always()
        run: docker rm -f "$CONTAINER_NAME" || true
