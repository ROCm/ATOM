name: Nightly Docker Release

on:
  schedule:
    - cron: '48 13 * * *'  # Every day at 21:48 Beijing Time (UTC+8)
  workflow_dispatch:
    inputs:
      build_rocm7:
        description: "Build the ROCm 7 line for manual runs (scheduled nightly runs always build every live line; default enabled)"
        type: boolean
        default: true
      build_rocm10:
        description: "Build the ROCm 10 line for manual runs (scheduled nightly runs always build every live line; default enabled)"
        type: boolean
        default: true
      base_image_override:
        description: "Build one literal base image instead of the lines above. Example: rocm/pytorch:latest. Publishes under a suffix read from the image."
        default: ""
      atom_repo:
        description: "ATOM repo"
        default: "https://github.com/ROCm/ATOM.git"
      atom_commit:
        description: "ATOM commit"
        default: "HEAD"
      aiter_repo:
        description: "Aiter repo"
        default: "https://github.com/ROCm/aiter.git"
      aiter_commit:
        description: "Aiter commit"
        default: "HEAD"
      rccl_repo:
        description: "RCCL repo"
        default: "https://github.com/ROCm/rccl.git"
      rccl_branch:
        description: "RCCL branch"
        default: "29e1567b95e28823b0beb1a988adc587bfab5b4f"
      sglang_repo:
        description: "SGLang repo"
        default: "https://github.com/sgl-project/sglang.git"
      sglang_ref:
        description: "SGLang git ref. Leave empty to use the workflow default."
        default: ""
      sglang_version:
        description: "SGLang version used in the published tag. Leave empty to use the workflow default."
        default: ""
      runner:
        description: "Runner label to use"
        type: choice
        default: "linux-atom-mi35x-1"
        options:
          - linux-atom-mi35x-1
          - build-only-atom
          - atom-mi355-8gpu.predownload
      skip_tests:
        description: "Skip test step"
        type: boolean
        default: false
      custom_tag:
        description: "Custom tag for the native Docker image (e.g. 'my-feature'). Produces rocm/atom-dev:<custom_tag>. When set, branch-based tagging and 'latest' update are skipped."
        default: ""
      build_oot_image:
        description: "Build OOT vLLM image for manual runs (scheduled nightly runs always build OOT; default enabled so manual releases also publish OOT)"
        type: boolean
        default: true
      oot_tag_suffix:
        description: "Optional suffix appended to the OOT vLLM nightly tag for manual runs. Example: custom -> rocm/atom-dev:vllm-v<version>-nightly_<date>-custom. When set, vllm-latest is not updated."
        default: ""
      build_sglang_image:
        description: "Build SGLang+ATOM image for manual runs (scheduled nightly runs always build SGLang+ATOM; default enabled so manual releases also publish SGLang+ATOM)"
        type: boolean
        default: true
      sglang_tag_suffix:
        description: "Optional suffix appended to the SGLang nightly tag for manual runs. Example: custom -> rocm/atom-dev:sglang-v<version>-nightly_<date>-custom. When set, sglang-latest is not updated."
        default: ""
      only_release_oot:
        description: "Release the OOT vLLM image (skips native image test/push). If both this and SGLang are checked, both will be released."
        type: boolean
        default: false
      only_release_sglang:
        description: "Release the SGLang+ATOM image (skips native image test/push). If both this and OOT are checked, both will be released."
        type: boolean
        default: false

# The live lines, defined once for the whole workflow. LINE_STABLE owns the
# unsuffixed tags (latest, nightly_<ts>, vllm-latest, sglang-latest);
# LINE_NEXT publishes the same set suffixed with the ROCm version read out of
# its image. Promoting ROCm 10 is these two values and nothing else: `latest`
# follows, and the line that used to be stable simply stops being built.
env:
  LINE_STABLE: rocm7
  LINE_NEXT: rocm10

jobs:
  # Which lines this run builds. A separate job because `strategy.matrix` is
  # evaluated before any step runs, so the list has to arrive as a `needs`
  # output rather than be computed inside the build job.
  plan:
    name: Resolve which lines to build
    runs-on: ubuntu-latest
    outputs:
      lines: ${{ steps.lines.outputs.lines }}
    steps:
      - name: Resolve lines
        id: lines
        run: |
          set -euo pipefail
          OVERRIDE="${{ inputs.base_image_override || '' }}"
          if [ -n "${OVERRIDE}" ]; then
            # A one-off build on a literal image reference, nothing else.
            printf 'lines=["%s"]\n' "${OVERRIDE}" >> "${GITHUB_OUTPUT}"
            echo "Lines: ${OVERRIDE} (base_image_override)"
            exit 0
          fi

          lines=""
          add() { lines="${lines:+${lines},}\"$1\""; }

          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Like the OOT and SGLang layers, a scheduled run builds every
            # live line regardless of the toggles; the toggles exist so a
            # manual run can build one line without the other.
            add "${LINE_STABLE}"
            add "${LINE_NEXT}"
          else
            if [ "${{ inputs.build_rocm7 }}" = "true" ]; then add rocm7; fi
            if [ "${{ inputs.build_rocm10 }}" = "true" ]; then add rocm10; fi
          fi

          if [ -z "${lines}" ]; then
            echo "No line selected: enable at least one of build_rocm7 / build_rocm10, or set base_image_override."
            exit 1
          fi
          echo "lines=[${lines}]" >> "${GITHUB_OUTPUT}"
          echo "Lines: [${lines}]"

  docker-release:
    name: Nightly Docker Release
    needs: plan
    runs-on: ${{ inputs.runner || 'linux-atom-mi35x-1' }}
    strategy:
      fail-fast: false
      matrix:
        base_image: ${{ fromJSON(needs.plan.outputs.lines) }}

    env:
      ATOM_REPO: "https://github.com/ROCm/ATOM.git"
      ATOM_COMMIT: "HEAD"
      AITER_REPO: "https://github.com/ROCm/aiter.git"
      AITER_COMMIT: "HEAD"
      RCCL_REPO: "https://github.com/ROCm/rccl.git"
      RCCL_BRANCH: "29e1567b95e28823b0beb1a988adc587bfab5b4f"
      GPU_ARCH: "gfx942;gfx950"
      SGLANG_REPO: "https://github.com/sgl-project/sglang.git"
      SGLANG_REF: "v0.5.17"
      SGLANG_VERSION: "0.5.17"

    steps:
      - name: Set HF_TOKEN
        run: echo "HF_TOKEN=${HF_TOKEN:-${{ secrets.AMD_HF_TOKEN }}}" >> $GITHUB_ENV

      - name: Checkout ATOM repo
        uses: actions/checkout@v6

      - name: Load vLLM version
        run: cat atom/plugin/vllm/vllm-version.env >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: ./.github/actions/docker-auth
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute push gates
        # Single source of truth for which images get pushed. The build,
        # re-login, and push steps below all read these outputs instead of each
        # duplicating the same long boolean, so the conditions can't drift.
        id: gates
        run: |
          set -euo pipefail
          {
            echo "main=${{ inputs.only_release_oot != true && inputs.only_release_sglang != true }}"
            echo "oot=${{ inputs.only_release_oot == true || (inputs.only_release_sglang != true && (github.event_name == 'schedule' || inputs.build_oot_image == true)) }}"
            echo "sglang=${{ inputs.only_release_sglang == true || (inputs.only_release_oot != true && (github.event_name == 'schedule' || inputs.build_sglang_image == true)) }}"
          } >> "$GITHUB_OUTPUT"

      - name: Echo environment variables
        run: |
          echo "ATOM_REPO: ${{ inputs.atom_repo || env.ATOM_REPO }}"
          echo "ATOM_BRANCH: ${{ github.ref_name }}"
          echo "ATOM_COMMIT: ${{ inputs.atom_commit || env.ATOM_COMMIT }}"
          echo "AITER_REPO: ${{ inputs.aiter_repo || env.AITER_REPO }}"
          echo "AITER_COMMIT: ${{ inputs.aiter_commit || env.AITER_COMMIT }}"
          echo "RCCL_REPO: ${{ inputs.rccl_repo || env.RCCL_REPO }}"
          echo "RCCL_BRANCH: ${{ inputs.rccl_branch || env.RCCL_BRANCH }}"
          echo "OOT_TAG_SUFFIX: ${{ inputs.oot_tag_suffix || '' }}"
          echo "SGLANG_TAG_SUFFIX: ${{ inputs.sglang_tag_suffix || '' }}"
          echo "CUSTOM_TAG: ${{ inputs.custom_tag || '' }}"
          echo "SGLANG_REPO: ${{ inputs.sglang_repo || env.SGLANG_REPO }}"
          echo "SGLANG_REF: ${{ inputs.sglang_ref || env.SGLANG_REF }}"
          echo "SGLANG_VERSION: ${{ inputs.sglang_version || env.SGLANG_VERSION }}"
          echo "SGLANG_TAG_SUFFIX: ${{ inputs.sglang_tag_suffix || '' }}"
          echo "BASE_IMAGE_FLAVOR: ${{ matrix.base_image }}"

      # One place that turns a line name into everything the rest of the job
      # needs: which base image to build on, which extra build-args that line
      # wants, and whether it publishes at all. Before this, each of those
      # lived as its own `if [ "${{ matrix.base_image }}" = "rocm10" ]` inside
      # a push step -- which is how the vLLM push came to have none, and
      # published ROCm 10 images over the ROCm 7 `vllm-latest` tag.
      - name: Resolve flavor
        id: flavor
        run: |
          set -euo pipefail
          FLAVOR="${{ matrix.base_image }}"
          EXTRA_BUILD_ARGS=""

          case "${FLAVOR}" in
            rocm7)
              BASE_IMAGE="rocm/pytorch:rocm7.2.4_ubuntu24.04_py3.12_pytorch_release_2.10.0"
              ;;
            rocm7-py310)
              BASE_IMAGE="rocm/pytorch:rocm7.2.4_ubuntu22.04_py3.10_pytorch_release_2.10.0"
              ;;
            rocm7-latest)
              BASE_IMAGE="rocm/pytorch:latest"
              ;;
            rocm10)
              # rocm10-base is a stage inside atom_release.dockerfile, not an
              # image to pull: the ROCm 10 stack is assembled from the AMD
              # stable wheel channel on plain ubuntu:24.04.
              BASE_IMAGE="rocm10-base"
              ;;
            */*|*:*)
              # A literal image reference, for a one-off build on something
              # that has no line name.
              BASE_IMAGE="${FLAVOR}"
              ;;
            *)
              echo "Unknown base_image flavor '${FLAVOR}'."
              exit 1
              ;;
          esac

          echo "flavor=${FLAVOR} base_image=${BASE_IMAGE}"
          {
            echo "FLAVOR=${FLAVOR}"
            echo "BASE_IMAGE=${BASE_IMAGE}"
            echo "EXTRA_BUILD_ARGS<<EOF_ARGS"
            echo "${EXTRA_BUILD_ARGS}"
            echo "EOF_ARGS"
          } >> "${GITHUB_ENV}"

      - name: Build Docker image
        timeout-minutes: 180
        run: |
          ATOM_COMMIT="${{ inputs.atom_commit || env.ATOM_COMMIT }}"
          if [ "${ATOM_COMMIT}" = "HEAD" ]; then
            ATOM_CHECKOUT="${{ github.ref_name }}"
          else
            ATOM_CHECKOUT="${ATOM_COMMIT}"
          fi
          echo "ATOM checkout ref: ${ATOM_CHECKOUT} (branch: ${{ github.ref_name }})"
          echo "Building flavor ${FLAVOR} on BASE_IMAGE ${BASE_IMAGE}"
          DOCKER_BUILDKIT=1 docker build --pull --network=host -t atom_release:ci \
          --build-arg BASE_IMAGE="${BASE_IMAGE}" \
          --build-arg GPU_ARCH="${{ env.GPU_ARCH }}" \
          --build-arg ATOM_REPO="${{ inputs.atom_repo || env.ATOM_REPO }}" \
          --build-arg ATOM_COMMIT="${ATOM_CHECKOUT}" \
          --build-arg AITER_REPO="${{ inputs.aiter_repo || env.AITER_REPO }}" \
          --build-arg AITER_COMMIT="${{ inputs.aiter_commit || env.AITER_COMMIT }}" \
          --build-arg RCCL_REPO="${{ inputs.rccl_repo || env.RCCL_REPO }}" \
          --build-arg RCCL_BRANCH="${{ inputs.rccl_branch || env.RCCL_BRANCH }}" \
          ${EXTRA_BUILD_ARGS} \
          --build-arg CACHEBUST=$(date +%s) \
          -f docker/atom_release.dockerfile .
          docker inspect atom_release:ci

      # The tag suffix comes out of the image, not out of the line's nickname.
      # A nickname says what we called the line ("rocm10"); the image knows
      # which ROCm it actually carries (10.0.0 vs 10.1.0), and that is what a
      # puller needs the tag to tell them. It also keeps the spelling the same
      # as torch's and the SDK's (rocm10.0).
      - name: Resolve tag suffix
        run: |
          set -euo pipefail
          if [ "${FLAVOR}" = "${LINE_STABLE}" ]; then
            # The stable line owns the unsuffixed tags: latest, nightly_<ts>,
            # vllm-latest, sglang-latest.
            TAG_SUFFIX=""
            echo "Stable line (${FLAVOR}): publishing unsuffixed tags"
          else
            ROCM_VER=$(docker run --rm --entrypoint="" atom_release:ci \
              bash -lc 'cat /opt/rocm/.info/version 2>/dev/null \
                || python3 -c "import torch; print(torch.version.hip or \"\")"' \
              | tr -d '[:space:]')
            if [ -z "${ROCM_VER}" ]; then
              echo "ERROR: could not read a ROCm version out of the image; refusing to publish an unlabelled tag"
              exit 1
            fi
            TAG_SUFFIX="-rocm$(echo "${ROCM_VER}" | cut -d. -f1,2)"
            echo "Line ${FLAVOR} carries ROCm ${ROCM_VER}; tag suffix ${TAG_SUFFIX}"
          fi
          echo "TAG_SUFFIX=${TAG_SUFFIX}" >> "${GITHUB_ENV}"

      - name: Test Docker image
        if: ${{ success() && steps.gates.outputs.main == 'true' && inputs.skip_tests != true }}
        timeout-minutes: 60
        run: |
          echo "Clean up containers..."
          docker ps -aq -f name=atom_release_ci | xargs -r docker stop | xargs -r docker rm
              
          if [ -f "/etc/podinfo/gha-render-devices" ]; then
            DEVICE_FLAG=$(cat /etc/podinfo/gha-render-devices)
          else
            DEVICE_FLAG="--device /dev/dri"
          fi
              
          echo "Starting container: atom_release_ci (image: atom_release:ci)"
          docker run -dt --device=/dev/kfd $DEVICE_FLAG \
            -v "${GITHUB_WORKSPACE:-$PWD}":/workspace \
            --ipc=host --group-add video \
            --shm-size 16g \
            --cap-add=SYS_PTRACE \
            -e HF_TOKEN="${HF_TOKEN:-}" \
            --security-opt seccomp=unconfined \
            --ulimit memlock=-1 \
            --ulimit stack=67108864 \
            --name atom_release_ci \
            atom_release:ci
              
          docker exec atom_release_ci bash -c \
            "rm -f ~/.cache/huggingface/token ~/.cache/huggingface/stored_tokens 2>/dev/null; \
             python3 -m atom.examples.simple_inference \
               --model meta-llama/Meta-Llama-3-8B-Instruct \
               --temperature 0 | grep -E '^Prompt: |^Completion:'" > atom_release_output.txt
          
          echo ""
          echo "========== Showing release output below =========="
          cat atom_release_output.txt

          echo ""
          echo "========== Comparing output with golden outputs =========="
          # Ignore whitespace and EOL differences in the diff
          if diff -u -B -w --strip-trailing-cr atom_release_output.txt .github/workflows/golden_outputs.txt; then
            echo "Output matches golden outputs."
          else
            echo "Output does not match golden outputs."
            exit 1
          fi

      - name: Re-login to Docker Hub before push
        # The initial login happens before a ~1h image build, so its auth token
        # is stale by the time this push finalizes (multi-GB push of a large
        # image), causing "unauthorized: authentication required" on the manifest
        # PUT. Re-authenticate immediately before pushing to get a fresh token.
        if: ${{ success() && steps.gates.outputs.main == 'true' }}
        uses: ./.github/actions/docker-auth
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        if: ${{ success() && steps.gates.outputs.main == 'true' }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          FLAVOR_SUFFIX="${TAG_SUFFIX}"
          CUSTOM_TAG="${{ inputs.custom_tag || '' }}"
          if [ -n "${CUSTOM_TAG}" ]; then
            if [[ ! "${CUSTOM_TAG}" =~ ^[A-Za-z0-9_.-]+$ ]]; then
              echo "Invalid custom_tag '${CUSTOM_TAG}'. Allowed characters: letters, numbers, '.', '_' and '-'."
              exit 1
            fi
            docker tag atom_release:ci rocm/atom-dev:${CUSTOM_TAG}
            .github/scripts/docker_push_retry.sh rocm/atom-dev:${CUSTOM_TAG}
            echo "Custom tag: rocm/atom-dev:${CUSTOM_TAG}. Skipping latest update."
          else
            BRANCH="${{ github.ref_name }}"
            DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
            TAG=nightly_$(date +%Y%m%d%H%M)${FLAVOR_SUFFIX}
            if [ "${BRANCH}" != "${DEFAULT_BRANCH}" ]; then
              SAFE_BRANCH=$(echo "${BRANCH}" | sed 's/[^A-Za-z0-9._-]/-/g')
              TAG="${TAG}-${SAFE_BRANCH}"
              docker tag atom_release:ci rocm/atom-dev:${TAG}
              .github/scripts/docker_push_retry.sh rocm/atom-dev:${TAG}
              echo "Branch '${BRANCH}'; tag: rocm/atom-dev:${TAG}. Skipping latest update."
            else
              if [ -n "${FLAVOR_SUFFIX}" ]; then
                docker tag atom_release:ci rocm/atom-dev:${TAG}
                docker tag atom_release:ci rocm/atom-dev:latest${FLAVOR_SUFFIX}
                .github/scripts/docker_push_retry.sh rocm/atom-dev:${TAG} rocm/atom-dev:latest${FLAVOR_SUFFIX}
                echo "${FLAVOR}: tags rocm/atom-dev:${TAG} and rocm/atom-dev:latest${FLAVOR_SUFFIX}. Leaving latest to ${LINE_STABLE}."
              else
                docker tag atom_release:ci rocm/atom-dev:latest
                docker tag atom_release:ci rocm/atom-dev:${TAG}
                .github/scripts/docker_push_retry.sh rocm/atom-dev:latest rocm/atom-dev:${TAG}
              fi
            fi
          fi

      - name: Build OOT Docker image
        id: build_oot
        if: ${{ success() && steps.gates.outputs.oot == 'true' }}
        continue-on-error: true
        timeout-minutes: 180
        run: |
          # The vLLM and SGLang layers belong to the stable line only. They
          # are owned and tagged by someone else, so a second line must not
          # build them, and above all must not publish over their tags -- the
          # ROCm 10 line would otherwise have replaced vllm-latest and the
          # day's vllm-v<ver>-nightly_<date> with a ROCm 10 image.
          if [ "${FLAVOR}" != "${LINE_STABLE}" ]; then
            echo "${FLAVOR} is not the stable line: skipping the OOT vLLM layer (owned by the ROCm 7 line)."
            exit 0
          fi
          OOT_BASE_IMAGE="atom_release:ci"
          echo "Using OOT base image: ${OOT_BASE_IMAGE}"
          docker build --network=host -t atom_oot_release:ci \
            --build-arg OOT_BASE_IMAGE="${OOT_BASE_IMAGE}" \
            --build-arg MAX_JOBS=64 \
            --build-arg VLLM_COMMIT="${VLLM_COMMIT}" \
            --build-arg INSTALL_LM_EVAL=1 \
            --build-arg INSTALL_FASTSAFETENSORS=1 \
            -f docker/vllm_release.dockerfile .
          docker inspect atom_oot_release:ci

      - name: Re-login to Docker Hub before OOT push
        id: login_oot
        # Fresh token before this push: the OOT build above adds even more time
        # since the initial login, so the auth token is stale by push time.
        if: ${{ steps.build_oot.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/docker-auth
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push OOT Docker image
        id: push_oot
        if: ${{ steps.login_oot.outcome == 'success' }}
        continue-on-error: true
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          # The vLLM and SGLang layers belong to the stable line only. They
          # are owned and tagged by someone else, so a second line must not
          # build them, and above all must not publish over their tags -- the
          # ROCm 10 line would otherwise have replaced vllm-latest and the
          # day's vllm-v<ver>-nightly_<date> with a ROCm 10 image.
          if [ "${FLAVOR}" != "${LINE_STABLE}" ]; then
            echo "${FLAVOR} is not the stable line: skipping the OOT vLLM push layer (owned by the ROCm 7 line)."
            exit 0
          fi
          VLLM_VER="${VLLM_VERSION}"
          OOT_TAG_SUFFIX="${{ inputs.oot_tag_suffix || '' }}"
          OOT_TAG="vllm-v${VLLM_VER}-nightly_$(date +%Y%m%d)"
          OOT_LATEST_TAG="vllm-latest"
          if [ -n "${OOT_TAG_SUFFIX}" ]; then
            if [[ ! "${OOT_TAG_SUFFIX}" =~ ^[A-Za-z0-9_.-]+$ ]]; then
              echo "Invalid oot_tag_suffix '${OOT_TAG_SUFFIX}'. Allowed characters: letters, numbers, '.', '_' and '-'."
              exit 1
            fi
            OOT_TAG="${OOT_TAG}-${OOT_TAG_SUFFIX}"
          fi
          docker tag atom_oot_release:ci rocm/atom-dev:${OOT_TAG}
          .github/scripts/docker_push_retry.sh rocm/atom-dev:${OOT_TAG}
          if [ -z "${OOT_TAG_SUFFIX}" ]; then
            docker tag atom_oot_release:ci rocm/atom-dev:${OOT_LATEST_TAG}
            .github/scripts/docker_push_retry.sh rocm/atom-dev:${OOT_LATEST_TAG}
          else
            echo "Custom OOT tag suffix '${OOT_TAG_SUFFIX}' provided; skipping rocm/atom-dev:${OOT_LATEST_TAG} update."
          fi

      - name: Build SGLang Docker image
        if: ${{ success() && steps.gates.outputs.sglang == 'true' }}
        timeout-minutes: 180
        run: |
          # The vLLM and SGLang layers belong to the stable line only. They
          # are owned and tagged by someone else, so a second line must not
          # build them, and above all must not publish over their tags -- the
          # ROCm 10 line would otherwise have replaced vllm-latest and the
          # day's vllm-v<ver>-nightly_<date> with a ROCm 10 image.
          if [ "${FLAVOR}" != "${LINE_STABLE}" ]; then
            echo "${FLAVOR} is not the stable line: skipping the SGLang layer (owned by the ROCm 7 line)."
            exit 0
          fi
          SGLANG_BASE_IMAGE="atom_release:ci"
          echo "Using SGLang+ATOM base image: ${SGLANG_BASE_IMAGE}"
          docker build --network=host -t atom_sglang_release:ci \
            --build-arg SGLANG_BASE_IMAGE="${SGLANG_BASE_IMAGE}" \
            --build-arg GPU_ARCH="${{ env.GPU_ARCH }}" \
            --build-arg SGLANG_REPO="${{ inputs.sglang_repo || env.SGLANG_REPO }}" \
            --build-arg SGLANG_REF="${{ inputs.sglang_ref || env.SGLANG_REF }}" \
            -f docker/sglang_release.dockerfile .
          docker inspect atom_sglang_release:ci

      - name: Re-login to Docker Hub before SGLang push
        # Fresh token before this push: the SGLang build above adds even more
        # time since the initial login, so the auth token is stale by push time.
        if: ${{ success() && steps.gates.outputs.sglang == 'true' }}
        uses: ./.github/actions/docker-auth
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push SGLang+ATOM Docker image
        if: ${{ success() && steps.gates.outputs.sglang == 'true' }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          # The vLLM and SGLang layers belong to the stable line only. They
          # are owned and tagged by someone else, so a second line must not
          # build them, and above all must not publish over their tags -- the
          # ROCm 10 line would otherwise have replaced vllm-latest and the
          # day's vllm-v<ver>-nightly_<date> with a ROCm 10 image.
          if [ "${FLAVOR}" != "${LINE_STABLE}" ]; then
            echo "${FLAVOR} is not the stable line: skipping the SGLang push layer (owned by the ROCm 7 line)."
            exit 0
          fi
          SGLANG_VER="${{ inputs.sglang_version || env.SGLANG_VERSION }}"
          SGLANG_TAG_SUFFIX="${{ inputs.sglang_tag_suffix || '' }}"
          SGLANG_TAG="sglang-v${SGLANG_VER}-nightly_$(date +%Y%m%d)"
          SGLANG_LATEST_TAG="sglang-latest"
          if [ -n "${SGLANG_TAG_SUFFIX}" ]; then
            if [[ ! "${SGLANG_TAG_SUFFIX}" =~ ^[A-Za-z0-9_.-]+$ ]]; then
              echo "Invalid sglang_tag_suffix '${SGLANG_TAG_SUFFIX}'. Allowed characters: letters, numbers, '.', '_' and '-'."
              exit 1
            fi
            SGLANG_TAG="${SGLANG_TAG}-${SGLANG_TAG_SUFFIX}"
          fi
          docker tag atom_sglang_release:ci rocm/atom-dev:${SGLANG_TAG}
          .github/scripts/docker_push_retry.sh rocm/atom-dev:${SGLANG_TAG}
          if [ -z "${SGLANG_TAG_SUFFIX}" ]; then
            docker tag atom_sglang_release:ci rocm/atom-dev:${SGLANG_LATEST_TAG}
            .github/scripts/docker_push_retry.sh rocm/atom-dev:${SGLANG_LATEST_TAG}
          else
            echo "Custom SGLang tag suffix '${SGLANG_TAG_SUFFIX}' provided; skipping rocm/atom-dev:${SGLANG_LATEST_TAG} update."
          fi

      - name: Fail if OOT Docker image failed
        if: ${{ always() && steps.gates.outputs.oot == 'true' && (steps.build_oot.outcome == 'failure' || steps.login_oot.outcome == 'failure' || steps.push_oot.outcome == 'failure') }}
        run: |
          echo "OOT vLLM Docker image failed; SGLang steps were allowed to run first."
          exit 1

      - name: Clean Up
        if: always()
        run: |
          docker stop atom_release_ci || true
          docker rm atom_release_ci || true
          # Remove build and tagged images to free disk space
          docker rmi atom_release:ci || true
          # latest, latest-rocm10.0, sglang-latest-rocm10.0, ... -- the
          # suffixed rolling tags were left on disk by the old cleanup.
          docker images "rocm/atom-dev:latest*" -q | xargs -r docker rmi || true
          docker images "rocm/atom-dev:*-latest*" -q | xargs -r docker rmi || true
          docker rmi atom_oot_release:ci || true
          docker rmi atom_sglang_release:ci || true
          # Remove nightly tagged image if it exists
          docker images "rocm/atom-dev:nightly_*" -q | xargs -r docker rmi || true
          docker images "rocm/atom-dev:vllm-v*-nightly_*" -q | xargs -r docker rmi || true
          docker images "rocm/atom-dev:sglang-v*-nightly_*" -q | xargs -r docker rmi || true
          docker rmi rocm/atom-dev:vllm-latest || true
          docker rmi rocm/atom-dev:sglang-latest || true
