name: GPU Load Test

# Throwaway branch content: this file is repurposed as a checkpoint-read probe
# so it can be dispatched against a branch (workflow_dispatch needs the file to
# exist on main). Not meant to be merged.

on:
  workflow_dispatch:
    inputs:
      runners:
        description: 'Runner label'
        type: string
        default: 'linux-atom-do-mi350x-8'
      image:
        description: 'Docker image'
        type: string
        default: 'rocm/atom-dev:latest'

jobs:
  ckpt-read-probe:
    name: Checkpoint read probe (${{ inputs.runners }})
    runs-on: ${{ inputs.runners }}
    timeout-minutes: 240
    env:
      CONTAINER_NAME: ckpt_read_probe
      MODEL_PATH: /models/deepseek-ai/DeepSeek-R1-0528
    steps:
      - name: Kill all Docker containers
        run: |
          containers=$(docker ps -q)
          if [ -n "$containers" ]; then
            docker kill $containers || true
          fi
          docker run --rm -v "${GITHUB_WORKSPACE:-$PWD}":/workspace -w /workspace rocm/atom-dev:latest bash -lc "find /workspace -mindepth 1 -delete" || true

      - name: Checkout ATOM repo
        uses: actions/checkout@v6

      - name: Start CI container
        uses: ./.github/actions/setup-gpu-container
        with:
          container-name: ${{ env.CONTAINER_NAME }}
          base-image: ${{ inputs.image }}
          runner: ${{ inputs.runners }}
          network-host: "true"
          disable-mmap: "false"

      - name: Host storage and memory
        run: |
          echo "MODEL_HOST_ROOT=${MODEL_HOST_ROOT:-}"
          df -hT "${MODEL_HOST_ROOT:-/}" || true
          grep -E " (nfs|nfs4|cifs|lustre|fuse[^ ]*|ceph) " /proc/mounts || true
          free -g
          nproc
          echo "runner cgroup memory.max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null) current=$(cat /sys/fs/cgroup/memory.current 2>/dev/null)"
          docker info --format 'docker root={{.DockerRootDir}} cgroup={{.CgroupVersion}} mem={{.MemTotal}}' || true

      - name: Install ATOM
        run: |
          docker exec "$CONTAINER_NAME" bash -lc "
            set -euo pipefail
            cd /workspace
            git config --global --add safe.directory /workspace
            pip install -e .
            test -f $MODEL_PATH/config.json
          "

      # One step per measurement: a step's log is kept once it completes, so a
      # runner lost mid-probe still leaves everything before it readable.
      - name: Probe info
        run: docker exec "$CONTAINER_NAME" python3 .github/scripts/probe_checkpoint_read.py info "$MODEL_PATH"

      - name: Probe sweep
        timeout-minutes: 60
        run: docker exec "$CONTAINER_NAME" python3 .github/scripts/probe_checkpoint_read.py sweep "$MODEL_PATH"

      - name: Upload sweep
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ckpt-read-probe-sweep-${{ github.run_id }}
          path: probe_results/

      - name: Load mmap_prefetch (1)
        if: always()
        timeout-minutes: 50
        run: docker exec "$CONTAINER_NAME" python3 .github/scripts/probe_checkpoint_read.py load "$MODEL_PATH" --config mmap_prefetch --tag 1

      - name: Load disable_mmap
        if: always()
        timeout-minutes: 50
        run: docker exec "$CONTAINER_NAME" python3 .github/scripts/probe_checkpoint_read.py load "$MODEL_PATH" --config disable_mmap

      - name: Load mmap_prefetch (2)
        if: always()
        timeout-minutes: 50
        run: docker exec "$CONTAINER_NAME" python3 .github/scripts/probe_checkpoint_read.py load "$MODEL_PATH" --config mmap_prefetch --tag 2

      - name: Load mmap_prefetch_best
        if: always()
        timeout-minutes: 50
        run: docker exec "$CONTAINER_NAME" python3 .github/scripts/probe_checkpoint_read.py load "$MODEL_PATH" --config mmap_prefetch_best

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ckpt-read-probe-${{ github.run_id }}
          path: probe_results/

      - name: Clean up
        if: always()
        run: |
          docker stop "$CONTAINER_NAME" || true
          docker rm "$CONTAINER_NAME" || true
