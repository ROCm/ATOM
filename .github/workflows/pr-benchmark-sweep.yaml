name: ATOM PR Benchmark Sweep
run-name: "${{ github.event.pull_request.number && format('PR #{0} sweep', github.event.pull_request.number) || 'Manual recipe sweep' }}"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/benchmark/sweeps/*.yaml'
  workflow_dispatch:
    inputs:
      sweep:
        description: 'Path to one .github/benchmark/sweeps/*.yaml configuration'
        type: string
        required: true

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: atom-pr-sweep-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, inputs.sweep) }}
  cancel-in-progress: true

jobs:
  plan:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.select.outputs.head_sha }}
      groups_json: ${{ steps.plan.outputs.groups_json }}
      model_root: ${{ steps.plan.outputs.model_root }}
      hardware: ${{ steps.plan.outputs.hardware }}
      plan_artifact: ${{ steps.plan.outputs.plan_artifact }}
    steps:
      - name: Select the PR's sweep configuration
        id: select
        uses: actions/github-script@v7
        env:
          MANUAL_SWEEP: ${{ inputs.sweep }}
        with:
          script: |
            const validPath = /^\.github\/benchmark\/sweeps\/[a-zA-Z0-9_-]+\.yaml$/;
            const pr = context.payload.pull_request;
            let path = process.env.MANUAL_SWEEP;
            if (pr) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo, pull_number: pr.number, per_page: 100
              });
              const configs = files.filter(file => file.status !== 'removed' && validPath.test(file.filename));
              if (configs.length !== 1) throw new Error('A sweep PR must add or modify exactly one sweep configuration.');
              path = configs[0].filename;
            }
            if (!validPath.test(path || '')) throw new Error('Expected .github/benchmark/sweeps/NAME.yaml');
            core.setOutput('path', path);
            core.setOutput('head_sha', pr ? pr.head.sha : context.sha);
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.select.outputs.head_sha }}
          persist-credentials: false
      - name: Install YAML parser
        run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Expand and validate the sweep
        id: plan
        env:
          SWEEP_PATH: ${{ steps.select.outputs.path }}
          SWEEP_HEAD_SHA: ${{ steps.select.outputs.head_sha }}
          SWEEP_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/atomesh/pr_sweep.py plan "$SWEEP_PATH"
      - name: Save the exact plan
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.plan.outputs.plan_artifact }}
          path: sweep-plan.json
          if-no-files-found: error

  sweep:
    needs: plan
    name: ${{ matrix.group.name }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: ${{ fromJson(needs.plan.outputs.groups_json) }}
    uses: ./.github/workflows/atomesh-benchmark-tmpl.yaml
    with:
      matrix_json: ${{ matrix.group.matrix_json }}
      atom_source: mounted
      checkout_ref: ${{ needs.plan.outputs.head_sha }}
      model_root: ${{ needs.plan.outputs.model_root }}
      dashboard_hardware: ${{ needs.plan.outputs.hardware }}

  collect:
    needs: [plan, sweep]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.plan.outputs.plan_artifact }}
      - uses: actions/download-artifact@v8
        with:
          pattern: atomesh-model-benchmark-*
          merge-multiple: false
          path: sweep-results
      - name: Read point job outcomes across attempts
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: context.runId, filter: 'all', per_page: 100
            });
            const points = jobs.filter(job => job.name.split(' / ').at(-1).startsWith('sweep-point:'));
            require('fs').writeFileSync('sweep-jobs.json', JSON.stringify(points.map(job => ({
              name: job.name, run_attempt: job.run_attempt,
              status: job.status, conclusion: job.conclusion
            }))));
      - name: Collect this run's measured points
        id: collect
        env:
          SWEEP_BENCHMARK_RESULT: ${{ needs.sweep.result }}
        run: python3 .github/scripts/atomesh/pr_sweep.py collect sweep-results
      - name: Upload sweep curve and provenance
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: results_bmk-attempt-${{ github.run_attempt }}
          path: |
            agg_bmk.json
            sweep_manifest.json
            sweep-jobs.json
          if-no-files-found: error
      - name: Link curve artifact
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: printf '\n[Download sweep curve](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Require every planned point
        if: ${{ steps.collect.outputs.complete != 'true' }}
        run: |
          echo '::error::Sweep is partial; see sweep_manifest.json for missing points. No results from other runs were substituted.'
          exit 1
