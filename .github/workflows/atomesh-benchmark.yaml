name: PR2425 benchmark log recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    name: Read existing PR2425 C32 and C48 logs
    runs-on: atomesh-cicd
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Read the two existing Slurm jobs
        shell: bash
        env:
          SLURM_ACCOUNT: amd-atom
        run: |
          set -euo pipefail
          export PATH="/usr/local/slurm-24.05.5.1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH:-}"
          output="${RUNNER_TEMP}/pr2425-recovered-logs"
          mkdir -p "${output}"
          source .github/scripts/slurm_submit_helpers.sh
          detect_slurm_backend
          for job_id in 10051 10052; do
            {
              echo "job=${job_id}"
              echo "controller:"
              query_slurm_controller_job "${job_id}" || true
              echo "accounting:"
              query_slurm_accounting_job "${job_id}" || true
            } > "${output}/slurm-${job_id}-state.txt" 2>&1
          done
          python3 .github/scripts/atomesh/collect_pr2425_benchmark_logs.py --output "${output}"
      - name: Upload the recovered logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr2425-c32-c48-recovered-logs
          path: ${{ runner.temp }}/pr2425-recovered-logs
          retention-days: 7
          if-no-files-found: error
