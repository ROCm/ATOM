name: K3 IPC and collective lifetime probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipc-probe:
    runs-on: atomesh-cicd
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - name: Run bounded IPC and collective probe
        run: |
          set -euo pipefail
          bash .github/scripts/atomesh/pd_submit.sh \
            --cell-json "$(cat .github/scripts/k3-ipc-collective-probe/cell.json)" \
            --result-dir "ipc-probe-results/${GITHUB_RUN_ATTEMPT}"
      - name: Stop remaining probe and collect evidence
        if: always()
        run: |
          set -euo pipefail
          result_dir="ipc-probe-results/${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${result_dir}"
          cancel_script="${result_dir}/k3-ipc-collective-probe.slurm-cancel.sh"
          if [[ -f "${cancel_script}" ]]; then
            timeout --kill-after=5s 90s bash "${cancel_script}" > "${result_dir}/cancel.log" 2>&1 || true
          fi
          marker="${result_dir}/k3-ipc-collective-probe.log-root"
          if [[ -f "${marker}" ]]; then
            bash .github/scripts/atomesh/pd_collect_logs.sh "$(cat "${marker}")" "${result_dir}/logs" || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k3-ipc-collective-${{ github.run_id }}-${{ github.run_attempt }}
          path: ipc-probe-results/${{ github.run_attempt }}/
