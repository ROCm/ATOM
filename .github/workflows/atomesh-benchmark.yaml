name: K3 HIP IPC diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: atomesh-cicd
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Run bounded single-node IPC probe
        run: bash .github/scripts/k3-ipc-probe/submit.sh
      - name: Collect partial evidence
        if: always()
        run: |
          result_dir="ipc-probe-results/${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${result_dir}"
          if [[ -f "${result_dir}/slurm-cancel.sh" ]]; then
            timeout --kill-after=5s 90s bash "${result_dir}/slurm-cancel.sh" > "${result_dir}/cancel.log" 2>&1 || true
          fi
          bash .github/scripts/atomesh/pd_collect_logs.sh \
            "/share_nfs/ATOMESH_RUNNER/ATOMESH_LOG/k3-ipc-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${result_dir}" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k3-ipc-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ipc-probe-results/${{ github.run_attempt }}/
