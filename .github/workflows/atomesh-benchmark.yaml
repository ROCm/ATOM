name: K3 prefill READ lease fault diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prefill-probe:
    runs-on: atomesh-cicd
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Run prefill lease probe (expected fatal expiry)
        continue-on-error: true
        run: |
          set -euo pipefail
          result_dir="prefill-probe-results/${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${result_dir}"
          rc=0
          bash .github/scripts/atomesh/pd_submit.sh \
            --cell-json "$(cat .github/scripts/k3-prefill-probe/cell.json)" \
            --result-dir "${result_dir}" || rc=$?
          printf '%s\n' "${rc}" > "${result_dir}/driver.rc"
          exit "${rc}"
      - name: Stop remaining probe and collect evidence
        if: always()
        run: |
          set -euo pipefail
          result_dir="prefill-probe-results/${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${result_dir}"
          cancel_script="${result_dir}/k3-prefill-lease-probe.slurm-cancel.sh"
          if [[ -f "${cancel_script}" ]]; then
            timeout --kill-after=5s 90s bash "${cancel_script}" > "${result_dir}/cancel.log" 2>&1 || true
          fi
          marker="${result_dir}/k3-prefill-lease-probe.log-root"
          if [[ -f "${marker}" ]]; then
            bash .github/scripts/atomesh/pd_collect_logs.sh "$(cat "${marker}")" "${result_dir}/logs" || true
          fi
      - name: Validate delayed ACK, expected fatal expiry and cleanup
        if: always()
        run: |
          python3 .github/scripts/k3-prefill-probe/validate_lease.py \
            "prefill-probe-results/${GITHUB_RUN_ATTEMPT}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k3-prefill-lease-${{ github.run_id }}-${{ github.run_attempt }}
          path: prefill-probe-results/${{ github.run_attempt }}/
