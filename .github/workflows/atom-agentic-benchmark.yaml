{
  "name": "ATOM Agentic Benchmark",
  "run-name": "PR3097 DPA4 c256 \u2014 independent real smoke gates then fresh main OFF vs head Store ON",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "pr3097-dpa4-c256-ab",
    "cancel-in-progress": false
  },
  "jobs": {
    "paired": {
      "name": "Sequential main OFF \u00e2\u2020\u2019 head Store ON on same runner",
      "runs-on": "linux-atom-pitt-mi350x-8",
      "timeout-minutes": 360,
      "env": {
        "BENCH_KIND": "aiperf_agentic",
        "MODEL_PATH": "deepseek-ai/DeepSeek-V4.1-Flash",
        "ISL": "0",
        "OSL": "0",
        "CONC": "256",
        "RANDOM_RANGE_RATIO": "0"
      },
      "steps": [
        {
          "name": "Smoke A \u2014 Show ROCm status (host)",
          "run": "docker ps -a && rocm-smi --showmemuse 2>/dev/null || true",
          "env": {
            "BENCH_KIND": "aiperf_agentic",
            "MODEL_PATH": "deepseek-ai/DeepSeek-V4.1-Flash",
            "ARGS": "-tp 4 --enable-dp-attention --moe-backend standard --all2all-backend none --kv_cache_dtype bf16 --index-cache-dtype fp8 --max-model-len 262144 --gpu-memory-utilization 0.75 --max-num-seqs 24 --max-num-batched-tokens 1024 --attn-prefill-chunk-size 16384 --enable_prefix_caching --block-size 16 --state-checkpoint-interval-tokens 8192 --level 3 --cudagraph-mode FULL --cudagraph-capture-sizes '[1,2,4,8,16,24]' --method dspark --num-speculative-tokens 5 --tool-call-parser dsml_v41 --dspark-config '{\"confidence_schedule\":false}' --disable-uvicorn-access-log --dp-load-balance least_requests",
            "ISL": "0",
            "OSL": "0",
            "CONC": "4",
            "RANDOM_RANGE_RATIO": "0",
            "RESULT_FILENAME": "pr3097-smoke-A-dpa4-c4"
          },
          "continue-on-error": true
        },
        {
          "name": "Smoke A \u2014 Checkout ATOM repo",
          "uses": "actions/checkout@v6",
          "with": {
            "ref": "74e389b7661fb53ffb0a7daa93b0d73afe4d7476"
          },
          "env": {
            "BENCH_KIND": "aiperf_agentic",
            "MODEL_PATH": "deepseek-ai/DeepSeek-V4.1-Flash",
            "ARGS": "-tp 4 --enable-dp-attention --moe-backend standard --all2all-backend none --kv_cache_dtype bf16 --index-cache-dtype fp8 --max-model-len 262144 --gpu-memory-utilization 0.75 --max-num-seqs 24 --max-num-batched-tokens 1024 --attn-prefill-chunk-size 16384 --enable_prefix_caching --block-size 16 --state-checkpoint-interval-tokens 8192 --level 3 --cudagraph-mode FULL --cudagraph-capture-sizes '[1,2,4,8,16,24]' --method dspark --num-speculative-tokens 5 --tool-call-parser dsml_v41 --dspark-config '{\"confidence_schedule\":false}' --disable-uvicorn-access-log --dp-load-balance least_requests",
            "ISL": "0",
            "OSL": "0",
            "CONC": "4",
            "RANDOM_RANGE_RATIO": "0",
            "RESULT_FILENAME": "pr3097-smoke-A-dpa4-c4"
          },
          "continue-on-error": true
        },
        {
          "name": "Smoke A \u2014 Start own GPU container with read-only source",
          "env": {
            "GITHUB_WORKSPACE": "${{ github.workspace }}",
            "MODEL_ENV_VARS": "HIP_VISIBLE_DEVICES=0,1,2,3\nBENCHMARK_PRECISION=fp8\nPRECISION=fp8\nBENCHMARK_MODEL_KEY=dsv41flash\nATOM_BUNDLE_REQUIRE_FULL=1\nATOM_DSV41_BENCHMARK_SYNTHETIC=0\nAIPERF_UNSAFE_OVERRIDE=0\nAIPERF_BENCHMARK_DURATION=60\nAIPERF_MAX_CONTEXT_LENGTH=262144\nAIPERF_WARMUP_REQUESTS_PER_LANE=1\nAIPERF_NUM_DATASET_ENTRIES=393\nAIPERF_SCENARIO=agentx\nAIPERF_PUBLIC_DATASET=semianalysis_cc_traces_weka_062126\nATOM_FRONTEND_PREFIX_HASH=1\nATOM_DP_SESSION_AFFINITY=0\nATOM_DSPARK_DISABLE_COMPILE=1\nATOM_DISABLE_MORI_EP=1\nATOM_USE_CUSTOM_ALL_GATHER=0\nATOM_DISABLE_MMAP=true\nNCCL_IB_DISABLE=1\nNCCL_SOCKET_IFNAME=lo\nGLOO_SOCKET_IFNAME=lo\nATOM_HOST_IP=127.0.0.1\nMOONCAKE_DISABLE_HIP_DMABUF=1\nHSA_ENABLE_IPC_MODE_LEGACY=1\nATOM_KV_OFFLOAD=",
            "HF_TOKEN": "${{ secrets.AMD_HF_TOKEN }}",
            "CONTAINER_NAME": "pr3097-ab-${{ github.run_id }}-smoke-a",
            "ATOM_BASE_IMAGE": "rocm/atom-dev@sha256:167ce262f6ab188cd1a971dc7ae5f3d4e50586293a2d1c53ea1efbc92ab7491d",
            "RESOLVED_ATOM_BASE_IMAGE": "",
            "ATOM_DASHBOARD_DOCKER_IMAGE": "",
            "RUNNER_LABEL": "linux-atom-pitt-mi350x-8",
            "PULL_POLICY": "always",
            "NETWORK_HOST": "true",
            "EXTRA_RUN_FLAGS": "-e ISL=${{ env.ISL }} -e OSL=${{ env.OSL }} -e ATOM_BENCHMARK_CAPTURE=1 -e BENCH_KIND=${{ env.BENCH_KIND }} -e CONC=4 -e RANDOM_RANGE_RATIO=${{ env.RANDOM_RANGE_RATIO }} -e ENABLE_TORCH_PROFILER=0 -e ENABLE_RTL_PROFILER=0 --label codex.task=pr3097-action-ab --label codex.run=${{ github.run_id }}",
            "DISABLE_MMAP": "false",
            "CONC": "4"
          },
          "run": "set -euo pipefail\n# A run-unique name must be unused; never stop an existing unknown container.\ntest -z \"$(docker ps -aq -f \"name=^${CONTAINER_NAME}$\")\"\nif [ -f \"/etc/podinfo/gha-render-devices\" ]; then\n  DEVICE_FLAG=$(cat /etc/podinfo/gha-render-devices)\nelse\n  DEVICE_FLAG=\"--device /dev/dri\"\nfi\n\nMODEL_HOST_ROOT=\"\"\n# PITT predownload runners keep model payloads on the Docker host under\n# /models. The Actions runner process may not see that host path itself,\n# so do not gate the bind mount on `[ -d /models ]` for that label.\nif [ \"${RUNNER_LABEL}\" = \"atom-mi355-8gpu.predownload\" ]; then\n  MODEL_HOST_ROOT=\"/models\"\nelse\n  # Prefer the common host cache roots used by the GPU workflows.\n  for d in \\\n    /models \\\n    /shared_nfs/huggingface_models \\\n    /shared_nfs/models \\\n    /it-share/models \\\n    /mnt/raid0/pretrained_model \\\n    /shared/data/WRH/models \\\n    /data/models \\\n    /data/pretrained_model; do\n    if [ -d \"$d\" ]; then\n      MODEL_HOST_ROOT=\"$d\"\n      break\n    fi\n  done\nfi\n\nMODEL_MOUNT=\"\"\nif [ -n \"$MODEL_HOST_ROOT\" ]; then\n  MODEL_MOUNT=\"-v ${MODEL_HOST_ROOT}:/models\"\n  echo \"Using model cache root: ${MODEL_HOST_ROOT}\"\n  echo \"MODEL_HOST_ROOT=${MODEL_HOST_ROOT}\" >> \"$GITHUB_ENV\"\nelse\n  echo \"Warning: no model cache directory found on runner; skipping /models mount and disabling model pre-download optimization.\"\nfi\n\n# Write env_vars via env block (avoids expression injection). Key the\n# env-file by container name so concurrent containers on one runner\n# (e.g. benchmark + regression) don't clobber each other's file.\nENV_FILE=\"/tmp/atom_${CONTAINER_NAME}_env.txt\"\nprintenv MODEL_ENV_VARS | grep -v '^$' > \"$ENV_FILE\" || true\nUSE_LOOPBACK_SOCKETS=false\ncase \"${RUNNER_LABEL}\" in\n  linux-atom-do-mi350x-8|linux-atom-do-mi350x-8.test|linux-atom-pitt-mi350x-8|atom-mi355-8gpu.predownload)\n    USE_LOOPBACK_SOCKETS=true\n    ;;\nesac\nif [ \"${USE_LOOPBACK_SOCKETS}\" = \"true\" ]; then\n  grep -v -E '^(NCCL_SOCKET_IFNAME|MORI_SOCKET_IFNAME)=' \"$ENV_FILE\" > \"${ENV_FILE}.tmp\" || true\n  mv \"${ENV_FILE}.tmp\" \"$ENV_FILE\"\n  {\n    echo \"NCCL_SOCKET_IFNAME=lo\"\n    echo \"MORI_SOCKET_IFNAME=lo\"\n  } >> \"$ENV_FILE\"\nfi\n\nIMAGE_TAG=\"${RESOLVED_ATOM_BASE_IMAGE:-$ATOM_BASE_IMAGE}\"\necho \"Starting container with image: $IMAGE_TAG\"\necho \"Model-specific environment variables:\"\ncat \"$ENV_FILE\"\n\nPULL_FLAG=\"\"\nif [ -n \"${PULL_POLICY:-}\" ]; then\n  PULL_FLAG=\"--pull ${PULL_POLICY}\"\nelif [ -n \"${RESOLVED_ATOM_BASE_IMAGE:-}\" ]; then\n  PULL_FLAG=\"\"\nelif [ \"${RUNNER_LABEL}\" = \"atom-mi355-8gpu.predownload\" ] || [ \"${RUNNER_LABEL}\" = \"linux-atom-do-mi350x-8\" ] || [ \"${RUNNER_LABEL}\" = \"linux-atom-pitt-mi350x-8\" ]; then\n  PULL_FLAG=\"--pull always\"\nfi\n\nNETWORK_FLAG=\"\"\n[ \"${NETWORK_HOST}\" = \"true\" ] && NETWORK_FLAG=\"--network=host\"\n\nMMAP_FLAG=\"\"\n[ \"${DISABLE_MMAP}\" = \"true\" ] && MMAP_FLAG=\"-e ATOM_DISABLE_MMAP=true\"\n\nGROUP_ADD_FLAGS=\"--group-add video\"\nif getent group render >/dev/null 2>&1; then\n  GROUP_ADD_FLAGS=\"${GROUP_ADD_FLAGS} --group-add $(getent group render | cut -d: -f3)\"\nfi\n\ndocker run -dt $PULL_FLAG $NETWORK_FLAG --device=/dev/kfd $DEVICE_FLAG \\\n-v \"${GITHUB_WORKSPACE:-$PWD}\":/task-source:ro \\\n$MODEL_MOUNT \\\n-w /workspace \\\n--ipc=host $GROUP_ADD_FLAGS \\\n--shm-size=16G \\\n--cap-add=SYS_PTRACE \\\n-e HF_TOKEN=\"${HF_TOKEN:-}\" \\\n-e ATOM_DOCKER_IMAGE=\"${ATOM_DASHBOARD_DOCKER_IMAGE:-}\" \\\n$EXTRA_RUN_FLAGS \\\n--env-file \"$ENV_FILE\" \\\n--security-opt seccomp=unconfined \\\n--ulimit memlock=-1 \\\n--ulimit stack=67108864 \\\n$MMAP_FLAG \\\n--name \"$CONTAINER_NAME\" \\\n$IMAGE_TAG\n",
          "continue-on-error": true
        },
        {
          "name": "Smoke A \u2014 Gate read-only source and copy into private workspace",
          "run": "set -euo pipefail\npython3 - \"pr3097-ab-${{ github.run_id }}-smoke-a\" \"${{ github.run_id }}\" \"74e389b7661fb53ffb0a7daa93b0d73afe4d7476\" <<'PY'\nimport json,os,pathlib,subprocess,sys\nname,run_id,sha=sys.argv[1:4]\nassert name in ['pr3097-ab-'+run_id+'-a','pr3097-ab-'+run_id+'-b','pr3097-ab-'+run_id+'-smoke-a','pr3097-ab-'+run_id+'-smoke-b']\nworkspace=pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)\nassert workspace.is_absolute() and str(workspace) not in ['/','/home','/home/runner','/home/runner/_work'] and (workspace/'.git').is_dir()\nassert subprocess.check_output(['git','-C',str(workspace),'rev-parse','HEAD'],text=True).strip()==sha\nfmt='{\"name\":{{json .Name}},\"labels\":{{json .Config.Labels}},\"mounts\":{{json .Mounts}}}'\nd=json.loads(subprocess.check_output(['docker','inspect','--format',fmt,name],text=True))\nassert d['name']=='/'+name and d['labels'].get('codex.task')=='pr3097-action-ab' and d['labels'].get('codex.run')==run_id\nsrc=[m for m in d['mounts'] if m['Destination']=='/task-source']\nassert len(src)==1 and src[0]['Type']=='bind' and src[0]['RW'] is False and pathlib.Path(src[0]['Source']).resolve(strict=True)==workspace\nassert not any(m['Destination']=='/workspace' or m['Destination'].startswith('/workspace/') or m['Destination'].startswith('/task-source/') for m in d['mounts']), 'Writable workspace or nested source mount is forbidden'\nprint('Validated read-only exact source bind; /workspace is container overlay')\n\nPY\ndocker exec -i pr3097-ab-${{ github.run_id }}-smoke-a python3 - <<'PY'\nimport pathlib,shutil,os\nsrc=pathlib.Path('/task-source');dst=pathlib.Path('/workspace')\nassert src.is_dir() and (src/'.git').is_dir() and (src/'atom').is_dir()\n# Host bind scope was validated before entering this exact owned container.\n# /workspace has no mounts; replace only its fresh private image overlay.\nif dst.is_symlink():dst.unlink()\nelif dst.exists():shutil.rmtree(dst)\nshutil.copytree(src,dst,symlinks=True,copy_function=shutil.copy2)\nassert (dst/'.git').is_dir() and (dst/'atom').is_dir()\nprint('Copied exact source into private /workspace; host source stays read-only')\n\nPY\n",
          "continue-on-error": true,
          "env": {
            "CONC": "4"
          },
          "id": "smoke_a_source"
        },
        {
          "name": "Smoke A \u2014 Download model in own copied workspace",
          "shell": "bash",
          "env": {
            "HF_TOKEN": "${{ secrets.AMD_HF_TOKEN }}",
            "MODEL_DOWNLOAD_TIMEOUT": "30m",
            "MODEL_LOCK_WAIT_SECONDS": "1800",
            "MODEL_LOCK_POLL_INTERVAL": "30",
            "MODEL_PROGRESS_INTERVAL": "60",
            "CONC": "4"
          },
          "run": "set -euo pipefail\nif [ -z \"${MODEL_HOST_ROOT:-}\" ]; then\n  echo \"Model cache directory not found, skipping model download\"\n  exit 0\nfi\nmodel_dir=\"/models/deepseek-ai/DeepSeek-V4.1-Flash\"\necho \"Lock-protected download for ${model_dir}\"\nif docker exec \\\n  -e HF_TOKEN=\"${HF_TOKEN:-}\" \\\n  -e MODEL_ID=\"deepseek-ai/DeepSeek-V4.1-Flash\" \\\n  -e TARGET_DIR=\"${model_dir}\" \\\n  -e MODEL_DOWNLOAD_TIMEOUT=\"${MODEL_DOWNLOAD_TIMEOUT}\" \\\n  -e MODEL_LOCK_WAIT_SECONDS=\"${MODEL_LOCK_WAIT_SECONDS}\" \\\n  -e MODEL_LOCK_POLL_INTERVAL=\"${MODEL_LOCK_POLL_INTERVAL}\" \\\n  -e MODEL_PROGRESS_INTERVAL=\"${MODEL_PROGRESS_INTERVAL}\" \\\n  \"pr3097-ab-${{ github.run_id }}-smoke-a\" \\\n  bash -lc 'bash /workspace/.github/scripts/download_model_with_lock.sh \"$MODEL_ID\" \"$TARGET_DIR\"'; then\n  echo \"Model ready: ${model_dir}\"\nelif [ \"true\" = \"true\" ]; then\n  echo \"Model download failed for 'deepseek-ai/DeepSeek-V4.1-Flash'. Aborting.\"\n  exit 1\nelse\n  echo \"::warning::Failed to download deepseek-ai/DeepSeek-V4.1-Flash, will use HF online\"\nfi\n",
          "continue-on-error": true
        },
        {
          "name": "Smoke A \u2014 Verify checked-out ATOM code",
          "run": "docker exec -i -e EXPECTED_ATOM_SHA=\"$(git rev-parse HEAD)\" pr3097-ab-${{ github.run_id }}-smoke-a python3 - <<'PY'\nimport importlib.util\nimport os\nimport subprocess\nfrom pathlib import Path\n\nsource = Path(importlib.util.find_spec(\"atom\").origin).resolve().parent\nexpected_source = Path(\"/workspace/atom\").resolve()\nif source != expected_source:\n    raise SystemExit(f\"ATOM imports from {source}, expected {expected_source}\")\nsha = subprocess.check_output(\n    [\"git\", \"-c\", \"safe.directory=/workspace\", \"-C\", \"/workspace\", \"rev-parse\", \"HEAD\"],\n    text=True,\n).strip()\nif sha != os.environ[\"EXPECTED_ATOM_SHA\"]:\n    raise SystemExit(f\"Checkout SHA mismatch: {sha}\")\nprint(f\"Executing ATOM checkout {sha} from {source}; image supplies the runtime.\")\nPY\n",
          "env": {
            "BENCH_KIND": "aiperf_agentic",
            "MODEL_PATH": "deepseek-ai/DeepSeek-V4.1-Flash",
            "ARGS": "-tp 4 --enable-dp-attention --moe-backend standard --all2all-backend none --kv_cache_dtype bf16 --index-cache-dtype fp8 --max-model-len 262144 --gpu-memory-utilization 0.75 --max-num-seqs 24 --max-num-batched-tokens 1024 --attn-prefill-chunk-size 16384 --enable_prefix_caching --block-size 16 --state-checkpoint-interval-tokens 8192 --level 3 --cudagraph-mode FULL --cudagraph-capture-sizes '[1,2,4,8,16,24]' --method dspark --num-speculative-tokens 5 --tool-call-parser dsml_v41 --dspark-config '{\"confidence_schedule\":false}' --disable-uvicorn-access-log --dp-load-balance least_requests",
            "ISL": "0",
            "OSL": "0",
            "CONC": "4",
            "RANDOM_RANGE_RATIO": "0",
            "RESULT_FILENAME": "pr3097-smoke-A-dpa4-c4"
          },
          "continue-on-error": true
        },
        {
          "name": "Smoke A \u2014 Collect GPU info (inside container)",
          "id": "smoke_a_gpu-info",
          "env": {
            "REQUESTED_IMAGE": "rocm/atom-dev@sha256:167ce262f6ab188cd1a971dc7ae5f3d4e50586293a2d1c53ea1efbc92ab7491d",
            "IMAGE_DISPLAY": "rocm/atom-dev@sha256:167ce262f6ab188cd1a971dc7ae5f3d4e50586293a2d1c53ea1efbc92ab7491d",
            "BENCH_KIND": "aiperf_agentic",
            "MODEL_PATH": "deepseek-ai/DeepSeek-V4.1-Flash",
            "ARGS": "-tp 4 --enable-dp-attention --moe-backend standard --all2all-backend none --kv_cache_dtype bf16 --index-cache-dtype fp8 --max-model-len 262144 --gpu-memory-utilization 0.75 --max-num-seqs 24 --max-num-batched-tokens 1024 --attn-prefill-chunk-size 16384 --enable_prefix_caching --block-size 16 --state-checkpoint-interval-tokens 8192 --level 3 --cudagraph-mode FULL --cudagraph-capture-sizes '[1,2,4,8,16,24]' --method dspark --num-speculative-tokens 5 --tool-call-parser dsml_v41 --dspark-config '{\"confidence_schedule\":false}' --disable-uvicorn-access-log --dp-load-balance least_requests",
            "ISL": "0",
            "OSL": "0",
            "CONC": "4",
            "RANDOM_RANGE_RATIO": "0",
            "RESULT_FILENAME": "pr3097-smoke-A-dpa4-c4"
          },
          "run": "set -euo pipefail\nRUNNER_HINT=\"linux-atom-pitt-mi350x-8\"\nbash .github/scripts/collect_gpu_info.sh pr3097-ab-${{ github.run_id }}-smoke-a docker \"$RUNNER_HINT\"\n# A registry's latest may have changed since startup. Use the name\n# resolved with this run's digest, never a second remote lookup.\nDOCKER_IMAGE=\"$IMAGE_DISPLAY\"\nIMAGE_ID=$(docker inspect --format '{{.Image}}' pr3097-ab-${{ github.run_id }}-smoke-a)\nEXPECTED_IMAGE_ID=$(docker image inspect --format '{{.Id}}' \"$REQUESTED_IMAGE\")\ntest \"$IMAGE_ID\" = \"$EXPECTED_IMAGE_ID\"\necho \"image_digest=${IMAGE_ID}\" >> \"$GITHUB_OUTPUT\"\necho \"docker_image=${DOCKER_IMAGE}\" >> $GITHUB_OUTPUT\necho \"Docker: ${DOCKER_IMAGE}\"\n",
          "continue-on-error": true
        },
        {
          "name": "Smoke A \u2014 Run benchmark",
          "timeout-minutes": 180,
          "env": {
            "EXTRA_LAUNCH_ARGS": "",
            "BENCH_EXTRA_ARGS": "",
            "GPU_NAME": "${{ steps.smoke_a_gpu-info.outputs.gpu_name }}",
            "ROCM_VERSION": "${{ steps.smoke_a_gpu-info.outputs.rocm_version }}",
            "DOCKER_IMAGE": "${{ steps.smoke_a_gpu-info.outputs.docker_image }}",
            "ATOM_IMAGE_DIGEST": "${{ steps.smoke_a_gpu-info.outputs.image_digest }}",
            "BENCH_KIND": "aiperf_agentic",
            "MODEL_PATH": "deepseek-ai/DeepSeek-V4.1-Flash",
            "ARGS": "-tp 4 --enable-dp-attention --moe-backend standard --all2all-backend none --kv_cache_dtype bf16 --index-cache-dtype fp8 --max-model-len 262144 --gpu-memory-utilization 0.75 --max-num-seqs 24 --max-num-batched-tokens 1024 --attn-prefill-chunk-size 16384 --enable_prefix_caching --block-size 16 --state-checkpoint-interval-tokens 8192 --level 3 --cudagraph-mode FULL --cudagraph-capture-sizes '[1,2,4,8,16,24]' --method dspark --num-speculative-tokens 5 --tool-call-parser dsml_v41 --dspark-config '{\"confidence_schedule\":false}' --disable-uvicorn-access-log --dp-load-balance least_requests",
            "ISL": "0",
            "OSL": "0",
            "CONC": "4",
            "RANDOM_RANGE_RATIO": "0",
            "RESULT_FILENAME": "pr3097-smoke-A-dpa4-c4"
          },
          "run": "set -euo pipefail\ndocker exec -i pr3097-ab-${{ github.run_id }}-smoke-a python3 - <<'PY'\nimport socket,errno\nwith socket.socket() as probe:\n    probe.settimeout(0.5)\n    assert probe.connect_ex(('127.0.0.1',8000))==errno.ECONNREFUSED, 'Port8000 already has a service; do not benchmark or stop an unknown server'\nPY\nset -euo pipefail\nif [ -n \"${MODEL_HOST_ROOT:-}\" ]; then model_path=\"/models/deepseek-ai/DeepSeek-V4.1-Flash\"\nelse model_path=\"deepseek-ai/DeepSeek-V4.1-Flash\"; fi\n\n# Launch via stdin so the container's bash parses the shell quoting in\n# ARGS exactly once -- single-quoted JSON values survive intact (e.g.\n# --hf-overrides '{\"use_index_cache\": true, \"index_topk_freq\": 4}').\n# Substituting ${{ env.ARGS }} into a `bash -lc \"...\"` string instead\n# collides the JSON's double quotes with the outer quotes and strips\n# them (argparse: invalid loads value). Mirrors atom-test.yaml.\necho \"ENABLE_TORCH_PROFILER=0 \\\n  ENABLE_RTL_PROFILER=0 \\\n  .github/scripts/atom_test.sh launch $model_path $ARGS $EXTRA_LAUNCH_ARGS\" \\\n  | docker exec -i pr3097-ab-${{ github.run_id }}-smoke-a bash -l\n\necho \"========== Running benchmark ==========\"\ndocker exec \\\n  -e ENABLE_TORCH_PROFILER=\"0\" \\\n  -e RESULT_FILENAME=\"pr3097-smoke-A-dpa4-c4\" \\\n  -e SERVER_ARGS=\"$ARGS $EXTRA_LAUNCH_ARGS\" \\\n  -e BENCH_EXTRA_ARGS -e BENCH_KIND \\\n  -e GPU_NAME -e ROCM_VERSION \\\n  -e DOCKER_IMAGE -e ATOM_IMAGE_DIGEST \\\n  -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \\\n  -e GITHUB_JOB -e GITHUB_SHA -e GITHUB_WORKFLOW_REF \\\n  -e MP=\"$model_path\" \\\n  pr3097-ab-${{ github.run_id }}-smoke-a bash -lc '.github/scripts/atom_test.sh benchmark \"$MP\"'\n",
          "continue-on-error": true,
          "if": "${{ steps.smoke_a_source.outcome == 'success' }}"
        },
        {
          "name": "Smoke A \u2014 Dump server log",
          "if": "always()",
          "run": "docker exec pr3097-ab-${{ github.run_id }}-smoke-a cat /tmp/atom_server.log 2>/dev/null || true\n",
          "env": {
            "BENCH_KIND": "aiperf_agentic",
            "MODEL_PATH": "deepseek-ai/DeepSeek-V4.1-Flash",
            "ARGS": "-tp 4 --enable-dp-attention --moe-backend standard --all2all-backend none --kv_cache_dtype bf16 --index-cache-dtype fp8 --max-model-len 262144 --gpu-memory-utilization 0.75 --max-num-seqs 24 --max-num-batched-tokens 1024 --attn-prefill-chunk-size 16384 --enable_prefix_caching --block-size 16 --state-checkpoint-interval-tokens 8192 --level 3 --cudagraph-mode FULL --cudagraph-capture-sizes '[1,2,4,8,16,24]' --method dspark --num-speculative-tokens 5 --tool-call-parser dsml_v41 --dspark-config '{\"confidence_schedule\":false}' --disable-uvicorn-access-log --dp-load-balance least_requests",
            "ISL": "0",
            "OSL": "0",
            "CONC": "4",
            "RANDOM_RANGE_RATIO": "0",
            "RESULT_FILENAME": "pr3097-smoke-A-dpa4-c4"
          },
          "continue-on-error": true
        },
        {
