          "run": "set -euo pipefail\n# A run-unique name must be unused; never stop an existing unknown container.\ntest -z \"$(docker ps -aq -f \"name=^${CONTAINER_NAME}$\")\"\nif [ -f \"/etc/podinfo/gha-render-devices\" ]; then\n  DEVICE_FLAG=$(cat /etc/podinfo/gha-render-devices)\nelse\n  DEVICE_FLAG=\"--device /dev/dri\"\nfi\n\nMODEL_HOST_ROOT=\"\"\n# PITT predownload runners keep model payloads on the Docker host under\n# /models. The Actions runner process may not see that host path itself,\n# so do not gate the bind mount on `[ -d /models ]` for that label.\nif [ \"${RUNNER_LABEL}\" = \"atom-mi355-8gpu.predownload\" ]; then\n  MODEL_HOST_ROOT=\"/models\"\nelse\n  # Prefer the common host cache roots used by the GPU workflows.\n  for d in \\\n    /models \\\n    /shared_nfs/huggingface_models \\\n    /shared_nfs/models \\\n    /it-share/models \\\n    /mnt/raid0/pretrained_model \\\n    /shared/data/WRH/models \\\n    /data/models \\\n    /data/pretrained_model; do\n    if [ -d \"$d\" ]; then\n      MODEL_HOST_ROOT=\"$d\"\n      break\n    fi\n  done\nfi\n\nMODEL_MOUNT=\"\"\nif [ -n \"$MODEL_HOST_ROOT\" ]; then\n  MODEL_MOUNT=\"-v ${MODEL_HOST_ROOT}:/models\"\n  echo \"Using model cache root: ${MODEL_HOST_ROOT}\"\n  echo \"MODEL_HOST_ROOT=${MODEL_HOST_ROOT}\" >> \"$GITHUB_ENV\"\nelse\n  echo \"Warning: no model cache directory found on runner; skipping /models mount and disabling model pre-download optimization.\"\nfi\n\n# Write env_vars via env block (avoids expression injection). Key the\n# env-file by container name so concurrent containers on one runner\n# (e.g. benchmark + regression) don't clobber each other's file.\nENV_FILE=\"/tmp/atom_${CONTAINER_NAME}_env.txt\"\nprintenv MODEL_ENV_VARS | grep -v '^$' > \"$ENV_FILE\" || true\nUSE_LOOPBACK_SOCKETS=false\ncase \"${RUNNER_LABEL}\" in\n  linux-atom-do-mi350x-8|linux-atom-do-mi350x-8.test|linux-atom-pitt-mi350x-8|atom-mi355-8gpu.predownload)\n    USE_LOOPBACK_SOCKETS=true\n    ;;\nesac\nif [ \"${USE_LOOPBA