            "BENCH_KIND": "aiperf_agentic",
            "MODEL_PATH": "deepseek-ai/DeepSeek-V4.1-Flash",
            "ARGS": "-tp 4 --enable-dp-attention --moe-backend standard --all2all-backend none --kv_cache_dtype bf16 --index-cache-dtype fp8 --max-model-len 262144 --gpu-memory-utilization 0.75 --max-num-seqs 24 --max-num-batched-tokens 1024 --attn-prefill-chunk-size 16384 --enable_prefix_caching --block-size 16 --state-checkpoint-interval-tokens 8192 --level 3 --cudagraph-mode FULL --cudagraph-capture-sizes '[1,2,4,8,16,24]' --method dspark --num-speculative-tokens 5 --tool-call-parser dsml_v41 --dspark-config '{\"confidence_schedule\":false}' --disable-uvicorn-access-log --dp-load-balance least_requests",
            "ISL": "0",
            "OSL": "0",
            "CONC": "256",
            "RANDOM_RANGE_RATIO": "0",
            "RESULT_FILENAME": "pr3097-A-dpa4-c256"
          }
        },
        {
          "name": "A â€” Start container + download model",
          "uses": "./.github/actions/atom-bench-container",
          "with": {
            "image": "rocm/atom-dev@sha256:167ce262f6ab188cd1a971dc7ae5f3d4e50586293a2d1c53ea1efbc92ab7491d",
            "container-name": "pr3097-ab-${{ github.run_id }}-a",
            "model-path": "deepseek-ai/DeepSeek-V4.1-Flash",
            "runner": "linux-atom-pitt-mi350x-8",
            "env-vars": "HIP_VISIBLE_DEVICES=0,1,2,3\nBENCHMARK_PRECISION=fp8\nPRECISION=fp8\nBENCHMARK_MODEL_KEY=dsv41flash\nATOM_BUNDLE_REQUIRE_FULL=1\nATOM_DSV41_BENCHMARK_SYNTHETIC=0\nAIPERF_UNSAFE_OVERRIDE=0\nAIPERF_BENCHMARK_DURATION=1800\nAIPERF_MAX_CONTEXT_LENGTH=262144\nAIPERF_WARMUP_REQUESTS_PER_LANE=10\nAIPERF_NUM_DATASET_ENTRIES=393\nAIPERF_SCENARIO=agentx\nAIPERF_PUBLIC_DATASET=semianalysis_cc_traces_weka_062126\nATOM_FRONTEND_PREFIX_HASH=1\nATOM_DP_SESSION_AFFINITY=0\nATOM_DSPARK_DISABLE_COMPILE=1\nATOM_DISABLE_MORI_EP=1\nATOM_USE_CUSTOM_ALL_GATHER=0\nATOM_DISABLE_MMAP=true\nNCCL_IB_DISABLE=1\nNCCL_SOCKET_IFNAME=lo\nGLOO_SOCKET_IFNAME=lo\nATOM_HOST_IP=127.0.0.1\nMOONCAKE_DISABLE_HIP_DMABUF=1\nHSA_ENABLE_IPC_MODE_LEGACY=1\nATOM_KV_OFFLOAD=",
            "hf-token": "${{ secrets.AMD_HF_TOKEN }}",
            "download-required": "true",
            "container-env": "-e ISL=${{ env.ISL }} -e OSL=${{ env.OSL }} -e ATOM_BENCHMARK_CAPTURE=1 -e BENCH_KIND=${{ env.BENCH_KIND }} -e CONC=${{ env.CONC }} -e RANDOM_RANGE_RATIO=${{ env.RANDOM_RANGE_RATIO }} -e ENABLE_TORCH_PROFILER=0 -e ENABLE_RTL_PROFILER=0 --label codex.task=pr3097-action-ab --label codex.run=${{ github.run_id }}"
          },
          "env": {
            "BENCH_KIND": "aiperf_agentic",
            "MODEL_PATH": "deepseek-ai/DeepSeek-V4.1-Flash",
            "ARGS": "-tp 4 --enable-dp-attention --moe-backend standard --all2all-backend none --kv_cache_dtype bf16 --index-cache-dtype fp8 --max-model-len 262144 --gpu-memory-utilization 0.75 --max-num-seqs 24 --max-num-batched-tokens 1024 --attn-prefill-chunk-size 16384 --enable_prefix_caching --block-size 16 --state-checkpoint-interval-tokens 8192 --level 3 --cudagraph-mode FULL --cudagraph-capture-sizes '[1,2,4,8,16,24]' --method dspark --num-speculative-tokens 5 --tool-call-parser dsml_v41 --dspark-config '{\"confidence_schedule\":false}' --disable-uvicorn-access-log --dp-load-balance least_requests",
            "ISL": "0",
            "OSL": "0",
            "CONC": "256",
            "RANDOM_RANGE_RATIO": "0",
            "RESULT_FILENAME": "pr3097-A-dpa4-c256"
          }
        },
        {
          "name": "A â€” Verify checked-out ATOM code",
          "run": "docker exec -i -e EXPECTED_ATOM_SHA=\"$(git rev-parse HEAD)\" pr3097-ab-${{ github.run_id }}-a python3 - <<'PY'\nimport importlib.util\nimport os\nimport subprocess\nfrom pathlib import Path\n\nsource = Path(importlib.util.find_spec(\"atom\").origin).resolve().parent\nexpected_source = Path(\"/workspace/atom\").resolve()\nif source != expected_source:\n    raise SystemExit(f\"ATOM imports from {source}, expected {expected_source}\")\nsha = subprocess.check_output(\n    [\"git\", \"-c\", \"safe.directory=/workspace\", \"-C\", \"/workspace\", \"rev-parse\", \"HEAD\"],\n    text=True,\n).strip()\nif sha != os.environ[\"EXPECTED_ATOM_SHA\"]:\n    raise SystemExit(f\"Checkout SHA mismatch: {sha}\")\nprint(f\"Executing ATOM checkout {sha} from {source}; image supplies the runtime.\")\nPY\n",
          "env": {
            "BENCH_KIND": "aiperf_agentic",
            "MODEL_PATH": "deepseek-ai/DeepSeek-V4.1-Flash",
            "ARGS": "-tp 4 --enable-dp-attention --moe-backend standard --all2all-backend none --kv_cache_dtype bf16 --index-cache-dtype fp8 --max-model-len 262144 --gpu-memory-utilization 0.75 --max-num-seqs 24 --max-num-batched-tokens 1024 --attn-prefill-chunk-size 16384 --enable_prefix_caching --block-size 16 --state-checkpoint-interval-tokens 8192 --level 3 --cudagraph-mode FULL --cudagraph-capture-sizes '[1,2,4,8,16,24]' --method dspark --num-speculative-tokens 5 --tool-call-parser dsml_v41 --dspark-config '{\"confidence_schedule\":false}' --disable-uvicorn-access-log --dp-load-balance least_requests",
            "ISL": "0",
            "OSL": "0",
            "CONC": "256",
            "RANDOM_RANGE_RATIO": "0",
            "RESULT_FILENAME": "pr3097-A-dpa4-c256"
          }
        },
