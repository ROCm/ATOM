          "name": "A â€” Run benchmark",
          "timeout-minutes": 180,
          "env": {
            "EXTRA_LAUNCH_ARGS": "",
            "BENCH_EXTRA_ARGS": "",
            "GPU_NAME": "${{ steps.A-gpu-info.outputs.gpu_name }}",
            "ROCM_VERSION": "${{ steps.A-gpu-info.outputs.rocm_version }}",
            "DOCKER_IMAGE": "${{ steps.A-gpu-info.outputs.docker_image }}",
            "ATOM_IMAGE_DIGEST": "${{ steps.A-gpu-info.outputs.image_digest }}",
            "BENCH_KIND": "aiperf_agentic",
            "MODEL_PATH": "deepseek-ai/DeepSeek-V4.1-Flash",
            "ARGS": "-tp 4 --enable-dp-attention --moe-backend standard --all2all-backend none --kv_cache_dtype bf16 --index-cache-dtype fp8 --max-model-len 262144 --gpu-memory-utilization 0.75 --max-num-seqs 24 --max-num-batched-tokens 1024 --attn-prefill-chunk-size 16384 --enable_prefix_caching --block-size 16 --state-checkpoint-interval-tokens 8192 --level 3 --cudagraph-mode FULL --cudagraph-capture-sizes '[1,2,4,8,16,24]' --method dspark --num-speculative-tokens 5 --tool-call-parser dsml_v41 --dspark-config '{\"confidence_schedule\":false}' --disable-uvicorn-access-log --dp-load-balance least_requests",
            "ISL": "0",
            "OSL": "0",
            "CONC": "256",
            "RANDOM_RANGE_RATIO": "0",
            "RESULT_FILENAME": "pr3097-A-dpa4-c256"
          },
          "run": "set -euo pipefail\nif [ -n \"${MODEL_HOST_ROOT:-}\" ]; then model_path=\"/models/deepseek-ai/DeepSeek-V4.1-Flash\"\nelse model_path=\"deepseek-ai/DeepSeek-V4.1-Flash\"; fi\n\n# Launch via stdin so the container's bash parses the shell quoting in\n# ARGS exactly once -- single-quoted JSON values survive intact (e.g.\n# --hf-overrides '{\"use_index_cache\": true, \"index_topk_freq\": 4}').\n# Substituting ${{ env.ARGS }} into a `bash -lc \"...\"` string instead\n# collides the JSON's double quotes with the outer quotes and strips\n# them (argparse: invalid loads value). Mirrors atom-test.yaml.\necho \"ENABLE_TORCH_PROFILER=0 \\\n  ENABLE_RTL_PROFILER=0 \\\n  .github/scripts/atom_test.sh launch $model_path $ARGS $EXTRA_LAUNCH_ARGS\" \\\n  | docker exec -i pr3097-ab-${{ github.run_id }}-a bash -l\n\necho \"========== Running benchmark ==========\"\ndocker exec \\\n  -e ENABLE_TORCH_PROFILER=\"0\" \\\n  -e RESULT_FILENAME=\"pr3097-A-dpa4-c256\" \\\n  -e SERVER_ARGS=\"$ARGS $EXTRA_LAUNCH_ARGS\" \\\n  -e BENCH_EXTRA_ARGS -e BENCH_KIND \\\n  -e GPU_NAME -e ROCM_VERSION \\\n  -e DOCKER_IMAGE -e ATOM_IMAGE_DIGEST \\\n  -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \\\n  -e GITHUB_JOB -e GITHUB_SHA -e GITHUB_WORKFLOW_REF \\\n  -e MP=\"$model_path\" \\\n  pr3097-ab-${{ github.run_id }}-a bash -lc '.github/scripts/atom_test.sh benchmark \"$MP\"'\n"
        },
        {
          "name": "A â€” Dump server log",
          "if": "always()",
          "run": "docker exec pr3097-ab-${{ github.run_id }}-a cat /tmp/atom_server.log 2>/dev/null || true\n",
          "env": {
            "BENCH_KIND": "aiperf_agentic",
            "MODEL_PATH": "deepseek-ai/DeepSeek-V4.1-Flash",
            "ARGS": "-tp 4 --enable-dp-attention --moe-backend standard --all2all-backend none --kv_cache_dtype bf16 --index-cache-dtype fp8 --max-model-len 262144 --gpu-memory-utilization 0.75 --max-num-seqs 24 --max-num-batched-tokens 1024 --attn-prefill-chunk-size 16384 --enable_prefix_caching --block-size 16 --state-checkpoint-interval-tokens 8192 --level 3 --cudagraph-mode FULL --cudagraph-capture-sizes '[1,2,4,8,16,24]' --method dspark --num-speculative-tokens 5 --tool-call-parser dsml_v41 --dspark-config '{\"confidence_schedule\":false}' --disable-uvicorn-access-log --dp-load-balance least_requests",
            "ISL": "0",
            "OSL": "0",
            "CONC": "256",
            "RANDOM_RANGE_RATIO": "0",
            "RESULT_FILENAME": "pr3097-A-dpa4-c256"
          }
        },
        {
          "name": "A â€” Dump client log",
          "if": "always()",
          "run": "docker exec pr3097-ab-${{ github.run_id }}-a cat /tmp/atom_client.log 2>/dev/null || true\n",
          "env": {
            "BENCH_KIND": "aiperf_agentic",
            "MODEL_PATH": "deepseek-ai/DeepSeek-V4.1-Flash",
            "ARGS": "-tp 4 --enable-dp-attention --moe-backend standard --all2all-backend none --kv_cache_dtype bf16 --index-cache-dtype fp8 --max-model-len 262144 --gpu-memory-utilization 0.75 --max-num-seqs 24 --max-num-batched-tokens 1024 --attn-prefill-chunk-size 16384 --enable_prefix_caching --block-size 16 --state-checkpoint-interval-tokens 8192 --level 3 --cudagraph-mode FULL --cudagraph-capture-sizes '[1,2,4,8,16,24]' --method dspark --num-speculative-tokens 5 --tool-call-parser dsml_v41 --dspark-config '{\"confidence_schedule\":false}' --disable-uvicorn-access-log --dp-load-balance least_requests",
            "ISL": "0",
            "OSL": "0",
            "CONC": "256",
            "RANDOM_RANGE_RATIO": "0",
            "RESULT_FILENAME": "pr3097-A-dpa4-c256"
          }
        },
        {
          "name": "A â€” Inject GPU metadata into benchmark result",
          "run": "docker exec \\\n  -e GPU_NAME=\"${{ steps.A-gpu-info.outputs.gpu_name }}\" \\\n  -e GPU_VRAM_GB=\"${{ steps.A-gpu-info.outputs.gpu_vram_gb }}\" \\\n  -e ROCM_VERSION=\"${{ steps.A-gpu-info.outputs.rocm_version }}\" \\\n  -e DOCKER_IMAGE=\"${{ steps.A-gpu-info.outputs.docker_image }}\" \\\n  -e RESULT_PATH=\"pr3097-A-dpa4-c256.json\" \\\n  -e DISPLAY_NAME=\"PR3097 A DPA4 main OFF\" \\\n  pr3097-ab-${{ github.run_id }}-a python3 -c \"\nimport json, os\np = os.environ['RESULT_PATH']\nif not os.path.exists(p):\n    print(f'{p} not found, skipping GPU metadata injection')\nelse:\n    with open(p) as f:\n        d = json.load(f)\n    d['gpu_name'] = os.environ.get('GPU_NAME', '')\n    d['gpu_vram_gb'] = int(os.environ.get('GPU_VRAM_GB') or 0)\n    d['rocm_version'] = os.environ.get('ROCM_VERSION', '')\n    d['docker_image'] = os.environ.get('DOCKER_IMAGE', '')\n    display_name = os.environ.get('DISPLAY_NAME', '')\n    if display_name:\n        d['benchmark_model_name'] = display_name\n    with open(p, 'w') as f:\n        json.dump(d, f, indent=2)\n\"\n",
          "env": {
            "BENCH_KIND": "aiperf_agentic",
            "MODEL_PATH": "deepseek-ai/DeepSeek-V4.1-Flash",
            "ARGS": "-tp 4 --enable-dp-attention --moe-backend standard --all2all-backend none --kv_cache_dtype bf16 --index-cache-dtype fp8 --max-model-len 262144 --gpu-memory-utilization 0.75 --max-num-seqs 24 --max-num-batched-tokens 1024 --attn-prefill-chunk-size 16384 --enable_prefix_caching --block-size 16 --state-checkpoint-interval-tokens 8192 --level 3 --cudagraph-mode FULL --cudagraph-capture-sizes '[1,2,4,8,16,24]' --method dspark --num-speculative-tokens 5 --tool-call-parser dsml_v41 --dspark-config '{\"confidence_schedule\":false}' --disable-uvicorn-access-log --dp-load-balance least_requests",
            "ISL": "0",
            "OSL": "0",
            "CONC": "256",
            "RANDOM_RANGE_RATIO": "0",
            "RESULT_FILENAME": "pr3097-A-dpa4-c256"
          }
        },
        {
          "name": "A â€” Validate benchmark result completeness",
          "run": "docker exec -i \\\n  -e RESULT_PATH=\"pr3097-A-dpa4-c256.json\" \\\n  pr3097-ab-${{ github.run_id }}-a python3 - <<'PY'\nimport json, os, sys\n\npath = os.environ[\"RESULT_PATH\"]\nwith open(path, encoding=\"utf-8\") as f:\n    data = json.load(f)\n\nif data.get(\"benchmark_kind\") == \"aiperf_agentic\":\n    completed = int(data.get(\"successful_requests\", 0))\n    duration = float(data.get(\"benchmark_duration_s\", 0))\n    if completed <= 0 or duration <= 0:\n        sys.exit(\"Agentic benchmark has no successful profiling requests or duration\")\n    print(f\"Validated agentic result: {completed} requests, {duration}s\")\n    sys.exit(0)\n\nnum_prompts = int(data.get(\"num_prompts\"))\ncompleted = int(data.get(\"completed\"))\nif completed != num_prompts:\n    print(\n        f\"::error::Invalid benchmark result in {path}: completed requests \"\n        f\"({completed}) did not match num_prompts ({num_prompts}).\",\n        file=sys.stderr,\n    )\n    sys.exit(1)\n\nprint(\n    f\"Validated benchmark result {path}: completed requests \"\n    f\"{completed}/{num_prompts}.\"\n)\nPY\n",
          "env": {
            "BENCH_KIND": "aiperf_agentic",
            "MODEL_PATH": "deepseek-ai/DeepSeek-V4.1-Flash",
            "ARGS": "-tp 4 --enable-dp-attention --moe-backend standard --all2all-backend none --kv_cache_dtype bf16 --index-cache-dtype fp8 --max-model-len 262144 --gpu-memory-utilization 0.75 --max-num-seqs 24 --max-num-batched-tokens 1024 --attn-prefill-chunk-size 16384 --enable_prefix_caching --block-size 16 --state-checkpoint-interval-tokens 8192 --level 3 --cudagraph-mode FULL --cudagraph-capture-sizes '[1,2,4,8,16,24]' --method dspark --num-speculative-tokens 5 --tool-call-parser dsml_v41 --dspark-config '{\"confidence_schedule\":false}' --disable-uvicorn-access-log --dp-load-balance least_requests",
            "ISL": "0",
            "OSL": "0",
            "CONC": "256",
            "RANDOM_RANGE_RATIO": "0",
            "RESULT_FILENAME": "pr3097-A-dpa4-c256"
          }
        },
        {
          "name": "A â€” Copy profiler traces",
          "if": "always() && false",
          "run": "docker cp pr3097-ab-${{ github.run_id }}-a:/app/trace ./profiler-traces 2>/dev/null || true",
          "env": {
            "BENCH_KIND": "aiperf_agentic",
            "MODEL_PATH": "deepseek-ai/DeepSeek-V4.1-Flash",
            "ARGS": "-tp 4 --enable-dp-attention --moe-backend standard --all2all-backend none --kv_cache_dtype bf16 --index-cache-dtype fp8 --max-model-len 262144 --gpu-memory-utilization 0.75 --max-num-seqs 24 --max-num-batched-tokens 1024 --attn-prefill-chunk-size 16384 --enable_prefix_caching --block-size 16 --state-checkpoint-interval-tokens 8192 --level 3 --cudagraph-mode FULL --cudagraph-capture-sizes '[1,2,4,8,16,24]' --method dspark --num-speculative-tokens 5 --tool-call-parser dsml_v41 --dspark-config '{\"confidence_schedule\":false}' --disable-uvicorn-access-log --dp-load-balance least_requests",
            "ISL": "0",
            "OSL": "0",
            "CONC": "256",
            "RANDOM_RANGE_RATIO": "0",
            "RESULT_FILENAME": "pr3097-A-dpa4-c256"
          }
        },
        {
          "name": "A â€” Upload profiler traces",
          "if": "always() && false",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "profiler-traces-pr3097-A-dpa4-c256",
            "path": "profiler-traces/"
          },
          "env": {
            "BENCH_KIND": "aiperf_agentic",
            "MODEL_PATH": "deepseek-ai/DeepSeek-V4.1-Flash",
            "ARGS": "-tp 4 --enable-dp-attention --moe-backend standard --all2all-backend none --kv_cache_dtype bf16 --index-cache-dtype fp8 --max-model-len 262144 --gpu-memory-utilization 0.75 --max-num-seqs 24 --max-num-batched-tokens 1024 --attn-prefill-chunk-size 16384 --enable_prefix_caching --block-size 16 --state-checkpoint-interval-tokens 8192 --level 3 --cudagraph-mode FULL --cudagraph-capture-sizes '[1,2,4,8,16,24]' --method dspark --num-speculative-tokens 5 --tool-call-parser dsml_v41 --dspark-config '{\"confidence_schedule\":false}' --disable-uvicorn-access-log --dp-load-balance least_requests",
            "ISL": "0",
            "OSL": "0",
            "CONC": "256",
            "RANDOM_RANGE_RATIO": "0",
            "RESULT_FILENAME": "pr3097-A-dpa4-c256"
          }
        },
        {
          "name": "A â€” Stop server and collect RTL traces",
          "if": "false",
          "run": "docker exec pr3097-ab-${{ github.run_id }}-a bash -lc \\\n  \"ENABLE_RTL_PROFILER=1 .github/scripts/atom_test.sh stop\" || true\ndocker cp pr3097-ab-${{ github.run_id }}-a:/app/rtl_traces ./rtl-traces 2>/dev/null || true\n",
          "env": {
