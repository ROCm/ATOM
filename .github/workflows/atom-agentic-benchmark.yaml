            "REQUESTED_IMAGE": "rocm/atom-dev@sha256:167ce262f6ab188cd1a971dc7ae5f3d4e50586293a2d1c53ea1efbc92ab7491d",
            "IMAGE_DISPLAY": "rocm/atom-dev@sha256:167ce262f6ab188cd1a971dc7ae5f3d4e50586293a2d1c53ea1efbc92ab7491d",
            "BENCH_KIND": "aiperf_agentic",
            "MODEL_PATH": "deepseek-ai/DeepSeek-V4.1-Flash",
            "ARGS": "-tp 4 --enable-dp-attention --moe-backend standard --all2all-backend none --kv_cache_dtype bf16 --index-cache-dtype fp8 --max-model-len 262144 --gpu-memory-utilization 0.75 --max-num-seqs 24 --max-num-batched-tokens 1024 --attn-prefill-chunk-size 16384 --enable_prefix_caching --block-size 16 --state-checkpoint-interval-tokens 8192 --level 3 --cudagraph-mode FULL --cudagraph-capture-sizes '[1,2,4,8,16,24]' --method dspark --num-speculative-tokens 5 --tool-call-parser dsml_v41 --dspark-config '{\"confidence_schedule\":false}' --disable-uvicorn-access-log --dp-load-balance least_requests",
            "ISL": "0",
            "OSL": "0",
            "CONC": "256",
            "RANDOM_RANGE_RATIO": "0",
            "RESULT_FILENAME": "pr3097-A-dpa4-c256"
          },
          "run": "set -euo pipefail\nRUNNER_HINT=\"linux-atom-pitt-mi350x-8\"\nbash .github/scripts/collect_gpu_info.sh pr3097-ab-${{ github.run_id }}-a docker \"$RUNNER_HINT\"\n# A registry's latest may have changed since startup. Use the name\n# resolved with this run's digest, never a second remote lookup.\nDOCKER_IMAGE=\"$IMAGE_DISPLAY\"\nIMAGE_ID=$(docker inspect --format '{{.Image}}' pr3097-ab-${{ github.run_id }}-a)\nEXPECTED_IMAGE_ID=$(docker image inspect --format '{{.Id}}' \"$REQUESTED_IMAGE\")\ntest \"$IMAGE_ID\" = \"$EXPECTED_IMAGE_ID\"\necho \"image_digest=${IMAGE_ID}\" >> \"$GITHUB_OUTPUT\"\necho \"docker_image=${DOCKER_IMAGE}\" >> $GITHUB_OUTPUT\necho \"Docker: ${DOCKER_IMAGE}\"\n"
        },
