# Reusable benchmark template: runs ONE (model variant × scenario) config across
# its concurrency list. The caller (atom-benchmark.yaml) matrixes over configs
# and invokes this once per config; this workflow matrixes over `concurrency`.
# Two-level fan-out keeps both matrices under GitHub's 256-job-per-matrix limit
# while every (config × conc) cell still runs as its own parallel job. Mirrors
# the scenario-sharded reusable-workflow pattern in InferenceX run-sweep.
name: Benchmark template

on:
  workflow_call:
    inputs:
      display:
        type: string
        required: true
      prefix:
        type: string
        required: true
      suffix:
        type: string
        required: false
        default: ""
      model_path:
        type: string
        required: true
      server_args:
        type: string
        required: false
        default: ""
      bench_kind:
        type: string
        default: random
      bench_args:
        type: string
        required: false
        default: ""
      env_vars:
        type: string
        required: false
        default: ""
      runner:
        type: string
        required: true
      isl:
        type: string
        required: true
      osl:
        type: string
        required: true
      ratio:
        type: string
        required: true
      ratio_str:
        type: string
        required: true
      concurrency:
        description: "JSON array of concurrency values (second-level matrix)"
        type: string
        required: true
      image:
        type: string
        required: false
        default: "rocm/atom-dev:latest"
      enable_profiler:
        type: boolean
        required: false
        default: false
      enable_rtl:
        type: boolean
        required: false
        default: false
      extra_args:
        type: string
        required: false
        default: ""
      atom_commit:
        type: string
        required: false
        default: ""
      aiter_commit:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  benchmark:
    # Nested under the caller job (which already shows model + scenario), so the
    # template only needs the distinguishing second-level dimension: concurrency.
    name: c=${{ matrix.conc }}
    strategy:
      fail-fast: false
      matrix:
        conc: ${{ fromJson(inputs.concurrency) }}

    runs-on: ${{ inputs.runner }}

    env:
      BENCH_KIND: ${{ inputs.bench_kind }}
      MODEL_PATH: ${{ inputs.model_path }}
      ARGS: ${{ inputs.server_args }}
      ISL: ${{ inputs.isl }}
      OSL: ${{ inputs.osl }}
      CONC: ${{ matrix.conc }}
      RANDOM_RANGE_RATIO: ${{ inputs.ratio }}
      RESULT_FILENAME: ${{ inputs.prefix }}${{ inputs.suffix }}-${{ inputs.isl }}-${{ inputs.osl }}-${{ matrix.conc }}-${{ inputs.ratio_str }}

    steps:
      - name: Kill all Docker containers
        run: |
          echo "=== Cleaning up containers on $(hostname) ==="
          containers=$(docker ps -q)
          if [ -n "$containers" ]; then
            docker kill $containers || true
          fi
          docker run --rm -v "${GITHUB_WORKSPACE:-$PWD}":/workspace -w /workspace \
            rocm/pytorch:latest bash -lc "ls -la /workspace/ && chmod -R u+rwX /workspace 2>/dev/null || true; find /workspace -mindepth 1 -delete" || true

      - name: Show ROCm status (host)
        run: docker ps -a && rocm-smi --showmemuse 2>/dev/null || true

      - name: Checkout ATOM repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.atom_commit || github.sha }}

      - name: Start container + download model
        uses: ./.github/actions/atom-bench-container
        with:
          image: ${{ inputs.image }}
          container-name: atom-benchmark
          model-path: ${{ inputs.model_path }}
          runner: ${{ inputs.runner }}
          env-vars: ${{ inputs.env_vars }}
          hf-token: ${{ secrets.AMD_HF_TOKEN }}
          download-required: "true"
          container-env: >-
            -e ISL=${{ env.ISL }} -e OSL=${{ env.OSL }}
            -e ATOM_BENCHMARK_CAPTURE=1 -e BENCH_KIND=${{ env.BENCH_KIND }}
            -e CONC=${{ env.CONC }} -e RANDOM_RANGE_RATIO=${{ env.RANDOM_RANGE_RATIO }}
            -e ENABLE_TORCH_PROFILER=${{ inputs.enable_profiler && '1' || '0' }}
            -e ENABLE_RTL_PROFILER=${{ inputs.enable_rtl && '1' || '0' }}

      - name: Reinstall AITER from requested ref
        if: ${{ inputs.aiter_commit != '' }}
        env:
          CONTAINER_NAME: atom-benchmark
          AITER_GIT_REF: ${{ inputs.aiter_commit }}
        run: bash .github/scripts/install_aiter_from_ref.sh

      - name: Verify checked-out ATOM code
        run: |
          docker exec -i -e EXPECTED_ATOM_SHA="$(git rev-parse HEAD)" atom-benchmark python3 - <<'PY'
          import importlib.util
          import os
          import subprocess
          from pathlib import Path

          source = Path(importlib.util.find_spec("atom").origin).resolve().parent
          expected_source = Path("/workspace/atom").resolve()
          if source != expected_source:
              raise SystemExit(f"ATOM imports from {source}, expected {expected_source}")
          sha = subprocess.check_output(
              ["git", "-c", "safe.directory=/workspace", "-C", "/workspace", "rev-parse", "HEAD"],
              text=True,
          ).strip()
          if sha != os.environ["EXPECTED_ATOM_SHA"]:
              raise SystemExit(f"Checkout SHA mismatch: {sha}")
          print(f"Executing ATOM checkout {sha} from {source}; image supplies the runtime.")
          PY

      - name: Collect GPU info (inside container)
        id: gpu-info
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          RUNNER_HINT="${{ inputs.runner }}"
          bash .github/scripts/collect_gpu_info.sh atom-benchmark docker "$RUNNER_HINT"
          # Resolve latest → nightly_YYYYMMDDHHMMSS for dashboard display
          DOCKER_IMAGE="${{ inputs.image }}"
          if [ "$DOCKER_IMAGE" = "rocm/atom-dev:latest" ]; then
            RESOLVED_IMAGE=""
            if RESOLUTION_JSON="$(python3 .github/scripts/resolve_atom_image.py --repository rocm/atom-dev --reference-tag latest --image-family native 2>/dev/null)"; then
              RESOLVED_IMAGE="$(echo "$RESOLUTION_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("resolved_image",""))')" || true
            fi
            DOCKER_IMAGE="${RESOLVED_IMAGE:-$DOCKER_IMAGE}"
          fi
          IMAGE_ID=$(docker inspect --format '{{.Image}}' atom-benchmark)
          echo "image_digest=${IMAGE_ID}" >> "$GITHUB_OUTPUT"
          echo "docker_image=${DOCKER_IMAGE}" >> $GITHUB_OUTPUT
          echo "Docker: ${DOCKER_IMAGE}"

      - name: Run benchmark
        timeout-minutes: ${{ inputs.bench_kind == 'aiperf_agentic' && 180 || 80 }}
        env:
          EXTRA_LAUNCH_ARGS: ${{ inputs.extra_args }}
          BENCH_EXTRA_ARGS: ${{ inputs.bench_args }}
          GPU_NAME: ${{ steps.gpu-info.outputs.gpu_name }}
          ROCM_VERSION: ${{ steps.gpu-info.outputs.rocm_version }}
          DOCKER_IMAGE: ${{ steps.gpu-info.outputs.docker_image }}
          ATOM_IMAGE_DIGEST: ${{ steps.gpu-info.outputs.image_digest }}
        run: |
          set -euo pipefail
          if [ -n "${MODEL_HOST_ROOT:-}" ]; then model_path="/models/${{ env.MODEL_PATH }}"
          else model_path="${{ env.MODEL_PATH }}"; fi

          # Launch via stdin so the container's bash parses the shell quoting in
          # ARGS exactly once -- single-quoted JSON values survive intact (e.g.
          # --hf-overrides '{"use_index_cache": true, "index_topk_freq": 4}').
          # Substituting ${{ env.ARGS }} into a `bash -lc "..."` string instead
          # collides the JSON's double quotes with the outer quotes and strips
          # them (argparse: invalid loads value). Mirrors atom-test.yaml.
          echo "ENABLE_TORCH_PROFILER=${{ inputs.enable_profiler && '1' || '0' }} \
            ENABLE_RTL_PROFILER=${{ inputs.enable_rtl && '1' || '0' }} \
            .github/scripts/atom_test.sh launch $model_path $ARGS $EXTRA_LAUNCH_ARGS" \
            | docker exec -i atom-benchmark bash -l

          echo "========== Running benchmark =========="
          docker exec \
            -e ENABLE_TORCH_PROFILER="${{ inputs.enable_profiler && '1' || '0' }}" \
            -e RESULT_FILENAME="${{ env.RESULT_FILENAME }}" \
            -e SERVER_ARGS="$ARGS $EXTRA_LAUNCH_ARGS" \
            -e BENCH_EXTRA_ARGS -e BENCH_KIND \
            -e GPU_NAME -e ROCM_VERSION \
            -e DOCKER_IMAGE -e ATOM_IMAGE_DIGEST \
            -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            -e GITHUB_JOB -e GITHUB_SHA -e GITHUB_WORKFLOW_REF \
            -e MP="$model_path" \
            atom-benchmark bash -lc '.github/scripts/atom_test.sh benchmark "$MP"'

      - name: Dump server log
        if: always()
        run: |
          docker exec atom-benchmark cat /tmp/atom_server.log 2>/dev/null || true

      - name: Dump client log
        if: always()
        run: |
          docker exec atom-benchmark cat /tmp/atom_client.log 2>/dev/null || true

      - name: Inject GPU metadata into benchmark result
        run: |
          docker exec \
            -e GPU_NAME="${{ steps.gpu-info.outputs.gpu_name }}" \
            -e GPU_VRAM_GB="${{ steps.gpu-info.outputs.gpu_vram_gb }}" \
            -e ROCM_VERSION="${{ steps.gpu-info.outputs.rocm_version }}" \
            -e DOCKER_IMAGE="${{ steps.gpu-info.outputs.docker_image }}" \
            -e RESULT_PATH="${{ env.RESULT_FILENAME }}.json" \
            -e DISPLAY_NAME="${{ inputs.display }}" \
            atom-benchmark python3 -c "
          import json, os
          p = os.environ['RESULT_PATH']
          if not os.path.exists(p):
              print(f'{p} not found, skipping GPU metadata injection')
          else:
              with open(p) as f:
                  d = json.load(f)
              d['gpu_name'] = os.environ.get('GPU_NAME', '')
              d['gpu_vram_gb'] = int(os.environ.get('GPU_VRAM_GB') or 0)
              d['rocm_version'] = os.environ.get('ROCM_VERSION', '')
              d['docker_image'] = os.environ.get('DOCKER_IMAGE', '')
              display_name = os.environ.get('DISPLAY_NAME', '')
              if display_name:
                  d['benchmark_model_name'] = display_name
              with open(p, 'w') as f:
                  json.dump(d, f, indent=2)
          "

      - name: Validate benchmark result completeness
        run: |
          docker exec -i \
            -e RESULT_PATH="${{ env.RESULT_FILENAME }}.json" \
            atom-benchmark python3 - <<'PY'
          import json, os, sys

          path = os.environ["RESULT_PATH"]
          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          if data.get("benchmark_kind") == "aiperf_agentic":
              completed = int(data.get("successful_requests", 0))
              duration = float(data.get("benchmark_duration_s", 0))
              if completed <= 0 or duration <= 0:
                  sys.exit("Agentic benchmark has no successful profiling requests or duration")
              print(f"Validated agentic result: {completed} requests, {duration}s")
              sys.exit(0)

          num_prompts = int(data.get("num_prompts"))
          completed = int(data.get("completed"))
          if completed != num_prompts:
              print(
                  f"::error::Invalid benchmark result in {path}: completed requests "
                  f"({completed}) did not match num_prompts ({num_prompts}).",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(
              f"Validated benchmark result {path}: completed requests "
              f"{completed}/{num_prompts}."
          )
          PY

      - name: Copy profiler traces
        if: inputs.enable_profiler
        run: docker cp atom-benchmark:/app/trace ./profiler-traces 2>/dev/null || true

      - name: Upload profiler traces
        if: inputs.enable_profiler
        uses: actions/upload-artifact@v7
        with:
          name: profiler-traces-${{ env.RESULT_FILENAME }}
          path: profiler-traces/

      - name: Stop server and collect RTL traces
        if: inputs.enable_rtl
        run: |
          docker exec atom-benchmark bash -lc \
            "ENABLE_RTL_PROFILER=1 .github/scripts/atom_test.sh stop" || true
          docker cp atom-benchmark:/app/rtl_traces ./rtl-traces 2>/dev/null || true

      - name: Upload RTL traces
        if: inputs.enable_rtl
        uses: actions/upload-artifact@v7
        with:
          name: rtl-traces-${{ env.RESULT_FILENAME }}
          path: rtl-traces/

      - name: Upload benchmark result
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ env.RESULT_FILENAME }}
          path: ${{ env.RESULT_FILENAME }}.json

      # The container binds the checkout at /workspace. Upload before cleanup,
      # even after benchmark/validation failure. Each completed cell is usable
      # immediately; the optional run index is not a prerequisite.
      - name: Prepare bundle summary
        if: always()
        run: |
          python3 -m atom.benchmarks.results summary-package \
            "benchmark-bundles/$RESULT_FILENAME" --output "bundle-summaries/$RESULT_FILENAME"

      - name: Upload versioned summary
        id: bundle-summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atom-benchmark-summary-v1-${{ github.run_attempt }}-${{ env.RESULT_FILENAME }}
          path: bundle-summaries/${{ env.RESULT_FILENAME }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload complete bundle
        id: bundle-full
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atom-benchmark-bundle-v1-${{ github.run_attempt }}-${{ env.RESULT_FILENAME }}
          path: benchmark-bundles/${{ env.RESULT_FILENAME }}/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      - name: Save logs after launch or packaging failure
        if: failure() || cancelled()
        run: |
          docker exec -e EVIDENCE="/workspace/benchmark-evidence/$RESULT_FILENAME" \
            atom-benchmark bash -lc '
              mkdir -p "$EVIDENCE"
              for file in /tmp/atom_server.log /tmp/atom_client.log /tmp/atom-benchmark-launch.json; do
                if [ -f "$file" ]; then cp "$file" "$EVIDENCE/"; fi
              done
            ' || true

      - name: Preserve unpackaged failure evidence
        id: bundle-diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: atom-benchmark-diagnostics-v1-${{ github.run_attempt }}-${{ env.RESULT_FILENAME }}
          path: benchmark-evidence/${{ env.RESULT_FILENAME }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Link agentic point artifacts
        if: always() && inputs.bench_kind == 'aiperf_agentic'
        uses: actions/github-script@v7
        env:
          POINT_DISPLAY: ${{ inputs.display }}
          POINT_STATUS: ${{ job.status }}
          SUMMARY_URL: ${{ steps.bundle-summary.outputs.artifact-url }}
          BUNDLE_URL: ${{ steps.bundle-full.outputs.artifact-url }}
          DIAGNOSTICS_URL: ${{ steps.bundle-diagnostics.outputs.artifact-url }}
        with:
          script: |
            const escape = value => String(value).replace(/[&<>"']/g, char =>
              ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[char]));
            core.summary.addHeading(escape(`${process.env.POINT_DISPLAY} · c=${process.env.CONC}`));
            core.summary.addRaw(`Status before cleanup: ${escape(process.env.POINT_STATUS)}\n\n`);
            for (const [label, url] of [
              ['Summary bundle', process.env.SUMMARY_URL],
              ['Full bundle', process.env.BUNDLE_URL],
              ['Failure diagnostics', process.env.DIAGNOSTICS_URL],
            ]) {
              if (url) core.summary.addLink(label, url).addBreak();
            }
            core.summary.addRaw('\nA full-bundle upload may contain partial evidence after failure; check its manifest status.\n');
            await core.summary.write();

      - name: Clean Up
        if: always()
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE:-$PWD}":/workspace -w /workspace \
            ${{ inputs.image }} bash -lc "chmod -R u+rwX /workspace/atom /workspace/aiter /workspace/bench_serving 2>/dev/null || true; rm -rf /workspace/atom/ /workspace/aiter/ /workspace/bench_serving/" || true
          docker stop atom-benchmark || true
          docker rm atom-benchmark || true
