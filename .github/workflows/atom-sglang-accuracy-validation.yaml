name: ATOM SGLang Accuracy Validation

on:
  schedule:
    # Nightly at 00:00 Beijing time (16:00 UTC on the previous day)
    - cron: '0 16 * * *'
  workflow_dispatch:
    # Manual runs use GitHub Actions' built-in branch dropdown ("Use workflow
    # from") as the ATOM branch selector, so users do not need to type branch
    # names.
    inputs:
      model_mi355:
        description: "Manual MI355 accuracy model selection"
        required: false
        type: choice
        default: none
        options:
          - none
          - all
          - DeepSeek-V4-Pro Prefix Cache TP8
          - DeepSeek-V3.2-FP8 TP4
          - Kimi-K2.6-MXFP4 TP4
          - Kimi-K2.6-MXFP4 TP8
          - Kimi-K3 TP8
          - MiniMax-M3-MXFP4 TP4
          - MiniMax-M3-MXFP8 EAGLE3 TP4 MTP3
          - Qwen3.5-35B-A3B-FP8 TP2
          - Qwen3.5-35B-A3B TP2
          - GLM-5.2-FP8 TP4
          - GLM-5.2-MXFP4 TP4
      model_mi308:
        description: "Manual MI308 accuracy model selection"
        required: false
        type: choice
        default: none
        options:
          - none
          - all
          - MI308 Qwen3.5-397B-A17B-FP8 TP4
          - MI308 Qwen3.5-397B-A17B-FP8 TP8
          - MI308 Qwen3.5-35B-A3B-FP8 TP1
          - MI308 Qwen3.5-35B-A3B-PTPC-FP8 TP1
          - MI308 Qwen3.8-Flash-Next-FP8 TP2
          - MI308 DeepSeek-V4-Flash
      rebuild_atom_base_from_dockerfile:
        description: "Full build image before validation"
        required: false
        type: boolean
        default: false
      docker_image:
        description: "Optional Docker image override."
        required: false
        type: string
        default: ""
      upload_accuracy_to_dashboard:
        description: "Optional: upload SGLANG accuracy results to dashboard after this manual run"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ATOM_BASE_NIGHTLY_IMAGE: rocm/atom-dev:latest
  NIGHTLY_SGLANG_IMAGE_TAG: rocm/atom-dev:sglang-latest
  VALIDATION_IMAGE_REPO: rocm/atom-dev
  GPU_ARCH: "gfx942;gfx950"
  AITER_REPO: "https://github.com/ROCm/aiter.git"
  AITER_COMMIT: "HEAD"

jobs:
  # ---------- SGLANG full validation path (schedule / workflow_dispatch) ----------
  prepare-sglang-image:
    name: Prepare SGLANG validation image
    runs-on: build-only-atom
    outputs:
      sglang_image_tag: ${{ steps.meta.outputs.sglang_image_tag }}
      cleanup_temp_image: ${{ steps.meta.outputs.cleanup_temp_image }}
      model_matrix: ${{ steps.meta.outputs.model_matrix }}
      model_matrix_mi355: ${{ steps.meta.outputs.model_matrix_mi355 }}
      model_matrix_mi308: ${{ steps.meta.outputs.model_matrix_mi308 }}
      has_model_cells_mi355: ${{ steps.meta.outputs.has_model_cells_mi355 }}
      has_model_cells_mi308: ${{ steps.meta.outputs.has_model_cells_mi308 }}
    steps:
      - name: Checkout selected ATOM branch
        uses: actions/checkout@v6

      - name: Resolve SGLang version metadata
        run: python3 .github/scripts/resolve_sglang_metadata.py

      - name: Docker Login
        if: ${{ github.event_name == 'workflow_dispatch' && (github.ref_name != 'main' || inputs.rebuild_atom_base_from_dockerfile) }}
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Resolve image source and model matrix
        id: meta
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          MODEL_MI355: ${{ inputs.model_mi355 || 'none' }}
          MODEL_MI308: ${{ inputs.model_mi308 || 'none' }}
          REBUILD_ATOM_BASE_FROM_DOCKERFILE: ${{ inputs.rebuild_atom_base_from_dockerfile }}
          INPUT_DOCKER_IMAGE: ${{ inputs.docker_image || '' }}
        run: |
          set -euo pipefail

          # Keep this Python model list as the single source of truth for SGLANG
          # full-validation coverage and manual dropdown filtering.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import sys

          event = os.environ["GITHUB_EVENT_NAME"]
          model_mi355 = os.environ.get("MODEL_MI355", "none")
          model_mi308 = os.environ.get("MODEL_MI308", "none")
          models = [
              {
                  "toggle_env": "RUN_DSV4_TP8",
                  "model_name": "DeepSeek-V4-Pro TP8",
                  "model_path": "deepseek-ai/DeepSeek-V4-Pro",
                  "extra_args": "--trust-remote-code --tensor-parallel-size 8 --kv-cache-dtype fp8_e4m3 --mem-fraction-static 0.9 --swa-full-tokens-ratio 0.1 --max-running-requests 256 --page-size 256 --disable-radix-cache --disable-shared-experts-fusion --tool-call-parser deepseekv4 --reasoning-parser deepseek-v4",
                  "lm_eval_num_fewshot": 5,
                  "lm_eval_num_concurrent": 8,
                  "accuracy_test_threshold": 0.94,
                  "env_vars": "SGLANG_DEFAULT_SERVER_ARGS=\nAITER_BF16_FP8_MOE_BOUND=0\nATOM_MOE_GU_ITLV=1\nSGLANG_DEFAULT_THINKING=1\nSGLANG_DSV4_REASONING_EFFORT=max\nSGLANG_USE_AITER=1\nSGLANG_DSV4_FP4_EXPERTS=true\nSGLANG_EXTERNAL_MODEL_PACKAGE=atom.plugin.sglang.models\nTORCHINDUCTOR_COMPILE_THREADS=128",
                  "runner": "linux-atom-pitt-mi350x-8",
              },
              {
                  "toggle_env": "RUN_DSV4_MTP3_TP8",
                  "model_name": "DeepSeek-V4-Pro MTP3 TP8",
                  "model_path": "deepseek-ai/DeepSeek-V4-Pro",
                  "extra_args": "--trust-remote-code --tensor-parallel-size 8 --kv-cache-dtype fp8_e4m3 --mem-fraction-static 0.9 --swa-full-tokens-ratio 0.1 --max-running-requests 256 --page-size 256 --disable-radix-cache --disable-shared-experts-fusion --tool-call-parser deepseekv4 --reasoning-parser deepseek-v4 --speculative-algorithm EAGLE --speculative-num-steps 3 --speculative-eagle-topk 1 --speculative-num-draft-tokens 4",
                  "lm_eval_num_fewshot": 5,
                  "lm_eval_num_concurrent": 8,
                  "accuracy_test_threshold": 0.94,
                  "mtp_accept_threshold": 0.55,
                  "env_vars": "SGLANG_DEFAULT_SERVER_ARGS=\nAITER_BF16_FP8_MOE_BOUND=0\nATOM_MOE_GU_ITLV=1\nSGLANG_DEFAULT_THINKING=1\nSGLANG_DSV4_REASONING_EFFORT=max\nSGLANG_USE_AITER=1\nSGLANG_DSV4_FP4_EXPERTS=true\nAITER_DISABLE_COMM_FUSED_MOE=1\nSGLANG_EXTERNAL_MODEL_PACKAGE=atom.plugin.sglang.models\nTORCHINDUCTOR_COMPILE_THREADS=128\nATOM_USE_TRITON_MOE=0\nATOM_SGLANG_V4_DISABLE_PRO_DRAFT_TRITON_MOE=1\nATOM_SGLANG_V4_ENABLE_DRAFT_EXTEND_CG=1",
