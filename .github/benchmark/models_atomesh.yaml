defaults:
  runner:
    slurm_account: "${ATOMESH_SLURM_ACCOUNT}"
    slurm_partition: "${ATOMESH_SLURM_PARTITION}"
    slurm_submit_runner: "${ATOMESH_SLURM_SUBMIT_RUNNER}"
    gpus_per_node: 8
    cpus_per_task: 114
    time_limit: "08:00:00"
    log_root: "${ATOMESH_LOG_ROOT}"
  benchmark:
    random_range_ratio: 0.8
    request_rate: inf
    num_prompts_multiplier: 10
    wait_server_timeout: 5000
    wait_router_timeout: 300
  env:
    common:
      PYTHONUNBUFFERED: "1"
      ATOM_PD_RANK_MAPPING_POLICY: "${ATOMESH_PD_RANK_MAPPING_POLICY}"

backends:
  atom:
    image: rocm/atom-dev:latest
    server_script: .github/scripts/atomesh/pd_server_atom.sh
    env:
      common:
        AITER_LOG_LEVEL: WARNING
      prefill:
        ATOM_HOST_IP: "${ROLE_IP}"
      decode:
        ATOM_HOST_IP: "${ROLE_IP}"
    service:
      prefill:
        port: 8010
        tp: 8
      decode:
        port: 8020
        tp: 8
        cudagraph: >-
          [1,2,4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,96,100,104,108,112,116,120,124,128,132,136,140,144,148,152,156,160,164,168,172,176,180,184,188,192,196,200,204,208,212,216,220,224,228,232,236,240,244,248,252,256]
      router:
        port: 8000
        policy: random
        prometheus_port: 29100

models:
  DeepSeek-V4-Pro:
    backend: atom
    model_path: "${ATOMESH_MODEL_ROOT}/deepseek-ai/DeepSeek-V4-Pro/"
    precision: FP4
    env:
      common:
        AITER_BF16_FP8_MOE_BOUND: "0"
        ATOM_MOE_GU_ITLV: "1"
        MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
      prefill: {}
      decode: {}
    server:
      common_args:
        trust_remote_code: true
        kv_cache_dtype: fp8
        block_size: 16
        enable_prefix_caching: false
        gpu_memory_utilization: 0.85
        max_num_seqs: 512
        extra_args: ""
    suites:
      smoke:
        - name: ds-v4-1p1d-tp8-smoke
          topology: 1p1d
          pd_worker_layout: multi_node
          nodes: "${ATOMESH_1P1D_NODES}"
          isl: [8192]
          osl: 1024
          concurrency: [4, 8]
          run_eval: true
          eval_limit: 64

      nightly:
        - name: ds-v4-1p1d-tp8
          topology: 1p1d
          pd_worker_layout: multi_node
          nodes: "${ATOMESH_1P1D_NODES}"
          isl: [8192]
          osl: 1024
          concurrency: [1, 2, 4, 8, 16, 32, 64, 128]
          run_eval: true

        - name: ds-v4-1p1d-dpa-tp8
          topology: 1p1d_dpa
          pd_worker_layout: multi_node
          nodes: "${ATOMESH_1P1D_NODES}"
          env:
            prefill:
              GPU_MAX_HW_QUEUES: "5"
              ATOM_NUMA_BIND: "1"         
          isl: [8192]
          osl: 1024
          concurrency: [256, 512]
          prefill:
            workers: 1
            tp: 8
            extra_args: "--enable-dp-attention --enable-tbo"
          decode:
            workers: 1
            tp: 8
            extra_args: "--enable-dp-attention"
          benchmark:
            wait_server_timeout: 4500

        - name: ds-v4-1p1d-tp8-mtp3
          topology: 1p1d_mtp3
          pd_worker_layout: multi_node
          nodes: "${ATOMESH_1P1D_NODES}"
          isl: [8192]
          osl: 1024
          concurrency: [1, 2, 4, 8, 16, 32, 64, 128]
          prefill:
            workers: 1
            tp: 8
            extra_args: "--method mtp --num-speculative-tokens 3"
          decode:
            workers: 1
            tp: 8
            extra_args: "--method mtp --num-speculative-tokens 3"
          benchmark:
            wait_server_timeout: 4500
          run_eval: true

        - name: ds-v4-1p1d-dpa-tp8-mtp1
          topology: 1p1d_dpa_mtp1
          pd_worker_layout: multi_node
          nodes: "${ATOMESH_1P1D_NODES}"
          env:
            prefill:
              GPU_MAX_HW_QUEUES: "5"
              ATOM_NUMA_BIND: "1"
          isl: [8192]
          osl: 1024
          concurrency: [256, 512]
          prefill:
            workers: 1
            tp: 8
            extra_args: "--method mtp --num-speculative-tokens 1 --enable-dp-attention --enable-tbo"
          decode:
            workers: 1
            tp: 8
            extra_args: "--method mtp --num-speculative-tokens 1 --enable-dp-attention"
          benchmark:
            wait_server_timeout: 4500

        - name: ds-v4-2p1d-tp8
          topology: 2p1d
          pd_worker_layout: multi_node
          nodes: "${ATOMESH_2P1D_NODES}"
          isl: [8192]
          osl: 1024
          concurrency: [128, 256]
          prefill:
            workers: 2
            tp: 8
          decode:
            workers: 1
            tp: 8
          benchmark:
            wait_server_timeout: 4500
          run_eval: true
          eval_concurrency: [128]

        - name: ds-v4-2p1d-dpa-tp8
          topology: 2p1d_dpa
          pd_worker_layout: multi_node
          nodes: "${ATOMESH_2P1D_NODES}"
          env:
            prefill:
              GPU_MAX_HW_QUEUES: "5"
              ATOM_NUMA_BIND: "1"
          isl: [8192]
          osl: 1024
          concurrency: [256, 512, 768, 1024]
          prefill:
            workers: 2
            tp: 8
            extra_args: "--enable-dp-attention --enable-tbo"
          decode:
            workers: 1
            tp: 8
            extra_args: "--enable-dp-attention"
          server:
            common_args:
              decode_max_num_seqs: 1024
          benchmark:
            wait_server_timeout: 4500
          run_eval: true
          eval_concurrency: [128, 768]

        - name: ds-v4-2p1d-tp8-mtp3
          topology: 2p1d_mtp3
          pd_worker_layout: multi_node
          nodes: "${ATOMESH_2P1D_NODES}"
          isl: [8192]
          osl: 1024
          concurrency: [128, 256]
          prefill:
            workers: 2
            tp: 8
            extra_args: "--method mtp --num-speculative-tokens 3"
          decode:
            workers: 1
            tp: 8
            extra_args: "--method mtp --num-speculative-tokens 3"
          benchmark:
            wait_server_timeout: 4500
          run_eval: true
          eval_concurrency: [128]

        - name: ds-v4-2p1d-dpa-tp8-mtp1
          topology: 2p1d_dpa_mtp1
          pd_worker_layout: multi_node
          nodes: "${ATOMESH_2P1D_NODES}"
          env:
            prefill:
              GPU_MAX_HW_QUEUES: "5"
              ATOM_NUMA_BIND: "1"
          isl: [8192]
          osl: 1024
          concurrency: [256, 512]
          prefill:
            workers: 2
            tp: 8
            extra_args: "--method mtp --num-speculative-tokens 1 --enable-dp-attention --enable-tbo"
          decode:
            workers: 1
            tp: 8
            extra_args: "--method mtp --num-speculative-tokens 1 --enable-dp-attention"
          benchmark:
            wait_server_timeout: 4500
          run_eval: true
          eval_concurrency: [128, 512]

    accuracy:
      task: gsm8k
      fewshot: 3
      limit: null

  GLM-5.2-MXFP4:
    backend: atom
    model_path: "${ATOMESH_MODEL_ROOT}/amd/GLM-5.2-MXFP4"
    precision: MXFP4
    env:
      common:
        AITER_QUICK_REDUCE_QUANTIZATION: INT4
        AITER_USE_FLYDSL_MOE_SORTING: "1"
        MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
      prefill: {}
      decode: {}
    env_by_runner:
      # Spur MI350X hosts have 1007 GiB per NUMA node and GPUs 0-3 all sit on
      # NUMA0. Measured MoE staging is ~80-96 GiB/rank (~360 GiB for cpp4), so
      # suites' 256 and the earlier 210 GiB/rank LMCache caps still overflow
      # NUMA0 (4*212 + 360 > 1007). Cap at 160 GiB/rank (~647 GiB LMCache +
      # staging fits with headroom).
      atomesh-cicd-mi350:
        prefill:
          LMCACHE_MAX_LOCAL_CPU_SIZE: "160"
    service:
      prefill:
        cudagraph_mode: FULL
      decode:
        cudagraph_mode: FULL
    server:
      common_args:
        trust_remote_code: true
        kv_cache_dtype: fp8
        enable_prefix_caching: false
        gpu_memory_utilization: 0.8
        max_num_batched_tokens: 16384
        max_model_len: 16384
        extra_args: '--default-chat-template-kwargs {"enable_thinking":false}'
    suites:
      nightly:
        - name: glm-52-mxfp4-1p1d-tp4
          topology: 1p1d
          pd_worker_layout: single_node
          nodes: "${ATOMESH_1P1D_NODES}"
          isl: [8192]
          osl: 1024
          concurrency: [1, 2, 4, 8, 16, 32, 64, 128, 256]
          prefill:
            workers: 1
            tp: 4
          decode:
            workers: 1
            tp: 4
          env:
            common:
              # Force RDMA to avoid HIP IPC shared-pool address corruption.
              MC_DISABLE_HIP: "1"
            prefill:
              HIP_VISIBLE_DEVICES: "0,1,2,3"
            decode: &glm52_agentic_lmcache_cpp4_dcp4_env_decode
              HIP_VISIBLE_DEVICES: "4,5,6,7"
              DECODE_KV_TRANSFER_CONFIG: >-
                {"kv_role":"kv_consumer","kv_connector":"mooncake","proxy_ip":"${ROLE_IP}","handshake_port":6301,"ib_enable_alternate_hca":true,"ib_hca_count":8}
          benchmark:
            wait_server_timeout: 1800
          run_eval: true
          eval_concurrency: [65]

        - name: glm-52-mxfp4-1p1d-tp8
          topology: 1p1d
          pd_worker_layout: multi_node
          nodes: "${ATOMESH_1P1D_NODES}"
          isl: [8192]
          osl: 1024
          concurrency: [1, 2, 4, 8, 16, 32, 64, 128, 256]
          prefill:
            workers: 1
            tp: 8
          decode:
            workers: 1
            tp: 8
          benchmark:
            wait_server_timeout: 1800
          run_eval: true
          eval_concurrency: [65]

        # Keep each AgentX concurrency in its own job so every measurement starts
        # from a fresh ATOM service instead of inheriting HBM prefix-cache state.

        # 1) CPP4 prefill (PP4 x TP1) paired with TP4+DCP4 decode on one node.
        #    MTP3 with fixed acceptance length 2.99 (standalone DCP recipe at C48).
        - &glm52_agentic_lmcache_cpp4_dcp4
          <<: &glm52_agentic_tp4_tp4
            topology: 1p1d
            pd_worker_layout: single_node
            nodes: "${ATOMESH_1P1D_NODES}"
            isl: [1048576]
            osl: 1024
            server:
              common_args: &glm52_agentic_args
                kv_cache_dtype: fp8
                block_size: 16
                gpu_memory_utilization: 0.95
                max_model_len: ""
                max_num_seqs: 512
                enable_prefix_caching: true
                decode_max_num_seqs: 512
                max_num_batched_tokens: 16384
                decode_max_num_batched_tokens: 16384
                online_quant_config: '{"global_quant_config":"ptpc_fp8","exclude_layer":["lm_head","model.embed_tokens","*.mlp.gate","*expert*"]}'
                extra_args: "--method mtp --num-speculative-tokens 5 --spec-decode-acceptance-length 3.61"
            prefill: &glm52_agentic_tp4_worker
              workers: 1
              tp: 4
              cudagraph: "[1,2]"
            decode: *glm52_agentic_tp4_worker
            env:
              common:
                MC_DISABLE_HIP: "1"
                PYTHONNOUSERSITE: "1"
                PYTHONHASHSEED: "0"
              prefill:
                HIP_VISIBLE_DEVICES: "0,1,2,3"
              decode:
                HIP_VISIBLE_DEVICES: "4,5,6,7"
            benchmark: &agentic_1m_aiperf
              kind: aiperf_agentic
              scenario: agentx
              public_dataset: semianalysis_cc_traces_weka_062126
              apply_chat_template: true
              max_context_length: 1048576
              num_dataset_entries: 393
              benchmark_duration: 3600
              warmup_requests_per_lane: 10
              trace_idle_gap_cap_seconds: 300
              warmup_grace_period: 1800
              trajectory_start_min_ratio: 0.25
              trajectory_start_max_ratio: 0.75
              failed_request_threshold: 0.10
              slice_duration: 1.0
              cancel_drain_timeout: 300
              http_tcp_user_timeout: 900000
              dataset_configuration_timeout: 1800
              service_profile_configure_timeout: 1800
              wait_server_timeout: 4500
              wait_router_timeout: 600
            run_eval: false
          name: glm-52-mxfp4-1p1d-cpp4-dcp4-agentic-lmcache-1m-c48
          topology: 1p1d_cpp4_dcp4
          pd_worker_layout: single_node
          concurrency: [48]
          server:
            common_args: &glm52_agentic_lmcache_cpp4_dcp4_args
              kv_cache_dtype: fp8
              block_size: 16
              max_num_seqs: 512
              enable_prefix_caching: true
              decode_max_num_seqs: 512
              max_model_len: ""
              max_num_batched_tokens: ""
              decode_max_num_batched_tokens: ""
              online_quant_config: '{"global_quant_config":"ptpc_fp8","exclude_layer":["lm_head","model.embed_tokens","*.mlp.gate","model.layers.[0-9].mlp.*expert*","model.layers.[1-6][0-9].mlp.*expert*","model.layers.7[0-7].mlp.*expert*","model.layers.78.*"]}'
              gpu_memory_utilization: 0.85
              extra_args: "--level 3 --method mtp --num-speculative-tokens 3 --spec-decode-acceptance-length 2.99"
          prefill:
            workers: 1
            tp: 1
            cudagraph: none
            # uvicorn's 5 s keep-alive default is shorter than the router's
            # 50 s pool idle timeout; a request sent on a socket the server just
            # closed makes the router retry P+D and orphans the first KV.
            extra_args: "--pipeline-parallel-size 4 --enforce-eager --max-num-batched-tokens 8192 --timeout-keep-alive 900"
          decode:
            workers: 1
            tp: 4
            cudagraph: >-
              [1,2,4,8,16,24,32,40,48,56,64,72,80,88,96,104,112,120,128,136,144,152,160,168,176,184,192,200,208,216,224,232,240,248,256]
            # Decode memory bundle (with AITER_REUSE_IDENTICAL_COMM_GROUPS=1
            # below): about 28% more decode KV blocks. The retained prefix pool
            # keeps P->D re-pulls down, and decode KV caps the request rate
            # once prefill keeps up. MTP decode batches stay far below 2048
            # tokens.
            extra_args: "--decode-context-parallel-size 4 --cudagraph-mode FULL --gpu-memory-utilization 0.94 --max-num-batched-tokens 2048 --timeout-keep-alive 900"
          env:
            common: &glm52_agentic_lmcache_cpp4_dcp4_env_common
              MC_DISABLE_HIP: "1"
              ATOM_MLA_PAGE_SIZE: "1"
              ATOM_ONLINE_QUANT_STREAMING: "0"
              ATOM_SPARSE_INDEXER_LOGITS_BUDGET_MB: "2047"
              ATOM_USE_TRITON_MLA: "0"
              MAX_JOBS: "16"
              PYTHONHASHSEED: "0"
              TOPK_FORCE_PATH: "one"
            prefill: &glm52_agentic_lmcache_cpp4_dcp4_env_prefill
              HIP_VISIBLE_DEVICES: "0,1,2,3"
              VLLM_PP_LAYER_PARTITION: "20,20,20,18"
              LMCACHE_LOCAL_CPU: "True"
              LMCACHE_NUMA_MODE: "auto"
              LMCACHE_MAX_LOCAL_CPU_SIZE: "256"
              LMCACHE_CHUNK_SIZE: "256"
              # Every PP stage runs a lookup server so each stage refreshes its
              # own LRU; with only stage 0 looking up, stages 1-3 evict FIFO
              # and loads fail all-or-nothing once the CPU tier is full.
              LMCACHE_LOOKUP_SERVER_WORKER_IDS: "0,1,2,3"
              OFFLOAD_PROFILE: "1"
              OFFLOAD_MIN_LOAD_TOKENS: "0"
              PREFILL_KV_TRANSFER_CONFIG: >-
                {"kv_connector":"multi","connectors":[{"kv_connector":"mooncake","kv_role":"kv_producer","proxy_ip":"${ROLE_IP}","handshake_port":${HANDSHAKE_PORT},"protocol":"rdma"},{"kv_connector":"lmcache_offload","kv_role":"offload"}]}
            decode: &glm52_cpp4_dcp4_lmcache_decode_env
              <<: &glm52_cpp4_dcp4_decode_env
                HIP_VISIBLE_DEVICES: "4,5,6,7"
                # Ranks share identical communicator groups instead of creating
                # duplicates, freeing decode memory for KV.
                AITER_REUSE_IDENTICAL_COMM_GROUPS: "1"
                DECODE_KV_TRANSFER_CONFIG: >-
                  {"kv_connector":"mooncake","kv_role":"kv_consumer","proxy_ip":"${ROLE_IP}","handshake_port":${HANDSHAKE_PORT},"protocol":"rdma"}
              # Decode GPUs 4-7 sit on other rails than prefill GPUs 0-3, and
              # Spur MI350X rails do not route to each other (QP->RTR times
              # out). Registering decode memory on every HCA lets
              # MC_ENABLE_DEST_DEVICE_AFFINITY pick the prefill GPU's rail.
              DECODE_KV_TRANSFER_CONFIG: >-
                {"kv_connector":"mooncake","kv_role":"kv_consumer","proxy_ip":"${ROLE_IP}","handshake_port":${HANDSHAKE_PORT},"protocol":"rdma","ib_enable_alternate_hca":true,"ib_hca_count":8}
          env_by_runner:
            # MI350X ionic NICs: under DCP4 load (every request fans out to
            # all 4 decode ranks) Mooncake's default transport settings hit
            # "ionic_comp_msn: wqe is not posted" after ~20 requests and then
            # spin on CQ poll errors, flooding the log. One QP per endpoint
            # alone does not avoid it; with a single worker per context, a
            # smaller WR depth and no relaxed ordering it does not occur.
            # Both sides must use the same QP count to connect.
            atomesh-cicd-mi350:
              common:
                MC_NUM_QP_PER_EP: "1"
                MC_WORKERS_PER_CTX: "1"
                MC_MAX_WR: "64"
                MC_IB_PCI_RELAXED_ORDERING: "0"

        - <<: *glm52_agentic_lmcache_cpp4_dcp4
          name: glm-52-mxfp4-1p1d-cpp4-dcp4-agentic-lmcache-1m-c64
          concurrency: [64]

        - <<: *glm52_agentic_lmcache_cpp4_dcp4
          name: glm-52-mxfp4-1p1d-cpp4-dcp4-agentic-lmcache-1m-c72
          concurrency: [72]

        - <<: *glm52_agentic_lmcache_cpp4_dcp4
          name: glm-52-mxfp4-1p1d-cpp4-dcp4-agentic-lmcache-1m-c80
          concurrency: [80]

        - <<: *glm52_agentic_lmcache_cpp4_dcp4
          name: glm-52-mxfp4-1p1d-cpp4-dcp4-agentic-lmcache-1m-c96
          concurrency: [96]

        - <<: *glm52_agentic_lmcache_cpp4_dcp4
          name: glm-52-mxfp4-1p1d-cpp4-dcp4-agentic-lmcache-1m-c112
          concurrency: [112]

        - <<: *glm52_agentic_lmcache_cpp4_dcp4
          name: glm-52-mxfp4-1p1d-cpp4-dcp4-agentic-lmcache-1m-c128
          concurrency: [128]

        - <<: *glm52_agentic_lmcache_cpp4_dcp4
          name: glm-52-mxfp4-1p1d-cpp4-dcp4-agentic-lmcache-1m-c144
          concurrency: [144]

        - <<: *glm52_agentic_lmcache_cpp4_dcp4
          name: glm-52-mxfp4-1p1d-cpp4-dcp4-agentic-lmcache-1m-c160
          concurrency: [160]

        - <<: *glm52_agentic_lmcache_cpp4_dcp4
          name: glm-52-mxfp4-1p1d-cpp4-dcp4-agentic-lmcache-1m-c192
          concurrency: [192]

        # 2-3) 1P1D: CPP4 prefill (PP4×TP1, GPU 0-3) + DPA4 decode (dp4×tp1,
        # GPU 4-7) on a single node. MTP4 with fixed acceptance length 3.33.
        # dp_sticky session-affinity routing via is_agentic_dpa().
        - &glm52_agentic_lmcache_cpp4_dpa4_1p1d
          <<: *glm52_agentic_tp4_tp4
          name: glm-52-mxfp4-1p1d-cpp4-dpa4-agentic-lmcache-1m-c36
          topology: 1p1d_cpp4_dpa4
          display_topology: 1P1D-CPP4-DPA4-MTP4
          pd_worker_layout: single_node
          concurrency: [36]
          server:
            common_args:
              kv_cache_dtype: fp8
              block_size: 16
              max_num_seqs: 512
              enable_prefix_caching: true
              decode_max_num_seqs: 128
              max_model_len: ""
              max_num_batched_tokens: ""
              decode_max_num_batched_tokens: ""
              online_quant_config: '{"global_quant_config":"ptpc_fp8","exclude_layer":["lm_head","model.embed_tokens","*.mlp.gate","model.layers.[0-9].mlp.*expert*","model.layers.[1-6][0-9].mlp.*expert*","model.layers.7[0-7].mlp.*expert*","model.layers.78.*"]}'
              gpu_memory_utilization: 0.9
              extra_args: "--level 3 --method mtp --num-speculative-tokens 4 --spec-decode-acceptance-length 3.33"
          prefill:
            workers: 1
            tp: 1
            cudagraph: none
            extra_args: "--pipeline-parallel-size 4 --enforce-eager --max-num-batched-tokens 8192"
          decode:
            workers: 1
            tp: 4
            cudagraph: "[1,2,3,4,5,6,7,8,10,12,14,16]"
            extra_args: >-
              --enable-dp-attention
              --dp-load-balance least_requests
              --cudagraph-mode FULL
          env:
            common:
              MC_DISABLE_HIP: "1"
              ATOM_SPARSE_INDEXER_LOGITS_BUDGET_MB: "2047"
              PYTHONHASHSEED: "0"
              MAX_JOBS: "16"
            prefill:
              HIP_VISIBLE_DEVICES: "0,1,2,3"
              VLLM_PP_LAYER_PARTITION: "20,20,20,18"
              LMCACHE_LOCAL_CPU: "True"
              LMCACHE_NUMA_MODE: "auto"
              LMCACHE_MAX_LOCAL_CPU_SIZE: "256"
              LMCACHE_CHUNK_SIZE: "256"
              OFFLOAD_PROFILE: "1"
              OFFLOAD_MIN_LOAD_TOKENS: "0"
              PREFILL_KV_TRANSFER_CONFIG: >-
                {"kv_connector":"multi","connectors":[{"kv_connector":"mooncake","kv_role":"kv_producer","proxy_ip":"${ROLE_IP}","handshake_port":${HANDSHAKE_PORT},"protocol":"rdma"},{"kv_connector":"lmcache_offload","kv_role":"offload"}]}
            decode:
              HIP_VISIBLE_DEVICES: "4,5,6,7"
              DECODE_KV_TRANSFER_CONFIG: >-
                {"kv_connector":"mooncake","kv_role":"kv_consumer","proxy_ip":"${ROLE_IP}","handshake_port":${HANDSHAKE_PORT},"protocol":"rdma","ib_enable_alternate_hca":true,"ib_hca_count":8}
          benchmark:
            <<: *agentic_1m_aiperf
            wait_server_timeout: 5400

        - <<: *glm52_agentic_lmcache_cpp4_dpa4_1p1d
          name: glm-52-mxfp4-1p1d-cpp4-dpa4-agentic-lmcache-1m-c40
          concurrency: [40]

        # Match the CPP4+DCP4 LMCache baseline, enabling chunked KV transfer
        # only on the Mooncake producer; retain every other server/benchmark knob.
        - &glm52_agentic_lmcache_chunked_cpp4_dcp4
          <<: *glm52_agentic_lmcache_cpp4_dcp4
          name: glm-52-mxfp4-1p1d-cpp4-dcp4-agentic-lmcache-chunked-1m-c32
          concurrency: [32]
          env:
            common: *glm52_agentic_lmcache_cpp4_dcp4_env_common
            prefill:
              <<: *glm52_agentic_lmcache_cpp4_dcp4_env_prefill
              PREFILL_KV_TRANSFER_CONFIG: >-
                {"kv_connector":"multi","connectors":[{"kv_connector":"mooncake","kv_role":"kv_producer","proxy_ip":"${ROLE_IP}","handshake_port":${HANDSHAKE_PORT},"protocol":"rdma","enable_chunked_transfer":true},{"kv_connector":"lmcache_offload","kv_role":"offload"}]}
            decode: *glm52_cpp4_dcp4_lmcache_decode_env

        # 4-5) 1P2D: CPP4 prefill (PP4×TP1, node 0) paired with 2× DPA4 decode
        # (dp4×tp1 each, node 1 GPU 0-3 and GPU 4-7). MTP4 with fixed
        # acceptance length 3.33. dp_sticky session-affinity routing via
        # is_agentic_dpa(). RDMA between nodes for KV transfer.
        - &glm52_agentic_lmcache_cpp4_dpa4_1p2d
          <<: *glm52_agentic_tp4_tp4
          name: glm-52-mxfp4-1p2d-cpp4-dpa4-agentic-lmcache-1m-c48
          topology: 1p2d_cpp4_dpa4
          display_topology: 1P2D-CPP4-DPA4-MTP4
          pd_worker_layout: decode_single_node
          nodes: "${ATOMESH_2P1D_NODES}"
          concurrency: [48]
          server:
            common_args:
              kv_cache_dtype: fp8
              block_size: 16
              max_num_seqs: 512
              enable_prefix_caching: true
              decode_max_num_seqs: 128
              max_model_len: ""
              max_num_batched_tokens: ""
              decode_max_num_batched_tokens: ""
              online_quant_config: '{"global_quant_config":"ptpc_fp8","exclude_layer":["lm_head","model.embed_tokens","*.mlp.gate","model.layers.[0-9].mlp.*expert*","model.layers.[1-6][0-9].mlp.*expert*","model.layers.7[0-7].mlp.*expert*","model.layers.78.*"]}'
              gpu_memory_utilization: 0.9
              extra_args: "--level 3 --method mtp --num-speculative-tokens 4 --spec-decode-acceptance-length 3.33"
          prefill:
            workers: 1
            tp: 1
            cudagraph: none
            extra_args: "--pipeline-parallel-size 4 --enforce-eager --max-num-batched-tokens 8192"
          decode:
            workers: 2
            tp: 4
            cudagraph: "[1,2,3,4,5,6,7,8,10,12,14,16]"
            extra_args: >-
              --enable-dp-attention
              --dp-load-balance least_requests
              --cudagraph-mode FULL
          env:
            common:
              MC_DISABLE_HIP: "1"
              ATOM_SPARSE_INDEXER_LOGITS_BUDGET_MB: "2047"
              PYTHONHASHSEED: "0"
              MAX_JOBS: "16"
            prefill:
              HIP_VISIBLE_DEVICES: "0,1,2,3"
              VLLM_PP_LAYER_PARTITION: "20,20,20,18"
              LMCACHE_LOCAL_CPU: "True"
              LMCACHE_NUMA_MODE: "auto"
              LMCACHE_MAX_LOCAL_CPU_SIZE: "256"
              LMCACHE_CHUNK_SIZE: "256"
              OFFLOAD_PROFILE: "1"
              OFFLOAD_MIN_LOAD_TOKENS: "0"
              PREFILL_KV_TRANSFER_CONFIG: >-
                {"kv_connector":"multi","connectors":[{"kv_connector":"mooncake","kv_role":"kv_producer","proxy_ip":"${ROLE_IP}","handshake_port":${HANDSHAKE_PORT},"protocol":"rdma"},{"kv_connector":"lmcache_offload","kv_role":"offload"}]}
            decode:
              DECODE_KV_TRANSFER_CONFIG: >-
                {"kv_connector":"mooncake","kv_role":"kv_consumer","proxy_ip":"${ROLE_IP}","handshake_port":${HANDSHAKE_PORT},"protocol":"rdma","ib_enable_alternate_hca":true,"ib_hca_count":8}
          benchmark:
            <<: *agentic_1m_aiperf
            wait_server_timeout: 5400

        - <<: *glm52_agentic_lmcache_cpp4_dpa4_1p2d
          name: glm-52-mxfp4-1p2d-cpp4-dpa4-agentic-lmcache-1m-c56
          concurrency: [56]

      # 6-8) 1P3D: CPP4 prefill with pure TP4+MTP5 decodes (no DCP).
      # Packed layout fills 8-GPU nodes prefill-first; 1P3D uses 2 nodes.
      # Aligned with the standalone TP4 recipe.
      agentic_multi_decode:
        - &glm52_agentic_cpp4_tp4_mtp5
          <<: *glm52_agentic_lmcache_cpp4_dcp4
          name: glm-52-mxfp4-1p3d-cpp4-tp4-mtp5-agentic-lmcache-1m-c12
          topology: 1p3d_cpp4_tp4_mtp5
          pd_worker_layout: packed_nodes
          nodes: "${ATOMESH_2P1D_NODES}"
          concurrency: [12]
          router:
            policy: cache_aware
            balance_abs_threshold: 2
          server:
            common_args:
              <<: &glm52_agentic_cpp4_tp4_mtp5_args
                <<: *glm52_agentic_lmcache_cpp4_dcp4_args
                online_quant_config: '{"global_quant_config":"ptpc_fp8","exclude_layer":["lm_head","model.embed_tokens","*.mlp.gate","model.layers.[0-9].mlp.*expert*","model.layers.[1-6][0-9].mlp.*expert*","model.layers.7[0-7].mlp.*expert*","model.layers.78.*"]}'
                extra_args: "--level 3 --method mtp --num-speculative-tokens 5 --spec-decode-acceptance-length 3.61"
                decode_max_num_batched_tokens: 16384
              decode_max_num_seqs: 24
          decode:
            <<: &glm52_agentic_tp4_mtp5_decode
              tp: 4
              extra_args: "--gpu-memory-utilization 0.95 --cudagraph-mode FULL --disable-uvicorn-access-log"
            workers: 3
            cudagraph: "[1,2,4,8,12,16,20,24]"
          env:
            common: *glm52_agentic_lmcache_cpp4_dcp4_env_common
            prefill:
              <<: *glm52_agentic_lmcache_cpp4_dcp4_env_prefill
              ATOM_SPARSE_INDEXER_LOGITS_BUDGET_MB: "2047"
              TOPK_FORCE_PATH: "one"
            decode:
              <<: *glm52_agentic_lmcache_cpp4_dcp4_env_decode
              PYTHONNOUSERSITE: "1"
              MC_DISABLE_HIP: "1"
              DECODE_KV_TRANSFER_CONFIG: >-
                {"kv_connector":"mooncake","kv_role":"kv_consumer","proxy_ip":"${ROLE_IP}","handshake_port":${HANDSHAKE_PORT},"protocol":"rdma","ib_enable_alternate_hca":true,"ib_hca_count":8}

        - <<: *glm52_agentic_cpp4_tp4_mtp5
          name: glm-52-mxfp4-1p3d-cpp4-tp4-mtp5-agentic-lmcache-1m-c16
          topology: 1p3d_cpp4_tp4_mtp5
          concurrency: [16]
          server:
            common_args:
              <<: *glm52_agentic_cpp4_tp4_mtp5_args
              decode_max_num_seqs: 32
          decode:
            <<: *glm52_agentic_tp4_mtp5_decode
            workers: 3
            cudagraph: "[1,2,4,8,12,16,20,24,28,32]"

        - <<: *glm52_agentic_cpp4_tp4_mtp5
          name: glm-52-mxfp4-1p3d-cpp4-tp4-mtp5-agentic-lmcache-1m-c24
          topology: 1p3d_cpp4_tp4_mtp5
          concurrency: [24]
          server:
            common_args:
              <<: *glm52_agentic_cpp4_tp4_mtp5_args
              decode_max_num_seqs: 48
          decode:
            <<: *glm52_agentic_tp4_mtp5_decode
            workers: 3
            cudagraph: "[1,2,4,8,12,16,20,24,28,32,36,40,44,48]"

        # 1P1D with a full node per role (multi_node, 2 nodes) and a TP8+DCP8
        # decode. MTP3 with fixed acceptance length 2.99, the standalone DCP
        # recipe's depth for C48 and above; each of the 8 prefill ranks gets
        # 256 GiB of LMCache CPU tier.
        # TP8+DCP8 prefill: DCP on the prefill side runs MTP draft steps after
        # a prefill target step, which needs the per-token DCP block table.
        - &glm52_agentic_dcp8_dcp8
          name: glm-52-mxfp4-1p1d-dcp8-dcp8-agentic-lmcache-1m-c96
          topology: 1p1d_dcp8_dcp8
          display_topology: 1P1D-DCP8-DCP8-MTP3
          pd_worker_layout: multi_node
          nodes: "${ATOMESH_1P1D_NODES}"
          isl: [1048576]
          osl: 1024
          concurrency: [96]
          server:
            common_args: &glm52_agentic_dcp8_args
              kv_cache_dtype: fp8
              block_size: 16
              max_num_seqs: 512
              enable_prefix_caching: true
              decode_max_num_seqs: 512
              max_model_len: ""
              max_num_batched_tokens: ""
              decode_max_num_batched_tokens: ""
              online_quant_config: '{"global_quant_config":"ptpc_fp8","exclude_layer":["lm_head","model.embed_tokens","*.mlp.gate","model.layers.[0-9].mlp.*expert*","model.layers.[1-6][0-9].mlp.*expert*","model.layers.7[0-7].mlp.*expert*","model.layers.78.*"]}'
              gpu_memory_utilization: 0.85
              extra_args: "--level 3 --method mtp --num-speculative-tokens 3 --spec-decode-acceptance-length 2.99"
          prefill:
            workers: 1
            tp: 8
            dcp: 8
            cudagraph: none
            extra_args: "--enforce-eager --max-num-batched-tokens 8192"
          decode:
            workers: 1
            tp: 8
            dcp: 8
            cudagraph: >-
              [1,2,4,8,16,24,32,40,48,56,64,72,80,88,96,104,112,120,128,136,144,152,160,168,176,184,192,200,208,216,224,232,240,248,256]
            extra_args: "--cudagraph-mode FULL"
          env:
            common: &glm52_agentic_dcp8_env_common
              # Force RDMA to avoid HIP IPC shared-pool address corruption.
              MC_DISABLE_HIP: "1"
              ATOM_MLA_PAGE_SIZE: "1"
              ATOM_ONLINE_QUANT_STREAMING: "0"
              ATOM_SPARSE_INDEXER_LOGITS_BUDGET_MB: "2047"
              ATOM_USE_TRITON_MLA: "0"
              MAX_JOBS: "16"
              PYTHONHASHSEED: "0"
              TOPK_FORCE_PATH: "one"
            prefill: &glm52_agentic_dcp8_env_prefill
              HIP_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
              LMCACHE_LOCAL_CPU: "True"
              LMCACHE_NUMA_MODE: "auto"
              LMCACHE_MAX_LOCAL_CPU_SIZE: "256"
              LMCACHE_CHUNK_SIZE: "256"
              OFFLOAD_PROFILE: "1"
              OFFLOAD_MIN_LOAD_TOKENS: "0"
              PREFILL_KV_TRANSFER_CONFIG: >-
                {"kv_connector":"multi","connectors":[{"kv_connector":"mooncake","kv_role":"kv_producer","proxy_ip":"${ROLE_IP}","handshake_port":${HANDSHAKE_PORT},"protocol":"rdma"},{"kv_connector":"lmcache_offload","kv_role":"offload"}]}
            decode: &glm52_agentic_dcp8_env_decode
              HIP_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
              DECODE_KV_TRANSFER_CONFIG: >-
                {"kv_connector":"mooncake","kv_role":"kv_consumer","proxy_ip":"${ROLE_IP}","handshake_port":${HANDSHAKE_PORT},"protocol":"rdma"}
          benchmark:
            <<: *agentic_1m_aiperf
            wait_server_timeout: 5400
          run_eval: false

        # Same decode, CPP8 prefill (PP8 x TP1). 78 target layers split 10x7 + 8;
        # the last stage also hosts the MTP layer, as in the CPP4 20,20,20,18 split.
        - <<: *glm52_agentic_dcp8_dcp8
          name: glm-52-mxfp4-1p1d-cpp8-dcp8-agentic-lmcache-1m-c96
          topology: 1p1d_cpp8_dcp8
          display_topology: 1P1D-CPP8-DCP8-MTP3
          prefill: &glm52_agentic_cpp8_prefill
            workers: 1
            tp: 1
            cudagraph: none
            extra_args: "--pipeline-parallel-size 8 --enforce-eager --max-num-batched-tokens 8192"
          env: &glm52_agentic_cpp8_env
            common: *glm52_agentic_dcp8_env_common
            prefill:
              <<: *glm52_agentic_dcp8_env_prefill
              VLLM_PP_LAYER_PARTITION: "10,10,10,10,10,10,10,8"
            decode: *glm52_agentic_dcp8_env_decode

      # Manual accuracy suite: the two deployments above, GSM8K only and without
      # forced acceptance, which would otherwise commit draft tokens the target
      # rejected. 20-shot prompts (~3.5k tokens) exceed the DSA top-k of 2048, so
      # the sparse indexer's selection -- and on CPP8 its top-k handoff across PP
      # stages -- decides what each token attends to.
      accuracy:
        - &glm52_dcp8_dcp8_gsm8k
          <<: *glm52_agentic_dcp8_dcp8
          name: glm-52-mxfp4-1p1d-dcp8-dcp8-gsm8k-only-c64
          isl: [4096]
          osl: 1024
          concurrency: [64]
          server:
            common_args:
              <<: *glm52_agentic_dcp8_args
              extra_args: "--level 3 --method mtp --num-speculative-tokens 3"
          benchmark:
            kind: random
            wait_server_timeout: 5400
            wait_router_timeout: 600
          run_eval: true
          eval_only: true
          accuracy:
            task: gsm8k
            fewshot: 20
            eval_concurrency: [64]
            model_type: local-completions
            endpoint: completions
            # Single-node GLM-5.2-MXFP4 GSM8K threshold (baseline 0.9447).
            threshold: 0.92

        - <<: *glm52_dcp8_dcp8_gsm8k
          name: glm-52-mxfp4-1p1d-cpp8-dcp8-gsm8k-only-c64
          topology: 1p1d_cpp8_dcp8
          display_topology: 1P1D-CPP8-DCP8-MTP3
          prefill: *glm52_agentic_cpp8_prefill
          env: *glm52_agentic_cpp8_env

      # The nightly lmcache-1m cells with their prefix tier in a Mooncake Store
      # and no LMCache anywhere: ATOM's mooncake_store offload connector moves
      # each PP stage's 256-token KV chunks between its GPU and the Store, and
      # the launcher starts the Store's master and owners on the prefill node
      # (pd_server_atom.sh: MOONCAKE_STORE) and hands the prefill workers
      # ATOM_KV_OFFLOAD=mooncake_store. Dispatch-only, never scheduled
      # (suite=mooncake_store). The owner sizes and NICs fit pit2-p03 (TW
      # MI355X) nodes only: about 1.5 TiB per NUMA node, NUMA1's NICs named
      # rdma4-7 (Spur MI350X hosts name theirs ionic_N). Their own
      # display_topology keeps them off the nightly cells' dashboard series.
      mooncake_store:
        - &glm52_agentic_mcstore_cpp4_dcp4
          <<: *glm52_agentic_lmcache_cpp4_dcp4
          name: glm-52-mxfp4-1p1d-cpp4-dcp4-agentic-mcstore-1m-c48
          display_topology: 1P1D-CPP4-DCP4-TP1-TP4-MCSTORE
          concurrency: [48]
          env:
            common: *glm52_agentic_lmcache_cpp4_dcp4_env_common
            # Restated: a merge cannot drop the nightly cells' LMCACHE_* keys.
            prefill: &glm52_agentic_mcstore_cpp4_dcp4_env_prefill
              HIP_VISIBLE_DEVICES: "0,1,2,3"
              VLLM_PP_LAYER_PARTITION: "20,20,20,18"
              OFFLOAD_PROFILE: "1"
              OFFLOAD_MIN_LOAD_TOKENS: "0"
              MOONCAKE_STORE: "1"
              # <numa>:<GiB>[:<rdma,...>] per owner, on NIC pairs of rdma4-7,
              # disjoint from the stages' own NICs (their GPUs' rdma0-3) and
              # from each other. Resize by overriding
              # ATOMESH_PREFILL_ENV_MOONCAKE_STORE_OWNERS, at most 832 GiB per
              # owner (an ionic NIC's registration limit).
              MOONCAKE_STORE_OWNERS: "0:768:rdma4,rdma5;1:768:rdma6,rdma7"
              # The clean page cache of every model on the node goes before the
              # owners pin huge pages, not just this one's: compaction would
              # reclaim it otherwise.
              MOONCAKE_STORE_PAGE_CACHE_DROP_DIRS: "${ATOMESH_MODEL_ROOT}"
              # P/D only; the launcher adds mooncake_store through ATOM_KV_OFFLOAD.
              PREFILL_KV_TRANSFER_CONFIG: >-
                {"kv_connector":"mooncake","kv_role":"kv_producer","proxy_ip":"${ROLE_IP}","handshake_port":${HANDSHAKE_PORT},"protocol":"rdma"}
            # The launcher adds MC_NUM_QP_PER_EP=1 for the P->D transfer engine.
            decode: *glm52_cpp4_dcp4_decode_env

        - <<: *glm52_agentic_mcstore_cpp4_dcp4
          name: glm-52-mxfp4-1p1d-cpp4-dcp4-agentic-mcstore-1m-c56
          concurrency: [56]

        - <<: *glm52_agentic_mcstore_cpp4_dcp4
          name: glm-52-mxfp4-1p1d-cpp4-dcp4-agentic-mcstore-1m-c72
          concurrency: [72]

        - <<: *glm52_agentic_mcstore_cpp4_dcp4
          name: glm-52-mxfp4-1p1d-cpp4-dcp4-agentic-mcstore-1m-c96
          concurrency: [96]

        - <<: *glm52_agentic_mcstore_cpp4_dcp4
          name: glm-52-mxfp4-1p1d-cpp4-dcp4-agentic-mcstore-1m-c112
          concurrency: [112]

        - <<: *glm52_agentic_mcstore_cpp4_dcp4
          name: glm-52-mxfp4-1p1d-cpp4-dcp4-agentic-mcstore-1m-c128
          concurrency: [128]

        # The same cells on two nodes that each give the job only GPUs 0-3
        # with their NUMA node's memory and NICs (rdma0-3): the other half of
        # each node belongs to another job. Prefill on the first node, decode
        # on the second, both on GPUs 0-3. The Store pools both nodes' NUMA0
        # memory, 4 x 240 GiB on each. Those owners must share the stages'
        # NICs, so each NIC is a pool of its own (MOONCAKE_STORE_POOLS=per_nic):
        # one master for all eight owners stalled reads for good. The page
        # cache drop covers both nodes, the co-tenant's models included (page
        # cache is per file, node-wide).
        - &glm52_agentic_mcstore_2n_cpp4_dcp4
          <<: *glm52_agentic_mcstore_cpp4_dcp4
          name: glm-52-mxfp4-1p1d-cpp4-dcp4-agentic-mcstore-2n-1m-c96
          display_topology: 1P1D-CPP4-DCP4-TP1-TP4-MCSTORE-2N
          pd_worker_layout: multi_node
          concurrency: [96]
          env:
            common: *glm52_agentic_lmcache_cpp4_dcp4_env_common
            prefill:
              <<: *glm52_agentic_mcstore_cpp4_dcp4_env_prefill
              MOONCAKE_STORE_POOLS: "per_nic"
              MOONCAKE_STORE_MASTER_NUMA: "0"
              MOONCAKE_STORE_OWNERS: "0:240:rdma0;0:240:rdma1;0:240:rdma2;0:240:rdma3"
              MOONCAKE_STORE_DECODE_OWNERS: "0:240:rdma0;0:240:rdma1;0:240:rdma2;0:240:rdma3"
            decode:
              <<: *glm52_cpp4_dcp4_decode_env
              HIP_VISIBLE_DEVICES: "0,1,2,3"

        - <<: *glm52_agentic_mcstore_2n_cpp4_dcp4
          name: glm-52-mxfp4-1p1d-cpp4-dcp4-agentic-mcstore-2n-1m-c112
          concurrency: [112]

    accuracy:
      task: gsm8k
      fewshot: 20
      limit: null
      model_type: local-completions
      endpoint: completions

  Kimi-K3-MXFP4:
    backend: atom
    model_path: "${ATOMESH_MODEL_ROOT}/moonshotai/Kimi-K3"
    precision: MXFP4
    env:
      common:
        PYTHONNOUSERSITE: "1"
        PYTHONHASHSEED: "0"
        AITER_SITUV2_A4W4: "1"
        AITER_QUICK_REDUCE_QUANTIZATION: INT4
        AITER_FLYDSL_STAGE2_FP8: "1"
        # AgentX enables comm-group reuse from CONC 56 up.
        AITER_REUSE_IDENTICAL_COMM_GROUPS: "0"
        ATOM_GDN_SSM_DTYPE: "fp16"
        # Already the ATOM default; pinned so a default flip cannot silently
        # move the published numbers.
        ATOM_USE_FLYDSL_GATHER_KV_B_PROJ: "1"
        ATOM_STATE_CHECKPOINT_DEMAND: "0"
        # AgentX runs FlyDSL FP8 prefill attention on every band.
        ATOM_USE_FLYDSL_FP8_PREFILL_ATTN: "1"
        # ReplaySSM caches the KDA inputs instead of a state per draft token, so
        # it pays only with drafts to roll back: AgentX runs it off at CONC
        # 1/2/4 and on from CONC 8. Cases that declare their own env block must
        # restate the key, because a YAML merge key loses to an explicit `env:`
        # on the same node.
        ATOM_ENABLE_REPLAYSSM: "0"
      prefill: {}
      decode: {}
    server:
      common_args:
        trust_remote_code: true
        kv_cache_dtype: fp8
        block_size: 128
        enable_prefix_caching: true
        max_model_len: ""
        state_checkpoint_interval_tokens: -1
        # ATOM resolves the tool-call format from the chat template at startup.
        # Naming it fails closed: should the template ever stop rendering a tools
        # payload, the auto path degrades to plain-text tool calls, which the
        # vendor verifier reads as a model that cannot call tools at all.
        extra_args: "--tool-call-parser kimi_k3"
        online_quant_config: '{"global_quant_config":"ptpc_fp8","exclude_layer":["lm_head","model.embed_tokens","*self_attn.[qkv]_conv1d*","*block_sparse_moe.experts*","*block_sparse_moe.routed_expert_*","*vision_tower*","*mm_projector*"]}'
    suites:
      nightly:
        # One concurrency per job keeps the prefix/state caches independent.
        #
        # Kimi-K3 P/D on InferenceX's AgentX recipe
        # (kimik3-fp4-mi355x-atom-agentic-mtp, SemiAnalysisAI/InferenceX#4085 and
        # #4307), one cell per concurrency on the prefill that measured best
        # there:
        #
        #   CONC 1      TP8EP8 prefill, mono TP8 decode, seven DSpark drafts
        #   CONC 2, 4   TP8EP8 prefill, TP8 decode, seven drafts
        #   CONC 16     TP8EP8xDCP8 prefill, TP8xDCP8 decode, four drafts
        #   CONC 32-88  PP8xTP1 prefill, TP8xDCP8 decode, four drafts
        #
        # The decode runs the recipe: the drafter's linears unquantized,
        # max_num_seqs 2 * CONC (at least 32), ReplaySSM and a 128 GiB per-rank
        # CPU tier from CONC 16, comm-group reuse from CONC 56. CONC 32 and 88
        # are not in the recipe: each takes the settings of the recipe point
        # below it, CONC 16 and 72, except max_num_seqs. From CONC 48 the
        # prefill's state cache is the PD recipe's
        # (recipes/mesh/Agentic-Kimi-K3.md): on-demand KDA checkpoints at
        # observed shared-prefix targets, and a 128 GiB state cap carved from a
        # 224 GiB per-rank pool, which leaves paged KV 96 GiB per rank once
        # state reaches its cap. The recipe's PrefillDelayer settings pace
        # prefill against decode on one server, which neither P/D server does,
        # so these cells leave them unset.
        #
        # Without DP attention an expert-parallel TP8 prefill keeps the tokens
        # replicated, so there is no all-to-all: each rank owns 112 of the 896
        # experts at full width and the routed partials take the same
        # all-reduce as the TP-sharded MoE. It serves prompts faster than PP8
        # through CONC 16; from CONC 32 one prompt at a time across all eight
        # GPUs queues the long ones and PP8 wins.
        #
        # CONC 1 runs #4307's mono decode. Mono reads the KDA state as fp32, so
        # both servers allocate it so, and refuses the decode's in_proj,
        # f_b_proj, o_proj and shared-expert projections quantized, so the
        # decode alone keeps them in bf16. A decode whose config mono refuses
        # logs why and serves the plain model, so the cell fails unless the
        # decode logs that mono armed. Mono stays off elsewhere: at CONC 2 it
        # lost to the plain TP8 decode.
        - <<: &kimi_k3_agentic_tp8
            topology: 1p1d
            pd_worker_layout: multi_node
            nodes: "${ATOMESH_1P1D_NODES}"
            isl: [1048576]
            osl: 1024
            server:
              common_args: &kimi_k3_agentic_dspark7_args
                gpu_memory_utilization: 0.90
                max_num_seqs: 32
                max_num_batched_tokens: 8192
                method: dspark
                draft_model: "${ATOMESH_MODEL_ROOT}/Inferact/Kimi-K3-DSpark"
                num_speculative_tokens: 7
                spec_decode_acceptance_length: 3.84
            decode: &kimi_k3_agentic_tp8_decode
              workers: 1
              tp: 8
              # AgentX pins the compile path and captures the dense query-token
              # range 1..2*CONC*(1+spec) that `auto` derives per concurrency.
              cudagraph: auto
              cudagraph_mode: FULL
              compilation_level: 3
            benchmark: *agentic_1m_aiperf
            run_eval: false
          name: kimi-k3-mxfp4-1p1d-tp8ep8-tp8-dspark7-agentic-1m-c1-mono
          display_topology: 1P1D-TP8EP8-TP8-DSPARK7-MONO
          concurrency: [1]
          prefill: &kimi_k3_tp8ep8_prefill
            workers: 1
            tp: 8
            extra_args: "--enable-expert-parallel"
          decode:
            <<: *kimi_k3_agentic_tp8_decode
            online_quant_extra_exclude_layer:
              - "*self_attn.in_proj*"
              - "*self_attn.f_b_proj*"
              - "*self_attn.o_proj*"
              - "*shared_experts.gate_up_proj*"
              - "*shared_experts.down_proj*"
            # Armed: the config admits mono. On: a decode step reached mono and
            # its runner was built. While starting, the only such step is the
            # warmup forward before a FULL CUDA graph capture, so under
            # --enforce-eager the first comes with a request, after this check,
            # and the cell fails.
            expect_log:
              - "Kimi-K3 mono decode armed"
              - "Kimi-K3 mono decode on"
            # Armed, then gone: the runner failed to build, or the width C1
            # serves, one request plus its num_speculative_tokens drafts, had no
            # build. The capture also builds 16 rows, which C1 never serves, so
            # that width's line is no failure; a test holds the 8 to
            # num_speculative_tokens. A step mono does not serve, such as a
            # prefill, logs "declined a step" and is no failure either.
            reject_log:
              - "Kimi-K3 mono decode off"
              - "Kimi-K3 mono decode declined the 8-row build"
          server:
            common_args: &kimi_k3_pd_dspark7_args
              <<: *kimi_k3_agentic_dspark7_args
              # The DSpark drafter's linears stay in bf16 like its checkpoint,
              # which has no FP8 QAT. With no `model.` prefix, the `layers.*`
              # and `context_proj` entries match only the drafter's modules,
              # never the target's.
              online_quant_extra_exclude_layer:
                - layers.*.self_attn.fused_qkv_a_proj
                - layers.*.self_attn.q_b_proj
                - layers.*.self_attn.kv_b_proj
                - layers.*.self_attn.o_proj
                - layers.*.mlp.gate_up_proj
                - layers.*.mlp.down_proj
                - context_proj
          # An ATOM that does not define a setting ignores it, so the cells
          # fail on one without these instead of measuring without them.
          requires_atom_env: &kimi_k3_pd_atom_env
            - ATOM_KV_POLL_FRESH_WAIT_MS
            - ATOM_PD_PROMPT_IDS_B64
            - ATOM_PD_EARLY_T0
          env:
            common:
              <<: &kimi_k3_pd_env
                AITER_LOG_LEVEL: WARNING
                ATOM_ENABLE_REPLAYSSM: "0"
                ATOM_MONO_ENABLE: "0"
                # An engine with requests parked on a KV load polls again for
                # up to 5 ms after each forward, so KV that landed during it is
                # scheduled the next step: every decode, waiting on the
                # prefill's KV, and the CONC 16 prefill, waiting on its CPU
                # tier. The CONC 1-4 prefills park nothing, and the PP8
                # prefills ignore the setting.
                ATOM_KV_POLL_FRESH_WAIT_MS: "5"
              ATOM_GDN_SSM_DTYPE: fp32
            prefill: &kimi_k3_pd_prefill_env
              # Hand decode the prompt ids as base64 int32, not a JSON list
              # that every hop re-parses (~670K ints at 1M context).
              ATOM_PD_PROMPT_IDS_B64: "1"
            decode:
              <<: &kimi_k3_pd_decode_env
                # Stream the prefill's first token when the request's KV
                # lands, not with the first local decode's deferred output.
                ATOM_PD_EARLY_T0: "1"
              # Overrides the common "0" on purpose: this is the only cell that
              # runs mono, and only its decode does.
              ATOM_MONO_ENABLE: "1"

        - <<: *kimi_k3_agentic_tp8
          name: kimi-k3-mxfp4-1p1d-tp8ep8-tp8-dspark7-agentic-1m-c2
          display_topology: 1P1D-TP8EP8-TP8-DSPARK7
          concurrency: [2]
          prefill: *kimi_k3_tp8ep8_prefill
          server:
            common_args: *kimi_k3_pd_dspark7_args
          requires_atom_env: *kimi_k3_pd_atom_env
          env:
            common: *kimi_k3_pd_env
            prefill: *kimi_k3_pd_prefill_env
            decode: *kimi_k3_pd_decode_env

        - <<: *kimi_k3_agentic_tp8
          name: kimi-k3-mxfp4-1p1d-tp8ep8-tp8-dspark7-agentic-1m-c4
          display_topology: 1P1D-TP8EP8-TP8-DSPARK7
          concurrency: [4]
          prefill: *kimi_k3_tp8ep8_prefill
          server:
            common_args: *kimi_k3_pd_dspark7_args
          requires_atom_env: *kimi_k3_pd_atom_env
          env:
            common: *kimi_k3_pd_env
            prefill: *kimi_k3_pd_prefill_env
            decode: *kimi_k3_pd_decode_env
          run_eval: true
          eval_concurrency: [4]

        - <<: *kimi_k3_agentic_tp8
          name: kimi-k3-mxfp4-1p1d-tp8ep8-dcp8-dspark4-agentic-lmcache-1m-c16
          display_topology: 1P1D-TP8EP8-DCP8-DSPARK4
          concurrency: [16]
          prefill:
            <<: *kimi_k3_tp8ep8_prefill
            dcp: 8
          decode: &kimi_k3_dcp8_decode
            workers: 1
            tp: 8
            dcp: 8
            cudagraph: auto
            cudagraph_mode: FULL
            compilation_level: 3
          server:
            common_args: &kimi_k3_pd_dspark4_args
              <<: *kimi_k3_pd_dspark7_args
              num_speculative_tokens: 4
              spec_decode_acceptance_length: 3.36
          requires_atom_env: *kimi_k3_pd_atom_env
          env:
            common: &kimi_k3_pd_replay_env
              <<: *kimi_k3_pd_env
              ATOM_ENABLE_REPLAYSSM: "1"
            prefill: &kimi_k3_pd_lmcache128_prefill_env
              <<: *kimi_k3_pd_prefill_env
              LMCACHE_LOCAL_CPU: "True"
              LMCACHE_MAX_LOCAL_CPU_SIZE: "128"
              LMCACHE_CHUNK_SIZE: "1024"
              LMCACHE_NUMA_MODE: auto
              ATOM_NUMA_BIND: "1"
              ATOM_NUMA_NODE: "0,0,0,0,1,1,1,1"
              # Auto-binding off so the explicit ATOM_NUMA_NODE map is what takes effect.
              ATOM_AUTO_NUMA_BIND: "0"
              OFFLOAD_PROFILE: "1"
              OFFLOAD_GPU_STAGING_CHUNKS: "32"
              PREFILL_KV_TRANSFER_CONFIG: >-
                {"kv_connector":"multi","connectors":[{"kv_connector":"mooncake","kv_role":"kv_producer","proxy_ip":"${ROLE_IP}","handshake_port":6301},{"kv_connector":"lmcache_offload","kv_role":"offload"}]}
            decode: *kimi_k3_pd_decode_env

        # The PP8 prefill is eight one-GPU stages. Only the last holds the
        # drafter, so its stage is cut to nine layers, on AttnRes block
        # boundaries, to even out the KV block count every stage shares. It runs
        # eager, since a P/D producer never decodes. It also keeps the unsharded
        # KDA gate GEMM (f_b_proj, N 12288, K 128) in bf16: aiter has no tuned
        # FP8 config for that shape, and its untuned FP8 GEMM needs K above 192.
        # Drop the exclusion once aiter's FP8 GEMM serves K 128.
        #
        # Each PP8 stage repacks its KV for the TP8xDCP8 decode into 128-page
        # MLA staging slots, which are off unless set, on their own streams; at
        # high priority a repack does not wait out the stage's next prefill
        # forward.
        - &kimi_k3_1p1d_pp8_dcp8
          <<: *kimi_k3_agentic_tp8
          name: kimi-k3-mxfp4-1p1d-pp8-dcp8-dspark4-agentic-lmcache-1m-c32
          topology: 1p1d_pp8_dcp8
          display_topology: 1P1D-PP8-DCP8-TP1-TP8-DSPARK4
          concurrency: [32]
          prefill:
            workers: 1
            tp: 1
            extra_args: >-
              --pipeline-parallel-size 8
              --enforce-eager
            online_quant_extra_exclude_layer: ["*self_attn.f_b_proj"]
          decode: *kimi_k3_dcp8_decode
          server:
            common_args:
              <<: *kimi_k3_pd_dspark4_args
              max_num_seqs: 64
          # Plus the MLA staging settings its prefill sets, which an ATOM
          # without them would ignore as well.
          requires_atom_env:
            - ATOM_KV_POLL_FRESH_WAIT_MS
            - ATOM_PD_PROMPT_IDS_B64
            - ATOM_PD_EARLY_T0
            - ATOM_PD_MLA_STAGING_CHUNK_PAGES
            - ATOM_PD_MLA_STAGING_STREAM_PRIORITY
          env:
            common: *kimi_k3_pd_replay_env
            prefill: &kimi_k3_pp8_lmcache128_prefill_env
              <<: *kimi_k3_pd_lmcache128_prefill_env
              VLLM_PP_LAYER_PARTITION: "12,12,12,12,12,12,12,9"
              ATOM_PD_MLA_STAGING_CHUNK_PAGES: "128"
              ATOM_PD_MLA_STAGING_STREAM_PRIORITY: "-1"
            decode: *kimi_k3_pd_decode_env

        - <<: *kimi_k3_1p1d_pp8_dcp8
          name: kimi-k3-mxfp4-1p1d-pp8-dcp8-dspark4-agentic-lmcache-1m-c48
          concurrency: [48]
          server:
            common_args:
              <<: *kimi_k3_pd_dspark4_args
              max_num_seqs: 96
          env:
            common: &kimi_k3_pp8_ondemand_env
              <<: *kimi_k3_pd_replay_env
              ATOM_STATE_CHECKPOINT_DEMAND: "1"
            prefill: &kimi_k3_pp8_state128_prefill_env
              <<: *kimi_k3_pp8_lmcache128_prefill_env
              LMCACHE_MAX_LOCAL_CPU_SIZE: "224"
              OFFLOAD_STATE_CPU_SIZE: "128"
            decode: *kimi_k3_pd_decode_env

        - &kimi_k3_1p1d_pp8_dcp8_c56
          <<: *kimi_k3_1p1d_pp8_dcp8
          name: kimi-k3-mxfp4-1p1d-pp8-dcp8-dspark4-agentic-lmcache-1m-c56
          concurrency: [56]
          server:
            common_args:
              <<: *kimi_k3_pd_dspark4_args
              max_num_seqs: 112
          env:
            common: &kimi_k3_pp8_reuse_env
              <<: *kimi_k3_pp8_ondemand_env
              AITER_REUSE_IDENTICAL_COMM_GROUPS: "1"
            prefill: *kimi_k3_pp8_state128_prefill_env
            decode: *kimi_k3_pd_decode_env

        # From CONC 72 the decode's MLA runs on aiter's OPUS kernel, which the
        # names and dashboard labels carry. Its error against fp32 is larger
        # than the asm kernel's, but GSM8K held at CONC 72; lower concurrencies
        # are unmeasured.
        - &kimi_k3_1p1d_pp8_dcp8_c72
          <<: *kimi_k3_1p1d_pp8_dcp8_c56
          name: kimi-k3-mxfp4-1p1d-pp8-dcp8-dspark4-agentic-lmcache-1m-c72-opus
          display_topology: 1P1D-PP8-DCP8-TP1-TP8-DSPARK4-OPUS
          concurrency: [72]
          server:
            common_args:
              <<: *kimi_k3_pd_dspark4_args
              max_num_seqs: 144
          env:
            common: *kimi_k3_pp8_reuse_env
            prefill: *kimi_k3_pp8_state128_prefill_env
            decode: &kimi_k3_pd_opus_decode_env
              <<: *kimi_k3_pd_decode_env
              AITER_MLA_USE_OPUS: "1"
          run_eval: true
          eval_concurrency: [72]

        # The prefill saturates at CONC 88, so its PP head keeps 16 batches in
        # flight instead of one per stage, and each rank saves and loads the
        # CPU tier on two threads.
        - <<: *kimi_k3_1p1d_pp8_dcp8_c56
          name: kimi-k3-mxfp4-1p1d-pp8-dcp8-dspark4-agentic-lmcache-1m-c88-opus
          display_topology: 1P1D-PP8-DCP8-TP1-TP8-DSPARK4-OPUS
          concurrency: [88]
          server:
            common_args:
              <<: *kimi_k3_pd_dspark4_args
              max_num_seqs: 176
          # Plus the in-flight cap.
          requires_atom_env:
            - ATOM_KV_POLL_FRESH_WAIT_MS
            - ATOM_PD_PROMPT_IDS_B64
            - ATOM_PD_EARLY_T0
            - ATOM_PD_MLA_STAGING_CHUNK_PAGES
            - ATOM_PD_MLA_STAGING_STREAM_PRIORITY
            - ATOM_PP_MAX_INFLIGHT
          env:
            common: *kimi_k3_pp8_reuse_env
            prefill:
              <<: *kimi_k3_pp8_state128_prefill_env
              ATOM_PP_MAX_INFLIGHT: "16"
              OFFLOAD_COPY_WORKERS: "2"
              OFFLOAD_LOAD_WORKERS: "2"
            decode: *kimi_k3_pd_opus_decode_env

      # Dispatch-only: schedule and push run `nightly`, so nothing here reaches
      # the published dashboard. The stop_profile export stalls both engines,
      # which makes this cell's aiperf numbers incomparable with the nightly
      # C72 cell it otherwise matches.
      profile:
        - <<: *kimi_k3_1p1d_pp8_dcp8_c72
          name: kimi-k3-mxfp4-1p1d-pp8-dcp8-dspark4-agentic-lmcache-1m-c72-opus-torch-profile
          run_eval: false
          env:
            common:
              <<: *kimi_k3_pp8_reuse_env
              # 30 s starting 900 s into the aiperf Profiling phase, on every
              # prefill and decode server; traces land under
              # ${RUN_DIR}/torch_traces/<worker>/, in rank_<tp>/ or, for a PP8
              # stage, pp<stage>_rank_<tp>/.
              ATOMESH_TORCH_PROFILE_START: "900"
              ATOMESH_TORCH_PROFILE_DURATION: "30"
              ATOMESH_TORCH_PROFILE_ROLES: prefill,decode
              # Kernel names and durations only; shapes/stacks on a TP8 window
              # risk OOMing the ranks during export.
              ATOM_PROFILER_MORE: "0"
              ATOM_PROFILER_TIMEOUT: "1800"
            prefill: *kimi_k3_pp8_state128_prefill_env
            decode: *kimi_k3_pd_opus_decode_env

      # gsm8k-only PD cell over MoRI IO, prefill and decode on a node each. No
      # DSpark, so it needs no draft model and has no ReplaySSM record buffers,
      # which the MoRIIO connector refuses: it moves the MLA KV by block and the
      # KDA recurrent state by slot.
      accuracy:
        - name: kimi-k3-mxfp4-1p1d-tp8-moriio-gsm8k
          topology: 1p1d_tp8_moriio
          display_topology: 1P1D-MORIIO-TP8
          pd_worker_layout: multi_node
          nodes: "${ATOMESH_1P1D_NODES}"
          isl: [8192]
          osl: 1024
          concurrency: [32]
          server:
            common_args:
              gpu_memory_utilization: 0.90
              max_num_seqs: 64
              max_num_batched_tokens: 8192
              # As in the reference accuracy config (models_accuracy.json),
              # which disables prefix caching for Kimi-K3.
              enable_prefix_caching: false
              # Kimi-K3 thinks by default. lm_eval scores message content, and
              # a reasoning model cut off at max_gen_toks mid-thought returns
              # none. The template's own switch is named "thinking".
              extra_args: '--default-chat-template-kwargs {"thinking":false}'
          prefill:
            workers: 1
            tp: 8
          decode:
            workers: 1
            tp: 8
            # The dense 2..64 range the TP8 DSpark cells already capture.
            cudagraph: auto
          env:
            common:
              KV_CONNECTOR: moriio
              # MoRI IO moves the KDA state only when prefill pushes it.
              ATOM_MORIIO_MODE: write
              # The connector refuses ReplaySSM buffers; pinned, not inherited.
              ATOM_ENABLE_REPLAYSSM: "0"
          benchmark:
            # A cold read of the weights from NFS plus online FP8 quantization
            # takes about an hour on the Spur lane, before kernel builds and
            # graph capture; 4500 s left prefill a few minutes short.
            wait_server_timeout: 7200
          run_eval: true
          eval_only: true
          eval_concurrency: [32]
          accuracy:
            threshold: 0.90

    accuracy:
      task: gsm8k
      fewshot: 5
      limit: null
      model_type: local-chat-completions
      endpoint: chat/completions
      max_gen_toks: 512
      apply_chat_template: true
      threshold: 0.94

  Kimi-K2.5-MXFP4:
    backend: atom
    model_path: "${ATOMESH_MODEL_ROOT}/amd/Kimi-K2.5-MXFP4/"
    precision: MXFP4
    env:
      common:
        AITER_QUICK_REDUCE_QUANTIZATION: "INT4"
        # PR #1566: enable MXFP4 intermediate output for INT4 quick reduce.
        AITER_MXFP4_INTERMEDIATE: "1"
        MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
      prefill: {}
      decode:
        DECODE_KV_TRANSFER_CONFIG: >-
          {"kv_role":"kv_consumer","kv_connector":"mooncake","proxy_ip":"${ROLE_IP}","handshake_port":6301,"ib_enable_alternate_hca":true,"ib_hca_count":8}
    server:
      common_args:
        trust_remote_code: true
        kv_cache_dtype: fp8
        block_size: 16
        enable_prefix_caching: false
        gpu_memory_utilization: 0.9
        max_num_seqs: 256
        max_num_batched_tokens: 32768
        max_model_len: 32768
        extra_args: ""
    suites:
      nightly:
        - name: kimi-k25-1p1d-tp4
          topology: 1p1d
          pd_worker_layout: single_node
          nodes: "${ATOMESH_1P1D_NODES}"
          isl: [8192]
          osl: 1024
          concurrency: [1, 2, 4, 8, 16, 32, 64, 128, 256]
          prefill:
            workers: 1
            tp: 4
          decode:
            workers: 1
            tp: 4
            cudagraph: >-
              [8,16,24,32,40,48,56,64,72,80,88,96,104,112,120,128,136,144,152,160,168,176,184,192,200,208,216,224,232,240,248,256]
          server:
            common_args:
              decode_max_num_seqs: 256
          env:
            common:
              # Force RDMA to avoid HIP IPC shared-pool address corruption.
              MC_DISABLE_HIP: "1"
            prefill:
              HIP_VISIBLE_DEVICES: "0,1,2,3"
            decode:
              HIP_VISIBLE_DEVICES: "4,5,6,7"
          benchmark:
            wait_server_timeout: 4500
          run_eval: true
          eval_concurrency: [64, 256]

        - name: kimi-k25-1p1d-tp4-tp8
          topology: 1p1d_tp4_tp8
          pd_worker_layout: multi_node
          nodes: "${ATOMESH_1P1D_NODES}"
          isl: [8192]
          osl: 1024
          concurrency: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
          prefill:
            workers: 1
            tp: 4
          decode:
            workers: 1
            tp: 8
            cudagraph: >-
              [8,16,24,32,40,48,56,64,72,80,88,96,104,112,120,128,136,144,152,160,168,176,184,192,200,208,216,224,232,240,248,256]
          server:
            common_args:
              decode_max_num_seqs: 512
          env:
            prefill:
              HIP_VISIBLE_DEVICES: "0,1,2,3"
            decode:
              HIP_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
          benchmark:
            wait_server_timeout: 4500
          run_eval: true
          eval_concurrency: [64, 256]
        
        - name: kimi-k25-2p1d-tp4
          topology: 2p1d
          pd_worker_layout: prefill_single_node
          nodes: "${ATOMESH_2P1D_NODES}"
          isl: [8192]
          osl: 1024
          concurrency: [256, 512, 768, 1024]
          prefill:
            workers: 2
            tp: 4
          decode:
            workers: 1
            tp: 4
            cudagraph: >-
              [8,16,24,32,40,48,56,64,72,80,88,96,104,112,120,128,136,144,152,160,168,176,184,192,200,208,216,224,232,240,248,256,264,272,280,288,296,304,312,320,328,336,344,352,360,368,376,384,392,400,408,416,424,432,440,448,456,464,472,480,488,496,504,512,520,528,536,544,552,560,568,576,584,592,600,608,616,624,632,640,648,656,664,672,680,688,696,704,712,720,728,736,744,752,760,768,776,784,792,800,808,816,824,832,840,848,856,864,872,880,888,896,904,912,920,928,936,944,952,960,968,976,984,992,1000,1008,1016,1024]
          server:
            common_args:
              decode_max_num_seqs: 1024
          benchmark:
            wait_server_timeout: 4500
          run_eval: true
          eval_concurrency: [128, 768]

        - name: kimi-k25-1p2d-tp4
          topology: 1p2d
          pd_worker_layout: decode_single_node
          nodes: "${ATOMESH_1P1D_NODES}"
          isl: [8192]
          osl: 1024
          concurrency: [256, 512, 768, 1024]
          prefill:
            workers: 1
            tp: 4
          decode:
            workers: 2
            tp: 4
            cudagraph: >-
