defaults:
  runner:
    slurm_account: ${ATOMESH_SLURM_ACCOUNT}
    slurm_partition: ${ATOMESH_SLURM_PARTITION}
    slurm_submit_runner: ${ATOMESH_SLURM_SUBMIT_RUNNER}
    gpus_per_node: 8
    cpus_per_task: 114
    time_limit: 08:00:00
    log_root: ${ATOMESH_LOG_ROOT}
  benchmark:
    random_range_ratio: 0.8
    request_rate: inf
    num_prompts_multiplier: 10
    wait_server_timeout: 5000
    wait_router_timeout: 300
  env:
    common:
      PYTHONUNBUFFERED: '1'
      ATOM_PD_RANK_MAPPING_POLICY: ${ATOMESH_PD_RANK_MAPPING_POLICY}
backends:
  atom:
    image: rocm/atom-dev:latest
    server_script: .github/scripts/atomesh/pd_server_atom.sh
    env:
      common:
        AITER_LOG_LEVEL: WARNING
      prefill:
        ATOM_HOST_IP: ${ROLE_IP}
      decode:
        ATOM_HOST_IP: ${ROLE_IP}
    service:
      prefill:
        port: 8010
        tp: 8
      decode:
        port: 8020
        tp: 8
        cudagraph: '[1,2,4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,96,100,104,108,112,116,120,124,128,132,136,140,144,148,152,156,160,164,168,172,176,180,184,188,192,196,200,204,208,212,216,220,224,228,232,236,240,244,248,252,256]'
      router:
        port: 8000
        policy: random
        prometheus_port: 29100
  vllm:
    image: vllm/vllm-openai-rocm:nightly-2eb491e18b1ce5b8a25e4c88f32dbb5d028d525c@sha256:e8851fcec92bfb9579136145a0500f97a2c7da5b82760df466cad66cadccf517
    service:
      prefill:
        port: 2584
        tp: 8
      decode:
        port: 2584
        tp: 8
      router:
        port: 30000
        policy: consistent_hash
    vllm:
      router:
        image: vllm/vllm-router:nightly-20260912-83944c4@sha256:ac68315ab8642c253571316a7ac377df51794665e5c20fb95e7b84b40f9021e3
        discovery_port: 36367
models:
  PR59070-Kimi-K3:
    backend: vllm
    model_path: /mnt/models/moonshotai/Kimi-K3
    precision: MXFP4
    env:
      common:
        PYTHONUNBUFFERED: '1'
        ATOM_PD_RANK_MAPPING_POLICY: none
        VLLM_ROCM_USE_AITER: '1'
        AITER_SITUV2_A8W4: '0'
        AITER_BF16_FP8_MOE_BOUND: '0'
        VLLM_ROCM_AITER_MLA_ASM_PADDING: asm
        SAFETENSORS_FAST_GPU: '1'
        VLLM_SSM_CONV_STATE_LAYOUT: DS
        AITER_QUICK_REDUCE_QUANTIZATION: INT4
        PYTHONHASHSEED: '42'
        PREFIX_CACHING_HASH_ALGO: sha256
        VLLM_USE_DIRECT_DCP_A2A: '0'
        VLLM_USE_DIRECT_DCP_Q_GATHER: '0'
        VLLM_USE_DIRECT_DCP_KV_GATHER: '0'
        VLLM_ENGINE_READY_TIMEOUT_S: '7200'
        VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1200'
        VLLM_SERVER_DEV_MODE: '1'
        VLLM_DISABLE_REQUEST_ID_RANDOMIZATION: '1'
        PYTHONNOUSERSITE: '1'
        PYTHONDONTWRITEBYTECODE: '1'
        HSA_ENABLE_SDMA: '1'
        AITER_SITUV2_A4W4: '1'
        AITER_FLYDSL_STAGE2_FP8: '1'
        AITER_LOG_LEVEL: WARNING
        VLLM_DCP_Q_REPLICATE: '0'
        VLLM_USE_BREAKABLE_CUDAGRAPH: '1'
        TORCH_NCCL_BLOCKING_WAIT: '0'
        NCCL_BLOCKING_WAIT: '0'
        HIP_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
        VLLM_ROCM_AITER_MLA_DCP_VERIFY: asm
        VLLM_HOST_IP: 127.0.0.1
        GLOO_SOCKET_IFNAME: lo
        VLLM_USE_V2_MODEL_RUNNER: '1'
        VLLM_ROCM_USE_AITER_MOE_SITUV2: a4w4
        VLLM_ROCM_USE_AITER_CUSTOM_AR: '1'
    vllm:
      served_model_name: Kimi-K3
      source:
        repo: https://github.com/whx-sjtu/vllm
        sha: e95f8244876ce45196b6cbb821ab5802ceef40d7
    server:
      common_args:
        extra_args: '--served-model-name Kimi-K3 --port 2594 --trust-remote-code --tensor-parallel-size
          8 --decode-context-parallel-size 8 --moe-backend auto --load-format safetensors
          --gpu-memory-utilization 0.88 --language-model-only --max-num-seqs 80 --enable-auto-tool-choice
          --tool-call-parser kimi_k3 --reasoning-parser kimi_k3 --max-model-len 1048576
          --stream-interval 10 --enable-prefix-caching --prefix-match-unit 128 --kv-cache-dtype
          fp8 --block-size 128 --max-num-batched-tokens 16384 --attention-config ''{"mla_prefill_backend":"ROCM_AITER_FA","use_prefill_query_quantization":true}''
          --attention-backend ROCM_AITER_MLA --dcp-comm-backend a2a --cp-kv-cache-interleave-size
          1 --speculative-config ''{"model": "/mnt/models/Inferact/Kimi-K3-DSpark",
          "num_speculative_tokens": 3, "method": "dspark", "attention_backend": "ROCM_AITER_MLA",
          "kv_cache_dtype": "fp8", "draft_sample_method": "probabilistic", "rejection_sample_method":
          "standard"}'' --quantization-config ''{"targets":{"re:.*\\.routed_expert_down_proj$":"mxfp4","re:.*\\.self_attn\\.(in_proj_qkvgfab|f_b_proj|o_proj|fused_qkv_a_proj|q_b_proj|g_proj)$":"fp8_per_channel","re:.*\\.shared_experts\\.(gate_up_proj|down_proj)$":"fp8_per_channel","re:.*\\.mlp\\.(gate_up_proj|down_proj)$":"fp8_per_channel"}}''
          --compilation-config ''{"mode":3,"cudagraph_mode":"FULL_AND_PIECEWISE","max_cudagraph_capture_size":512,"custom_ops":["+fused_rms_norm_gated"],"cudagraph_capture_sizes":[1,2,4,8,16,24,32,40,48,56,64,72,80,88,96,104,112,120,128,136,144,152,160,168,176,184,192,200,208,216,224,232,240,248,256,272,288,304,320,336,352,368,384,400,416,432,448,464,480,496,512]}''
          --enable-prompt-tokens-details'
    accuracy:
      task: gsm8k
      fewshot: 5
      limit: null
      concurrency:
      - 16
      max_gen_toks: 8192
      batch_size: 1
      threshold: 0.94
    suites:
      vllm:
      - name: pr59070-k3-full-gsm8k-ab
        topology: 0p1d
        display_topology: Single-instance TP8/DCP8 full GSM8K A/B
        pd_worker_layout: multi_node
        nodes: ${ATOMESH_1P1D_NODES}
        isl:
        - 1048576
        osl: 8192
        concurrency:
        - 16
        prefill:
          workers: 0
          tp: 8
          dcp: 8
        decode:
          workers: 1
          tp: 8
          dcp: 8
        runner:
          time_limit: 06:00:00
        benchmark:
          kind: random
          wait_server_timeout: 7200
        run_eval: true
