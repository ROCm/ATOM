              decode_max_num_seqs: 1024
          benchmark:
            wait_server_timeout: 4500
          run_eval: true
          eval_concurrency: [128, 768]

      # gsm8k-only PD cell over MoRI IO. Prefill and decode each own a node, so
      # the KV transfer crosses the ionic fabric rather than staying local.
      accuracy:
        - name: kimi-k25-1p1d-tp8-moriio-gsm8k
          topology: 1p1d_tp8_moriio
          pd_worker_layout: multi_node
