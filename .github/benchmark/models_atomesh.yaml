      decode:
        DECODE_KV_TRANSFER_CONFIG: >-
          {"kv_role":"kv_consumer","kv_connector":"mooncake","proxy_ip":"${ROLE_IP}","handshake_port":${HANDSHAKE_PORT},"protocol":"rdma"}
    server:
      common_args:
        trust_remote_code: true
        kv_cache_dtype: fp8
        block_size: 256
        enable_prefix_caching: true
        gpu_memory_utilization: 0.9
        max_model_len: ""
        max_num_batched_tokens: 16384
        method: dspark
        num_speculative_tokens: 3
        # Benchmark-only AL from recipes/DeepSeek-V4-Agentic-PD-Max.md.
