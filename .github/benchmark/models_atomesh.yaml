          isl: [8192]
          osl: 1024
          concurrency: [64]
          prefill:
            workers: 1
            tp: 8
          decode:
            workers: 1
            tp: 8
            cudagraph: >-
              [8,16,24,32,40,48,56,64,72,80,88,96,104,112,120,128,136,144,152,160,168,176,184,192,200,208,216,224,232,240,248,256]
          server:
            common_args:
              decode_max_num_seqs: 256
              # Kimi-K2.5 thinks by default. lm_eval scores message content,
              # and a reasoning model cut off at max_gen_toks mid-thought
              # returns none. The template's own switch is named "thinking".
              extra_args: '--default-chat-template-kwargs {"thinking":false}'
          env:
            common:
              KV_CONNECTOR: moriio
              ATOM_MORIIO_MODE: write
            decode:
              # Empty drops the model-level Mooncake JSON for the built-in config.
              DECODE_KV_TRANSFER_CONFIG: ""
          benchmark:
            wait_server_timeout: 4500
          run_eval: true
          eval_only: true
          eval_concurrency: [64]
          accuracy:
