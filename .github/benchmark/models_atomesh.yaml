            cudagraph_mode: FULL
            compilation_level: 3
            extra_args: ""
          benchmark:
            kind: random
          run_eval: true
          eval_only: true
          accuracy:
            task: gsm8k
            fewshot: 5
            eval_concurrency: [16]
            model_type: local-chat-completions
            endpoint: chat/completions
            max_gen_toks: 4096
            apply_chat_template: true

  # Bring-up model for the MoRI IO PD KV path. Text-only, ships a real
  # tokenizer.json so the router can register one, and its FP8 weights keep
  # quantization out of the picture -- but the KV path under test is the same
  # 61-layer MLA as the MXFP4 models.
  DeepSeek-V3:
    backend: atom
    model_path: "${ATOMESH_MODEL_ROOT}/deepseek-ai/DeepSeek-V3/"
    precision: FP8
    env:
      common:
        # Mooncake's RoCE GID index. MoRI IO reads MORI_IB_GID_INDEX instead,
        # so setting this once keeps the two cells below differing in nothing
        # but KV_CONNECTOR.
        MC_GID_INDEX: "1"
        # MoRI IO only, set here for the same reason; see the Kimi-K2.5 cell.
        ATOM_MORIIO_MODE: write
      prefill: {}
      decode: {}
    server:
      common_args:
        trust_remote_code: true
        kv_cache_dtype: fp8
        block_size: 16
        enable_prefix_caching: false
        gpu_memory_utilization: 0.9
        max_num_seqs: 256
        max_num_batched_tokens: 32768
        max_model_len: 32768
        extra_args: ""
    suites:
      accuracy:
        # A control and its variant. Neither sets a *_KV_TRANSFER_CONFIG, so
        # both take the built-in config and the merge key makes the connector
        # the only difference between them. A score gap therefore lands on the
        # connector rather than on the model, the eval, or ATOM's PD layer.
        - &dsv3_pd_gsm8k
          name: ds-v3-1p1d-tp8-mooncake-gsm8k
          topology: 1p1d_tp8_mooncake
          display_topology: 1P1D-MOONCAKE-TP8
          pd_worker_layout: multi_node
          nodes: "${ATOMESH_1P1D_NODES}"
          isl: [8192]
          osl: 1024
          concurrency: [64]
          prefill:
            workers: 1
            tp: 8
          decode:
            workers: 1
            tp: 8
            cudagraph: "[8,16,24,32,40,48,56,64]"
          server:
            common_args:
              decode_max_num_seqs: 256
          env:
            common:
              KV_CONNECTOR: mooncake
          benchmark:
            wait_server_timeout: 4500
          run_eval: true
          eval_only: true
          eval_concurrency: [64]
          accuracy:
            threshold: 0.90
        - <<: *dsv3_pd_gsm8k
          name: ds-v3-1p1d-tp8-moriio-gsm8k
          topology: 1p1d_tp8_moriio
          display_topology: 1P1D-MORIIO-TP8
          env:
            common:
              KV_CONNECTOR: moriio

    accuracy:
      task: gsm8k
      fewshot: 5
      model_type: local-chat-completions
      endpoint: chat/completions
      # V3 is not a reasoning model, so gsm8k answers are short.
      max_gen_toks: 512
      apply_chat_template: true
