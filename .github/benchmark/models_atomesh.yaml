defaults:
  runner:
    slurm_account: "${ATOMESH_SLURM_ACCOUNT}"
    slurm_partition: "${ATOMESH_SLURM_PARTITION}"
    slurm_submit_runner: "${ATOMESH_SLURM_SUBMIT_RUNNER}"
    gpus_per_node: 8
    cpus_per_task: 114
    time_limit: "08:00:00"
    log_root: "${ATOMESH_LOG_ROOT}"
  benchmark:
    random_range_ratio: 0.8
    request_rate: inf
    num_prompts_multiplier: 10
    wait_server_timeout: 5000
    wait_router_timeout: 300
  env:
    common:
      PYTHONUNBUFFERED: "1"
      ATOM_PD_RANK_MAPPING_POLICY: "${ATOMESH_PD_RANK_MAPPING_POLICY}"

backends:
  atom:
    image: rocm/atom-dev:latest
    server_script: .github/scripts/atomesh/pd_server_atom.sh
    env:
      common:
        AITER_LOG_LEVEL: WARNING
      prefill:
        ATOM_HOST_IP: "${ROLE_IP}"
      decode:
        ATOM_HOST_IP: "${ROLE_IP}"
    service:
      prefill:
        port: 8010
        tp: 8
      decode:
        port: 8020
        tp: 8
        cudagraph: >-
          [1,2,4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,96,100,104,108,112,116,120,124,128,132,136,140,144,148,152,156,160,164,168,172,176,180,184,188,192,196,200,204,208,212,216,220,224,228,232,236,240,244,248,252,256]
      router:
        port: 8000
        policy: random
        prometheus_port: 29100
  vllm:
    image: vllm/vllm-openai-rocm:nightly@sha256:91e381f072d6a44e1e4c97c82dce06e50e5189905cb3999a11471c5a8fc6a563
    service:
      prefill:
        port: 2584
        tp: 8
      decode:
        port: 2584
        tp: 8
      router:
        port: 30000
        policy: consistent_hash
    vllm:
      router:
        image: vllm/vllm-router:nightly-20260912-83944c4@sha256:ac68315ab8642c253571316a7ac377df51794665e5c20fb95e7b84b40f9021e3
        discovery_port: 36367

models:
  DeepSeek-V4-Pro:
    backend: atom
    model_path: "${ATOMESH_MODEL_ROOT}/deepseek-ai/DeepSeek-V4-Pro/"
    precision: FP4
    env:
      common:
        AITER_BF16_FP8_MOE_BOUND: "0"
        ATOM_MOE_GU_ITLV: "1"
        MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
      prefill: {}
      decode: {}
    server:
      common_args:
        trust_remote_code: true
        kv_cache_dtype: fp8
        block_size: 16
        enable_prefix_caching: false
        gpu_memory_utilization: 0.85
        max_num_seqs: 512
        extra_args: ""
    suites:
      smoke:
        - name: ds-v4-1p1d-tp8-smoke
          topology: 1p1d
          pd_worker_layout: multi_node
          nodes: "${ATOMESH_1P1D_NODES}"
          isl: [8192]
          osl: 1024
          concurrency: [4, 8]
          run_eval: true
          eval_limit: 64

      nightly:
        - name: ds-v4-1p1d-tp8
          topology: 1p1d
          pd_worker_layout: multi_node
          nodes: "${ATOMESH_1P1D_NODES}"
          isl: [8192]
          osl: 1024
          concurrency: [1, 2, 4, 8, 16, 32, 64, 128]
          run_eval: true

        - name: ds-v4-1p1d-dpa-tp8
          topology: 1p1d_dpa
          pd_worker_layout: multi_node
          nodes: "${ATOMESH_1P1D_NODES}"
          env:
            prefill:
              GPU_MAX_HW_QUEUES: "5"
              ATOM_NUMA_BIND: "1"         
          isl: [8192]
          osl: 1024
          concurrency: [256, 512]
          prefill:
            workers: 1
            tp: 8
            extra_args: "--enable-dp-attention --enable-tbo"
          decode:
            workers: 1
            tp: 8
            extra_args: "--enable-dp-attention"
          benchmark:
            wait_server_timeout: 4500

        - name: ds-v4-1p1d-tp8-mtp3
          topology: 1p1d_mtp3
          pd_worker_layout: multi_node
          nodes: "${ATOMESH_1P1D_NODES}"
          isl: [8192]
          osl: 1024
          concurrency: [1, 2, 4, 8, 16, 32, 64, 128]
          prefill:
            workers: 1
            tp: 8
            extra_args: "--method mtp --num-speculative-tokens 3"
          decode:
            workers: 1
            tp: 8
            extra_args: "--method mtp --num-speculative-tokens 3"
          benchmark:
            wait_server_timeout: 4500
          run_eval: true

        - name: ds-v4-1p1d-dpa-tp8-mtp1
          topology: 1p1d_dpa_mtp1
          pd_worker_layout: multi_node
          nodes: "${ATOMESH_1P1D_NODES}"
          env:
            prefill:
              GPU_MAX_HW_QUEUES: "5"
              ATOM_NUMA_BIND: "1"
          isl: [8192]
          osl: 1024
          concurrency: [256, 512]
          prefill:
            workers: 1
            tp: 8
            extra_args: "--method mtp --num-speculative-tokens 1 --enable-dp-attention --enable-tbo"
          decode:
            workers: 1
            tp: 8
            extra_args: "--method mtp --num-speculative-tokens 1 --enable-dp-attention"
          benchmark:
            wait_server_timeout: 4500

        # - name: ds-v4-2p1d-dpa-tp8
        #   topology: 2p1d_dpa
        #   pd_worker_layout: multi_node
        #   nodes: "${ATOMESH_2P1D_NODES}"
        #   env:
        #     prefill:
        #       GPU_MAX_HW_QUEUES: "5"
        #       ATOM_NUMA_BIND: "1"
        #   isl: [8192]
        #   osl: 1024
        #   concurrency: [256, 512, 1024, 2048]
        #   prefill:
        #     workers: 2
        #     tp: 8
        #     extra_args: "--enable-dp-attention --enable-tbo"
        #   decode:
        #     workers: 1
        #     tp: 8
        #     extra_args: "--enable-dp-attention"
        #   benchmark:
        #     wait_server_timeout: 4500
        #   run_eval: true

    accuracy:
      task: gsm8k
      fewshot: 3
      limit: null

  GLM-5.2-MXFP4:
    backend: atom
    model_path: "${ATOMESH_MODEL_ROOT}/amd/GLM-5.2-MXFP4"
    precision: MXFP4
    env:
      common:
        AITER_QUICK_REDUCE_QUANTIZATION: INT4
        AITER_USE_FLYDSL_MOE_SORTING: "1"
        MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
      prefill: {}
      decode: {}
    service:
      prefill:
        cudagraph_mode: FULL_AND_PIECEWISE
      decode:
        cudagraph_mode: FULL_AND_PIECEWISE
    server:
      common_args:
        trust_remote_code: true
        kv_cache_dtype: fp8
        enable_prefix_caching: false
        gpu_memory_utilization: 0.8
        max_num_batched_tokens: 16384
        max_model_len: 16384
        extra_args: '--default-chat-template-kwargs {"enable_thinking":false}'
    suites:
      nightly:
        - name: glm-52-mxfp4-1p1d-tp4
          topology: 1p1d
          pd_worker_layout: single_node
          nodes: "${ATOMESH_1P1D_NODES}"
          isl: [8192]
          osl: 1024
          concurrency: [1, 2, 4, 8, 16, 32, 64, 128, 256]
          prefill:
            workers: 1
            tp: 4
          decode:
            workers: 1
            tp: 4
          env:
            prefill:
              HIP_VISIBLE_DEVICES: "0,1,2,3"
            decode:
              HIP_VISIBLE_DEVICES: "4,5,6,7"
              DECODE_KV_TRANSFER_CONFIG: >-
                {"kv_role":"kv_consumer","kv_connector":"mooncake","proxy_ip":"${ROLE_IP}","handshake_port":6301,"ib_enable_alternate_hca":true,"ib_hca_count":8}
          benchmark:
            wait_server_timeout: 1800
          run_eval: true
          eval_concurrency: [65]

        - name: glm-52-mxfp4-1p1d-tp8
          topology: 1p1d
          pd_worker_layout: multi_node
          nodes: "${ATOMESH_1P1D_NODES}"
          isl: [8192]
          osl: 1024
          concurrency: [1, 2, 4, 8, 16, 32, 64, 128, 256]
          prefill:
            workers: 1
            tp: 8
          decode:
            workers: 1
            tp: 8
          benchmark:
            wait_server_timeout: 1800
          run_eval: true
          eval_concurrency: [65]

        # Keep each AgentX concurrency in its own job so every measurement starts
        # from a fresh ATOM service instead of inheriting HBM prefix-cache state.
        - <<: &glm52_agentic_tp4_tp4
            topology: 1p1d
            pd_worker_layout: single_node
            nodes: "${ATOMESH_1P1D_NODES}"
            isl: [1048576]
            osl: 1024
            server:
              common_args: &glm52_agentic_args
                kv_cache_dtype: fp8
                block_size: 16
                gpu_memory_utilization: 0.9
                max_model_len: ""
                max_num_seqs: 512
                enable_prefix_caching: true
                decode_max_num_seqs: 512
                max_num_batched_tokens: ""
                decode_max_num_batched_tokens: ""
                online_quant_config: '{"global_quant_config":"ptpc_fp8","exclude_layer":["lm_head","model.embed_tokens","*.mlp.gate","*expert*"]}'
            prefill:
              workers: 1
              tp: 4
            decode:
              workers: 1
              tp: 4
              cudagraph: none
            env:
              common:
                MC_DISABLE_HIP: "1"
              prefill:
                HIP_VISIBLE_DEVICES: "0,1,2,3"
              decode:
                MAX_JOBS: "16"
                HIP_VISIBLE_DEVICES: "4,5,6,7"
            benchmark: &agentic_1m_aiperf
              kind: aiperf_agentic
              aiperf_commit: b7b16cf851885567988a643282266bce74e34437
              scenario: inferencex-agentx-mvp
              public_dataset: semianalysis_cc_traces_weka_062126
              apply_chat_template: true
              max_context_length: 1048576
              num_dataset_entries: 393
              benchmark_duration: 3600
              warmup_requests_per_lane: 10
              trace_idle_gap_cap_seconds: 300
              warmup_grace_period: 1800
              trajectory_start_min_ratio: 0.25
              trajectory_start_max_ratio: 0.75
              failed_request_threshold: 0.10
              slice_duration: 1.0
              cancel_drain_timeout: 300
              http_tcp_user_timeout: 900000
              dataset_weka_live_assistant_responses: 0
              dataset_configuration_timeout: 1800
              service_profile_configure_timeout: 1800
              wait_server_timeout: 4500
              wait_router_timeout: 600
            run_eval: false
          name: glm-52-mxfp4-1p1d-tp4-agentic-1m-c1
          concurrency: [1]
          server:
            common_args: &glm52_agentic_mtp_args
              <<: *glm52_agentic_args
              extra_args: "--method mtp --num-speculative-tokens 4 --spec-decode-acceptance-rate 0.5825"

        - <<: *glm52_agentic_tp4_tp4
          name: glm-52-mxfp4-1p1d-tp4-agentic-1m-c2
          concurrency: [2]
          server:
            common_args: *glm52_agentic_mtp_args

        - <<: *glm52_agentic_tp4_tp4
          name: glm-52-mxfp4-1p1d-tp4-agentic-1m-c4
          concurrency: [4]
          server:
            common_args: *glm52_agentic_mtp_args

        - <<: *glm52_agentic_tp4_tp4
          name: glm-52-mxfp4-1p1d-tp4-agentic-1m-c8
          concurrency: [8]
          server:
            common_args: *glm52_agentic_mtp_args

        # CPP4 prefill (PP4 x TP1) paired with TP4+DCP4 decode on one node.
        - &glm52_agentic_lmcache_cpp4_dcp4
          <<: *glm52_agentic_tp4_tp4
          name: glm-52-mxfp4-1p1d-cpp4-dcp4-agentic-lmcache-1m-c48
          topology: 1p1d_cpp4_dcp4
          pd_worker_layout: single_node
          concurrency: [48]
          server:
            common_args:
              kv_cache_dtype: fp8
              block_size: 16
              max_num_seqs: 512
              enable_prefix_caching: true
              decode_max_num_seqs: 512
              # Empty means "do not pass the flag", so the model config's own
              # context length applies. The 16384 the model defaults carry would
              # truncate this suite's 1M agentic traces.
              max_model_len: ""
              max_num_batched_tokens: ""
              decode_max_num_batched_tokens: ""
              online_quant_config: '{"global_quant_config":"ptpc_fp8","exclude_layer":["lm_head","model.embed_tokens","*.mlp.gate","*expert*"]}'
              gpu_memory_utilization: 0.85
              extra_args: "--level 3 --method mtp --num-speculative-tokens 3 --spec-decode-acceptance-rate 0.6633"
          prefill:
            workers: 1
            tp: 1
            cudagraph: none
            extra_args: "--pipeline-parallel-size 4 --enforce-eager --max-num-batched-tokens 8192"
          decode:
            workers: 1
            tp: 4
            cudagraph: >-
              [1,2,4,8,16,24,32,40,48,56,64,72,80,88,96,104,112,120,128,136,144,152,160,168,176,184,192,200,208,216,224,232,240,248,256]
            extra_args: "--decode-context-parallel-size 4 --cudagraph-mode FULL"
          env:
            common:
              # Force RDMA to avoid HIP IPC shared-pool address corruption.
              MC_DISABLE_HIP: "1"
              ATOM_MLA_PAGE_SIZE: "1"
              ATOM_ONLINE_QUANT_STREAMING: "0"
              ATOM_SPARSE_INDEXER_LOGITS_BUDGET_MB: "2047"
              ATOM_USE_TRITON_MLA: "0"
              MAX_JOBS: "16"
              PYTHONHASHSEED: "0"
              TOPK_FORCE_PATH: "one"
            prefill:
              HIP_VISIBLE_DEVICES: "0,1,2,3"
              VLLM_PP_LAYER_PARTITION: "20,20,20,18"
              LMCACHE_LOCAL_CPU: "True"
              LMCACHE_MAX_LOCAL_CPU_SIZE: "256"
              LMCACHE_CHUNK_SIZE: "256"
              # Disk/NVMe (L3) tier is disabled by default. To enable it, uncomment
              # both variables below; LMCACHE_MAX_LOCAL_CPU_SIZE must stay > 0
              # because LocalDiskBackend stages through the host allocator.
              # scale_cpu_size_for_pp splits only the CPU budget across PP
              # stages, so this size is per rank: 4 x 500GiB on a pp4 prefill.
              # pd_server_atom.sh empties the directory around the run.
              # Relative to this job's runtime log directory, under rank-N.
              # LMCACHE_LOCAL_DISK: "./lmcache-job"
              # LMCACHE_MAX_LOCAL_DISK_SIZE: "500"
              OFFLOAD_PROFILE: "1"
              OFFLOAD_MIN_LOAD_TOKENS: "0"
              PREFILL_KV_TRANSFER_CONFIG: >-
                {"kv_connector":"multi","connectors":[{"kv_connector":"mooncake","kv_role":"kv_producer","proxy_ip":"${ROLE_IP}","handshake_port":${HANDSHAKE_PORT},"protocol":"rdma"},{"kv_connector":"lmcache_offload","kv_role":"offload"}]}
            decode:
              HIP_VISIBLE_DEVICES: "4,5,6,7"
              DECODE_KV_TRANSFER_CONFIG: >-
                {"kv_connector":"mooncake","kv_role":"kv_consumer","proxy_ip":"${ROLE_IP}","handshake_port":${HANDSHAKE_PORT},"protocol":"rdma"}

        - <<: *glm52_agentic_lmcache_cpp4_dcp4
          name: glm-52-mxfp4-1p1d-cpp4-dcp4-agentic-lmcache-1m-c32
          concurrency: [32]

        - <<: *glm52_agentic_lmcache_cpp4_dcp4
          name: glm-52-mxfp4-1p1d-cpp4-dcp4-agentic-lmcache-1m-c40
          concurrency: [40]

        - <<: *glm52_agentic_lmcache_cpp4_dcp4
          name: glm-52-mxfp4-1p1d-cpp4-dcp4-agentic-lmcache-1m-c56
          concurrency: [56]

        - &glm52_agentic_lmcache_tp4_dpa
          <<: *glm52_agentic_tp4_tp4
          name: glm-52-mxfp4-1p1d-tp4-dpa-agentic-lmcache-1m-c24
          topology: 1p1d_dpa
          pd_worker_layout: single_node
          concurrency: [24]
          prefill:
            workers: 1
            tp: 4
            extra_args: >-
              --enable-dp-attention
              --attn-prefill-chunk-size 131072
              --long-prefill-token-threshold 131072
          decode:
            workers: 1
            tp: 4
            cudagraph: none
            extra_args: "--enable-dp-attention"
          env:
            common:
              PYTHONHASHSEED: "0"
            prefill:
              LMCACHE_LOCAL_CPU: "True"
              LMCACHE_MAX_LOCAL_CPU_SIZE: "256"
              LMCACHE_CHUNK_SIZE: "256"
              PREFILL_KV_TRANSFER_CONFIG: >-
                {"kv_connector":"multi","connectors":[{"kv_connector":"mooncake","kv_role":"kv_producer","proxy_ip":"${ROLE_IP}","handshake_port":6301},{"kv_connector":"lmcache_offload","kv_role":"offload"}]}
              HIP_VISIBLE_DEVICES: "0,1,2,3"
            decode:
              MAX_JOBS: "16"
              HIP_VISIBLE_DEVICES: "4,5,6,7"
              DECODE_KV_TRANSFER_CONFIG: >-
                {"kv_role":"kv_consumer","kv_connector":"mooncake","proxy_ip":"${ROLE_IP}","handshake_port":6301,"ib_enable_alternate_hca":true,"ib_hca_count":8}

        - <<: *glm52_agentic_lmcache_tp4_dpa
          name: glm-52-mxfp4-1p1d-tp4-dpa-agentic-lmcache-1m-c32
          concurrency: [32]

        - <<: *glm52_agentic_lmcache_tp4_dpa
          name: glm-52-mxfp4-1p1d-tp4-dpa-agentic-lmcache-1m-c48
          concurrency: [48]

    accuracy:
      task: gsm8k
      fewshot: 20
      limit: null
      model_type: local-completions
      endpoint: completions

  Kimi-K3-MXFP4:
    backend: atom
    model_path: "${ATOMESH_MODEL_ROOT}/moonshotai/Kimi-K3"
    precision: MXFP4
    env:
      common:
        PYTHONNOUSERSITE: "1"
        PYTHONHASHSEED: "0"
        AITER_SITUV2_A4W4: "1"
        AITER_QUICK_REDUCE_QUANTIZATION: INT4
        AITER_FLYDSL_STAGE2_FP8: "1"
        # AgentX enables comm-group reuse only on C56/C64.
        AITER_REUSE_IDENTICAL_COMM_GROUPS: "0"
        ATOM_MLA_MAX_SPLIT_PER_BATCH: "256"
        ATOM_STATE_CHECKPOINT_DEMAND: "0"
        # AgentX band default: ReplaySSM off on CONC 1/2/4, on for the mid band
        # (CONC 8-16), off again from CONC 32. Cases that declare their own env
        # block must restate the key, because a YAML merge key loses to an
        # explicit `env:` on the same node.
        ATOM_ENABLE_REPLAYSSM: "0"
      prefill: {}
      decode: {}
    server:
      common_args:
        trust_remote_code: true
        kv_cache_dtype: fp8
        block_size: 128
        enable_prefix_caching: true
        max_model_len: ""
        state_checkpoint_interval_tokens: -1
        online_quant_config: '{"global_quant_config":"ptpc_fp8","exclude_layer":["lm_head","model.embed_tokens","*self_attn.[qkv]_conv1d*","*block_sparse_moe.experts*","*block_sparse_moe.routed_expert_*","*vision_tower*","*mm_projector*"]}'
    suites:
      nightly:
        # One concurrency per job keeps the prefix/state caches independent.
        - <<: &kimi_k3_agentic_tp8
            topology: 1p1d
            display_topology: 1P1D-TP8-DSPARK7
            pd_worker_layout: multi_node
            nodes: "${ATOMESH_1P1D_NODES}"
            isl: [1048576]
            osl: 1024
            server:
              common_args: &kimi_k3_agentic_dspark7_args
                gpu_memory_utilization: 0.88
                max_num_seqs: 32
                max_num_batched_tokens: 8192
                method: dspark
                draft_model: "${ATOMESH_MODEL_ROOT}/Inferact/Kimi-K3-DSpark"
                num_speculative_tokens: 7
                spec_decode_acceptance_length: 3.84
            prefill:
              workers: 1
              tp: 8
            decode:
              workers: 1
              tp: 8
              # AgentX pins the compile path and captures the dense query-token
              # range 2..2*CONC*(1+spec) that `auto` derives per concurrency.
              cudagraph: auto
              cudagraph_mode: FULL
              compilation_level: 3
            benchmark:
              <<: *agentic_1m_aiperf
              aiperf_commit: 754356e9a39acc6cc6afb242d123bb57c3fb6f75
            run_eval: false
          name: kimi-k3-mxfp4-1p1d-tp8-dspark7-agentic-1m-c1
          concurrency: [1]

        - <<: *kimi_k3_agentic_tp8
          name: kimi-k3-mxfp4-1p1d-tp8-dspark7-agentic-1m-c2
          concurrency: [2]

        - <<: *kimi_k3_agentic_tp8
          name: kimi-k3-mxfp4-1p1d-tp8-dspark7-agentic-1m-c4
          concurrency: [4]
          run_eval: true
          eval_concurrency: [4]

        - &kimi_k3_agentic_dcp8_lmcache
          <<: *kimi_k3_agentic_tp8
          name: kimi-k3-mxfp4-1p1d-tp8-dcp8-dspark3-agentic-lmcache-1m-c8
          display_topology: 1P1D-TP8-DCP8-DSPARK3
          concurrency: [8]
          server:
            common_args: &kimi_k3_agentic_dspark3_args
              gpu_memory_utilization: 0.88
              max_num_seqs: 32
              max_num_batched_tokens: 4096
              method: dspark
              draft_model: "${ATOMESH_MODEL_ROOT}/Inferact/Kimi-K3-DSpark"
              num_speculative_tokens: 3
              spec_decode_acceptance_length: 3.00
          prefill:
            workers: 1
            tp: 8
            dcp: 8
          decode:
            workers: 1
            tp: 8
            dcp: 8
            cudagraph: auto
            cudagraph_mode: FULL
            compilation_level: 3
          env:
            common:
              ATOM_ENABLE_REPLAYSSM: "1"
            prefill: &kimi_k3_agentic_lmcache128_env
              LMCACHE_LOCAL_CPU: "True"
              LMCACHE_MAX_LOCAL_CPU_SIZE: "128"
              LMCACHE_CHUNK_SIZE: "1024"
              LMCACHE_NUMA_MODE: auto
              LMCACHE_ENABLE_OUTPUT_PATH_MODE: "1"
              LMCACHE_ENABLE_LAYOUT_FILE_MODE: "1"
              ATOM_NUMA_BIND: "1"
              ATOM_NUMA_NODE: "0,0,0,0,1,1,1,1"
              # Auto-binding off so the explicit ATOM_NUMA_NODE map is what takes effect.
              ATOM_AUTO_NUMA_BIND: "0"
              OFFLOAD_KV_FOR_HYBRID: "1"
              OFFLOAD_PROFILE: "1"
              OFFLOAD_GPU_STAGING_CHUNKS: "32"
              PREFILL_KV_TRANSFER_CONFIG: >-
                {"kv_connector":"multi","connectors":[{"kv_connector":"mooncake","kv_role":"kv_producer","proxy_ip":"${ROLE_IP}","handshake_port":6301},{"kv_connector":"lmcache_offload","kv_role":"offload"}]}

        - <<: *kimi_k3_agentic_dcp8_lmcache
          name: kimi-k3-mxfp4-1p1d-tp8-dcp8-dspark3-agentic-lmcache-1m-c12
          concurrency: [12]
          server:
            common_args:
              <<: *kimi_k3_agentic_dspark3_args
              max_num_seqs: 24

        # C14 runs the C16 server verbatim and only moves the client, so it also
        # keeps C16's CUDA-graph width: deriving it from 2*CONC gives 28 and the
        # server dies during graph warmup. cudagraph_max_num_seqs pins the window
        # back to 32, which lands the same graph_max 128 as C16.
        - <<: *kimi_k3_agentic_dcp8_lmcache
          name: kimi-k3-mxfp4-1p1d-tp8-dcp8-dspark3-agentic-lmcache-1m-c14
          concurrency: [14]
          server:
            common_args: &kimi_k3_agentic_dspark3_8192_args
              <<: *kimi_k3_agentic_dspark3_args
              max_num_seqs: 32
              max_num_batched_tokens: 8192
              gpu_memory_utilization: 0.86
          decode:
            workers: 1
            tp: 8
            dcp: 8
            cudagraph: auto
            cudagraph_max_num_seqs: 32
            cudagraph_mode: FULL
            compilation_level: 3

        - <<: *kimi_k3_agentic_dcp8_lmcache
          name: kimi-k3-mxfp4-1p1d-tp8-dcp8-dspark3-agentic-lmcache-1m-c16
          concurrency: [16]
          server:
            common_args: *kimi_k3_agentic_dspark3_8192_args

        - &kimi_k3_agentic_no_dspark
          <<: *kimi_k3_agentic_dcp8_lmcache
          name: kimi-k3-mxfp4-1p1d-tp8-dcp8-agentic-lmcache-1m-c32
          display_topology: 1P1D-TP8-DCP8
          concurrency: [32]
          server:
            common_args: &kimi_k3_agentic_no_dspark_args
              gpu_memory_utilization: 0.86
              max_num_seqs: 64
              max_num_batched_tokens: 8192
          env:
            common:
              ATOM_ENABLE_REPLAYSSM: "0"
            # No CPU state tier here: the throughput band carries no draft model
            # and no ReplaySSM, so the whole per-rank CPU budget goes to the
            # paged KV instead of a state pool nothing replays from.
            prefill: *kimi_k3_agentic_lmcache128_env

        - <<: *kimi_k3_agentic_no_dspark
          name: kimi-k3-mxfp4-1p1d-tp8-dcp8-agentic-lmcache-1m-c40
          concurrency: [40]
          server:
            common_args:
              <<: *kimi_k3_agentic_no_dspark_args
              max_num_seqs: 80

        - <<: *kimi_k3_agentic_no_dspark
          name: kimi-k3-mxfp4-1p1d-tp8-dcp8-agentic-lmcache-1m-c56
          concurrency: [56]
          server:
            common_args:
              <<: *kimi_k3_agentic_no_dspark_args
              max_num_seqs: 112
          env:
            common:
              ATOM_ENABLE_REPLAYSSM: "0"
              AITER_REUSE_IDENTICAL_COMM_GROUPS: "1"
            prefill:
              <<: *kimi_k3_agentic_lmcache128_env
              LMCACHE_MAX_LOCAL_CPU_SIZE: "192"

        - <<: *kimi_k3_agentic_no_dspark
          name: kimi-k3-mxfp4-1p1d-tp8-dcp8-agentic-lmcache-1m-c64
          concurrency: [64]
          server:
            common_args:
              <<: *kimi_k3_agentic_no_dspark_args
              max_num_seqs: 128
          env:
            common:
              ATOM_ENABLE_REPLAYSSM: "0"
              AITER_REUSE_IDENTICAL_COMM_GROUPS: "1"
            prefill:
              <<: *kimi_k3_agentic_lmcache128_env
              LMCACHE_MAX_LOCAL_CPU_SIZE: "192"

    accuracy:
      task: gsm8k
      fewshot: 5
      limit: null
      model_type: local-chat-completions
      endpoint: chat/completions
      max_gen_toks: 512
      apply_chat_template: true
      threshold: 0.94

