global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: atom
    metrics_path: /metrics
    static_configs:
      # This address is resolved from Prometheus, not from your browser.
      # With Docker on Linux, the documented --network host uses the host's
      # loopback interface. Change this if ATOM runs on another machine.
      - targets: ["127.0.0.1:8000"]
