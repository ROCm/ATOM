[build-system]
requires = ["setuptools>=61", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "atom"
authors = [{ name = "ValarLip" }]
license = "MIT"
readme = "README.md"
description = "a lightweight vLLM implementation built from scratch"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = ["pybind11", "transformers==5.16.1", "zmq", "msgspec", "xxhash", "fastapi>=0.115,<0.137", "psutil", "prometheus_client>=0.25,<0.26", "protobuf", "uvicorn", "uvloop", "aiohttp", "datasets", "openpyxl", "tqdm", "setproctitle"]

[project.optional-dependencies]
# atom/diffusion only. Kept out of the base install because none of it is
# reachable from the LLM engine: PyAV muxes the H.264 + AAC MP4, Pillow does
# canvas preparation for image conditioning, and torchaudio resamples reference
# audio to the audio VAE's 32 kHz.
diffusion = ["av", "pillow", "torchaudio"]

[project.urls]
Homepage = "https://github.com/ROCm/ATOM"
Repository = "https://github.com/ROCm/ATOM"
Issues = "https://github.com/ROCm/ATOM/issues"

[tool.setuptools_scm]
write_to = "atom/_version.py"
write_to_template = "__version__ = '{version}'\n"
fallback_version = "0.1.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["atom*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
atom = [
    "mesh/target/release/libmesh.so",
    "benchmarks/results/schemas/*.json",
]

[project.entry-points."vllm.platform_plugins"]
# by default the entry-points will be installed anyway
# but the plugin mode for platforms can be disabled by 
# ATOM_DISABLE_VLLM_PLUGIN=1
atom = "atom.plugin.vllm.register:register_platform"

[project.entry-points."vllm.general_plugins"]
atom_model_registry = "atom.plugin.vllm.register:register_model"

[project.entry-points."sglang.srt.plugins"]
atom_sglang = "atom.plugin.sglang.register:register_plugin"

[tool.ruff.lint.per-file-ignores]
# FlyDSL consumes these nested functions with its AST rewriter; closure and
# framework-default lint rewrites change kernel semantics. The exemption
# follows the FILES, not the directory they used to sit in.
"atom/models/glm52/mono/kernels/*.py" = ["ALL"]
"atom/models/glm52/mono/kernels/**/*.py" = ["ALL"]
# The benches that compare ATOM's vendored copy against FlyDSL's own tree are
# vendored the same way and carry the same exemption -- black already excludes
# this directory below, for the same reason.
"tests/models/glm52/kernels/*.py" = ["ALL"]

[tool.black]
# The same exemption, for the same reason: the ruff ignores above do not bind
# black, and these trees are vendored from FlyDSL and kept byte-identical to
# upstream apart from import rewrites, so that the delta stays reviewable and
# can be offered back. Reformatting them both breaks that alignment and, per
# the note above, can change what FlyDSL's rewriter generates.
#
# `force-exclude`, not `extend-exclude`: extend-exclude is ignored for paths
# passed explicitly, which is exactly how both CI and the PostToolUse
# `auto_lint.py` hook invoke black (`black <file>` on the file just edited).
force-exclude = '''
/(
    atom/models/glm52/mono/kernels
  | tests/models/glm52/kernels
)/
'''
