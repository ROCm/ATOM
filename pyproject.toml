[build-system]
requires = ["setuptools>=61", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "atom"
authors = [{ name = "ValarLip" }]
license = "MIT"
readme = "README.md"
description = "a lightweight vLLM implementation built from scratch"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = ["pybind11", "transformers==5.12.1", "zmq", "msgspec", "xxhash", "fastapi>=0.115,<0.137", "psutil", "protobuf", "uvicorn", "uvloop", "aiohttp", "datasets", "openpyxl", "tqdm", "setproctitle"]

[project.urls]
Homepage = "https://github.com/ROCm/ATOM"
Repository = "https://github.com/ROCm/ATOM"
Issues = "https://github.com/ROCm/ATOM/issues"

[tool.setuptools_scm]
write_to = "atom/_version.py"
write_to_template = "__version__ = '{version}'\n"
fallback_version = "0.1.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["atom*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
atom = [
    "mesh/target/release/libmesh.so",
]

[tool.ruff]
target-version = "py310"
exclude = ["mi355_replay_traffic_20260718"]

[tool.ruff.lint]
ignore = [
    "BLE001",   # blind Exception catch — intentional for optional/fallback paths
    "S110",     # try-except-pass — used for best-effort cleanup
    "S102",     # exec usage — required by the codebase
    "S112",     # try-except-continue — intentional
    "TRY201",   # raise-within-except without from — style preference
    "TRY002",   # create own exception — too opinionated
    "TRY004",   # prefer TypeError — too opinionated
    "TRY401",   # redundant exception in logging.exception — sometimes intentional
    "PLW0602",  # global without assignment — intentional pattern
    "RUF012",   # mutable class variable not annotated with ClassVar
    "F822",     # undefined __all__ exports — dynamic imports
    "PYI034",   # __aenter__ return Self — stub-only rule
    "PYI019",   # methods return Self — stub-only rule
    "PYI059",   # generic not in stub — stub-only rule
    "PYI032",   # __eq__ arg type — stub-only rule
    "PYI006",   # bad version info — stub-only rule
    "PYI030",   # union literal — stub-only rule
    "PYI063",   # pre-PEP 570 positional-only — stub-only rule
    "PYI041",   # redundant numeric union — stub-only rule
    "G201",     # logging .exception with exc_info — intentional
    "ASYNC230", # async open — not applicable (sync on purpose)
    "N999",     # invalid module name — existing convention
    "PLR0124",  # x != x NaN check — idiomatic in Triton kernels
    "PLW0406",  # module imports itself — intentional for monkey-patching
    "PLW1508",  # invalid env-var default type — intentional
    "DTZ007",   # naive datetime — no timezone needed for local timestamps
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
".github/*" = ["S"]

[project.entry-points."vllm.platform_plugins"]
# by default the entry-points will be installed anyway
# but the plugin mode for platforms can be disabled by 
# ATOM_DISABLE_VLLM_PLUGIN=1
atom = "atom.plugin.vllm.register:register_platform"

[project.entry-points."vllm.general_plugins"]
atom_model_registry = "atom.plugin.vllm.register:register_model"
